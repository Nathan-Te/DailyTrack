name: Production
# Lot R1 (plateforme) : une fusion dans main part en production en trois temps, et seulement après la validation de Nathan.
#   1. recette : si la fusion touche le serveur (SERVER_PATHS, scripts/recette.mjs), la révision par défaut de la recette est mise à jour
#      (contrôle de /api/health et essai de bout en bout) ; sautée avec un message si la recette n'est pas configurée ; ses joueurs fictifs
#      (`recette:seed`, lot P2) sont réécrits à côté, sans retenir la suite ;
#   2. validation : les deux jobs suivants attendent ensemble l'approbation d'un relecteur de l'environnement GitHub `production` (Nathan) :
#      un seul clic (« Review deployments » → production → Approve) les libère tous les deux ;
#   3. l'API de production (si la fusion touche le serveur) et le site publié depuis main (DailyTrack et DailyJump) partent ensemble ;
#   4. lot P4 : la production déployée est vérifiée **en lecture seule** (`smoke --lecture-seule` : des GET seulement, rien n'est écrit) ; un
#      échec rend le run rouge et le résumé dit quelle route et quelle réponse, avec la commande de retour arrière à copier (le retour reste manuel).
# Deux fusions rapprochées : la seconde attend la fin de la première (validée ou refusée) ; une troisième remplace la seconde en attente.
# « Run workflow » sur main : republie le site et, si demandé, redéploie l'API (validation demandée aussi). Pas à pas : docs/plateforme/recette.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api:
        description: "Redéployer aussi l'API de production"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: La fusion touche-t-elle le serveur ?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_API: ${{ inputs.api }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            server="$([ "$FORCE_API" = true ] && echo true || echo false)"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            server=true # historique inconnu : dans le doute, on déploie
          else
            server="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | node scripts/recette.mjs touches-server)"
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "### Fusion : serveur touché : $server" >> "$GITHUB_STEP_SUMMARY"

  # Rien ne part en production sans passer par la recette.
  recette:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: recette
    secrets: inherit

  # Lot P2 : la révision par défaut de la recette vient d'être mise à jour : ses joueurs fictifs (`recette:seed`, recette-seed.yml). Rien
  # n'en dépend : la production ne l'attend pas.
  recette-seed:
    needs: recette
    if: needs.recette.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/recette-seed.yml
    secrets: inherit

  api:
    needs: [changes, recette]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.server == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: production
    secrets: inherit

  pages:
    needs: [changes, recette]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/pages.yml
    with:
      production: true
    secrets: inherit

  # Lot P4 : la production vient d'être déployée : on la vérifie **sans rien écrire** (`smoke --lecture-seule`, apps/api/scripts/smokeRead.ts :
  # des GET seulement, aucun identifiant de joueur, le seul mode de `smoke` permis contre la production). Un échec rend le run rouge ; le résumé
  # dit quelle route et quelle réponse, et donne la commande de retour arrière (manuel : rien n'est annulé automatiquement).
  verification:
    needs: [api, pages]
    if: ${{ !cancelled() && needs.api.result == 'success' && needs.api.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier la production en lecture seule
        env:
          API_URL: ${{ needs.api.outputs.url }}
          REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
          SERVICE: ${{ vars.GCP_SERVICE || 'cdj-api' }}
        run: |
          npm ci -w @cdj/api --ignore-scripts
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          retour="gcloud run revisions list --service $SERVICE --region $REGION   # repérer la révision d'avant
          gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=<révision d'avant>=100"
          if ! npm run smoke -w @cdj/api -- "$API_URL" --lecture-seule --environnement production --origin "https://${owner}.github.io" --resume "$GITHUB_STEP_SUMMARY" --retour "$retour"; then
            echo "::error title=Production : vérification en échec::Une route de la production ne répond pas comme prévu (détail dans le résumé du run). Le retour arrière est manuel : commande dans le résumé."
            exit 1
          fi
