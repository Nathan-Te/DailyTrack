name: Mettre en production
# Lot R12 (plateforme) — **un seul bouton** : Actions → « Mettre en production » → Run workflow (branche `main`, mode `production`). Sans autre geste, dans l'ordre
# (un arrêt survient toujours AVANT de toucher la production, sauf à l'étape 7, qui a son retour arrière) :
#   1. la CI COMPLÈTE du commit (`ci` : ci.yml appelé en mode `complet`, sans secret, sans environnement, sans fédération Google) — ou, si un run complet VERT
#      de ce commit existe déjà (la nuit, « Run workflow », un essai), elle est REPRISE (`scripts/ci-complete.mjs reprise`) ; rouge : arrêt, et le résumé dit
#      « Lance le lot de mise en production avec ce run : <lien> » ;
#   2. `ci-verdict` : `scripts/ci-complete.mjs verdict` exige un run `complet` vert de ce commit (celui du bouton ou celui repris ; le run `push` de main ne suffit plus) ;
#   3. le garde-fou des jours (`figer`, lots R6 et R11) : jours protégés lus en lecture seule, figés avec le code en production, empreintes comparées ;
#   4. la RÉPÉTITION sur la recette, à l'heure réelle (`recette-serveur`, `recette-site`, `recette-verification` : la même construction, jours figés compris,
#      `smoke --lecture-seule` puis `smoke` complet) ; un échec arrête ;
#   5. la SAUVEGARDE de la base (`sauvegarde`) : lecture seule, jeton Turso en lecture seule lu par un compte dédié (`cdj-sauvegarde`) que seul ce job peut
#      prendre (environnement `sauvegarde`, limité à main), fichier dans un bucket privé effacé au bout de 30 jours (config/sauvegarde-cycle.json) ;
#      jamais en artefact ni dans les journaux ;
#   6. (le garde-fou est refait au déploiement : `bascule-valide` et `proteges-verifier` dans deploy-api.yml et deploy-site.yml) ;
#   7. le déploiement (`serveur`, `site`), `smoke --lecture-seule` contre playdujour.com (`verification`), l'étiquette `prod-AAAA-MM-JJ-HHMM` (`etiquette`) ;
#   8. les jours figés VERSÉS DANS MAIN par le workflow lui-même (`depot` : une PR robot, sa CI, puis la fusion faite par le workflow ; Nathan n'a rien à fusionner) ;
#   9. le résumé (`resume`), en haut du run, lisible au téléphone : ✅ ou ⛔ et, en cas d'arrêt, UNE phrase qui dit quoi faire.
# Validation (lot R12, décision de Nathan) : plus de « Review deployments » — lancer le bouton sur main (réservé à qui peut écrire, et vérifié ici : le
# propriétaire du dépôt, ou la variable MISE_EN_PRODUCTION_PAR) VAUT validation ; l'environnement `production` reste limité à `main` (S-07).
# Modes : `production` (le vrai) ; `essai` (tout, contre la recette seulement : CI, garde-fou, répétition, sauvegarde DE LA RECETTE, jours figés versés dans main
# quand il tourne sur main ; il peut tourner sur une autre branche, il ne touche alors que la recette) ; `repetition` (lot R6 : la répétition seule, heure
# simulée, ni CI, ni sauvegarde, ni main). Pas à pas : docs/plateforme/mise-en-production.md ; détail : docs/plateforme/lots/lot-R12-un-seul-bouton.md.
# Lot R6 (le garde-fou des jours) — une fois des joueurs publics présents, une mise en production ne change JAMAIS un jour protégé :
#   - le **jour de bascule** est calculé au clic : le premier jour de Paris qui commence après le déploiement (`scripts/mise-en-production.mjs bascule`) ;
#   - avant la bascule, la carte de chaque jour protégé est exactement celle que la production sert : les jours sont figés avec le code en production JUSQU'À LA
#     VEILLE de la bascule, puis l'**empreinte** de chaque jour est comparée entre ce que sert la production et ce que servira la nouvelle construction :
#     **la moindre différence arrête la mise en production**, avant tout déploiement, avec la liste des jours dans le résumé ;
#   - à partir de la bascule, les 14 jours suivants sont régénérés avec le nouveau code et validés (circuit ou niveau valide, jamais de secours) ;
#   - l'ancien code doit tourner sur la base migrée (retour arrière) : `scripts/base-migree.mjs` ; l'inventaire de ce qui part (« Ce qui part ») est dans le résumé.
# Lot R11 — Track fige ses circuits comme Jump : le registre des jours de Track (`packages/sim/src/jours-track.json`) est écrit ici, avec le code en production,
#   jusqu'à la veille de la bascule ; il rejoint le serveur, le site (artefact `registre-track`) et le dépôt (job `depot`).
# Retour arrière : retour-arriere.yml. Sans Firebase configuré, le site est sauté (message clair) et le serveur part seul ; sans production configurée, tout est sauté.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "production (le vrai) · essai (tout contre la recette, sauvegarde de la recette comprise ; jours figés versés dans main s'il tourne sur main) · repetition (la répétition seule, heure simulée)"
        type: choice
        options: [production, essai, repetition]
        default: production
      commit:
        description: "Commit à mettre en production (vide : le dernier de main ; essai : le dernier de la branche)"
        type: string
        default: ""
      heure_simulee:
        description: "repetition seulement : l'heure du déploiement à Paris, « demain 10:00 », « aujourdhui 23:30 », « 2027-03-28 03:30 » ; vide : maintenant"
        type: string
        default: ""
      reference:
        description: "Première fois seulement (aucune étiquette prod-…) : le commit du code actuellement en production ; vide : le dernier run réussi de ce workflow. Répétition : le commit à traiter comme « le code en production »"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      precedente: ${{ steps.ref.outputs.precedente }}
      reference: ${{ steps.ref.outputs.reference }}
      etiquette: ${{ steps.ref.outputs.etiquette }}
      nb_pr: ${{ steps.ref.outputs.nb_pr }}
      prs: ${{ steps.ref.outputs.prs }}
      bascule_le: ${{ steps.bascule.outputs.bascule }}
      veille: ${{ steps.bascule.outputs.veille }}
      premier: ${{ steps.bascule.outputs.premier }}
      dernier_regenere: ${{ steps.bascule.outputs.dernier_regenere }}
      instant: ${{ steps.bascule.outputs.instant }}
      ci_reprise: ${{ steps.ci.outputs.reprise }}
      ci_run: ${{ steps.ci.outputs.run }}
      ci_appele: ${{ steps.ci.outputs.appele }}
    steps:
      - name: Qui, où, quel mode
        env:
          MODE: ${{ inputs.mode }}
          ACTEUR: ${{ github.triggering_actor }}
          PROPRIETAIRE: ${{ github.repository_owner }}
          PERMIS: ${{ vars.MISE_EN_PRODUCTION_PAR }}
          SIMULEE: ${{ inputs.heure_simulee }}
        run: |
          # Production et répétition : sur main. Un essai peut tourner sur une autre branche (il ne touche que la recette).
          if [ "$MODE" != essai ] && [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::« Mettre en production » ($MODE) se lance sur main (Run workflow → Branch: main), pas sur $GITHUB_REF_NAME"; exit 1; fi
          if [ "$MODE" != repetition ] && [ -n "$SIMULEE" ]; then echo "::error::l'heure simulée est réservée au mode repetition"; exit 1; fi
          # Lot R12 : plus de « Review deployments » — le lancement vaut validation ; il est donc réservé au propriétaire du dépôt (ou à la liste MISE_EN_PRODUCTION_PAR).
          if [ "$MODE" = production ]; then
            permis=" ${PERMIS:-$PROPRIETAIRE} "; permis="${permis//,/ }"
            case "$permis" in *" $ACTEUR "*) ;; *) echo "::error::seul ${PERMIS:-$PROPRIETAIRE} lance la production (ce run : $ACTEUR)"; exit 1 ;; esac
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Le commit
        id: sha
        env:
          COMMIT: ${{ inputs.commit }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = essai ]; then
            sha="$(git rev-parse --verify "${COMMIT:-$GITHUB_SHA}^{commit}")" || { echo "::error::commit introuvable : « $COMMIT »"; exit 1; }
          else
            sha="$(git rev-parse --verify "${COMMIT:-origin/main}^{commit}")" || { echo "::error::commit introuvable : « $COMMIT »"; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha n'est pas sur main : seul un commit de main part en production"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### Mettre en production ($MODE) \`${sha::7}\` — $(git log -1 --format=%s "$sha")" >> "$GITHUB_STEP_SUMMARY"
      - name: Ce commit contient-il le garde-fou des jours (lots R6 et R11) ?
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git show "$SHA:scripts/mise-en-production.mjs" | grep -q "bascule-valide" || { echo "::error::ce commit est antérieur au lot R6 (garde-fou des jours) : mettre en production un commit plus récent de main"; exit 1; }
          git cat-file -e "$SHA:packages/sim/src/jours-track.json" 2>/dev/null || { echo "::error::ce commit est antérieur au lot R11 (registre des jours de Track) : mettre en production un commit plus récent de main"; exit 1; }
      # Lot R12 : la CI complète de CE commit existe-t-elle déjà, verte (la nuit, « Run workflow », un essai du bouton) ? Oui : elle est reprise, sinon le job `ci` la lance.
      - name: Une CI complète verte de ce commit existe-t-elle déjà ?
        id: ci
        if: ${{ inputs.mode != 'repetition' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: node scripts/ci-complete.mjs reprise "$GITHUB_REPOSITORY" "$SHA" --sortie "$GITHUB_OUTPUT"
      - name: Le jour de bascule (calculé maintenant, au clic)
        id: bascule
        env:
          MODE: ${{ inputs.mode }}
          SIMULEE: ${{ inputs.heure_simulee }}
        run: |
          args=(); [ -z "$SIMULEE" ] || args=(--simulee "$SIMULEE")
          node scripts/mise-en-production.mjs bascule "${args[@]}" --sortie "$GITHUB_OUTPUT" > "$RUNNER_TEMP/bascule.txt"
          . <(sed 's/^/export /' "$RUNNER_TEMP/bascule.txt")
          {
            echo "- Jour de bascule : **$bascule** (le premier jour de Paris qui commence après la fin prévue du déploiement, clic + 2 h${SIMULEE:+, heure simulée « $SIMULEE »} ; jour de Paris du clic : $jour_de_paris) — les jours protégés du $premier au $veille restent exactement ceux de la production, les $bascule et suivants sont régénérés avec le nouveau code."
            [ "$MODE" = production ] || echo "- **$MODE** : contre la recette, rien ne part en production."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Aucune PR « Jours figés » n'attend d'être fusionnée
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          ouvertes="$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("robot/jours-figes-")) | "#\(.number)"' | tr '\n' ' ')"
          if [ -n "$ouvertes" ]; then
            if [ "$MODE" != production ]; then echo "::warning::PR des jours figés encore ouverte(s) : $ouvertes (la production la refuserait)"
            else echo "::error::une PR des jours figés n'est pas fusionnée ($ouvertes) : la fusionner d'abord (les jours que sert la production n'y sont pas encore tous dans main)"; exit 1; fi
          fi
      - name: Dernière mise en production, code en production, étiquette, ce qui part
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ inputs.reference }}
          MODE: ${{ inputs.mode }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          precedente="$(node scripts/mise-en-production.mjs derniere)"
          reference=""
          if [ "$MODE" = repetition ] && [ -n "$REFERENCE" ]; then
            # Répétition seulement : traiter ce commit comme « le code en production » (pour répéter une date lointaine comme la nuit du 28 mars 2027).
            reference="$(git rev-parse --verify "$REFERENCE^{commit}")" || { echo "::error::reference introuvable : « $REFERENCE »"; exit 1; }
            precedente=""
            echo "- Code en production (répétition : donné à la main) : \`${reference::7}\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$precedente" ]; then
            reference="$(git rev-parse "$precedente^{commit}")"
            echo "- Code en production : \`$precedente\` (\`${reference::7}\`)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$REFERENCE" ]; then
            reference="$(git rev-parse --verify "$REFERENCE^{commit}")" || { echo "::error::reference introuvable : « $REFERENCE »"; exit 1; }
            echo "- Code en production (donné à la main) : \`${reference::7}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            # Avant la première étiquette (lot R4) : le code publié par le dernier run réussi de ce workflow.
            reference="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
            [ -n "$reference" ] || { echo "::error::aucune étiquette prod-… et aucun run réussi : donner « reference » (le commit du code en production)"; exit 1; }
            echo "- Code en production (dernier run réussi de la production) : \`${reference::7}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          etiquette="$(node scripts/mise-en-production.mjs etiquette)"
          { echo "precedente=$precedente"; echo "reference=$reference"; echo "etiquette=$etiquette"; } >> "$GITHUB_OUTPUT"
          echo "- Étiquette prévue : \`$etiquette\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node scripts/mise-en-production.mjs changements "${precedente:-$reference}" "$SHA" --resume "$GITHUB_STEP_SUMMARY" --sortie "$GITHUB_OUTPUT" > /dev/null
          # Lot R6 : « Ce qui part » — les PR (titre, lot, zone), les versions, les migrations, les routes, avec l'effet, le risque et la vérification de chacun.
          node scripts/mise-en-production.mjs inventaire "${precedente:-$reference}" "$SHA" --resume "$GITHUB_STEP_SUMMARY" > /dev/null

  # 1. La CI complète, lancée par le bouton sur le commit qu'il va déployer — sauf si un run complet vert de ce commit existe déjà (reprise). Aucun secret, aucun
  # environnement, aucune fédération Google : ces jobs ne touchent rien (`permissions` en lecture, pas de `secrets:`).
  ci:
    needs: verifier
    if: ${{ inputs.mode != 'repetition' && needs.verifier.outputs.ci_reprise != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      mode: complet
      ref: ${{ needs.verifier.outputs.sha }}

  # 2. Le verdict : un run `complet` vert de ce commit (celui du bouton ou celui repris), sinon arrêt avant tout (scripts/ci-complete.mjs verdict).
  ci-verdict:
    needs: [verifier, ci]
    if: ${{ !cancelled() && inputs.mode != 'repetition' && needs.verifier.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      etat: ${{ steps.verdict.outputs.etat }}
      url: ${{ steps.verdict.outputs.url }}
      duree: ${{ steps.verdict.outputs.duree }}
      qui: ${{ steps.verdict.outputs.qui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: La CI complète de ce commit est-elle verte ?
        id: verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verifier.outputs.sha }}
          REPRISE: ${{ needs.verifier.outputs.ci_reprise }}
          RUN_REPRIS: ${{ needs.verifier.outputs.ci_run }}
          APPELE: ${{ needs.verifier.outputs.ci_appele }}
          ECHECS: ${{ needs.ci.outputs.echecs }}
        run: |
          if [ "$REPRISE" = true ]; then args=(--reprise "$RUN_REPRIS"); [ "$APPELE" != true ] || args+=(--appele); else args=(--run "$GITHUB_RUN_ID"); fi
          node scripts/ci-complete.mjs verdict "$GITHUB_REPOSITORY" "$SHA" "${args[@]}" --echecs-e2e "${ECHECS:-[]}" --resume "$GITHUB_STEP_SUMMARY" --sortie "$GITHUB_OUTPUT"

  # 3. Figer avec le code EN PRODUCTION, puis prouver que rien de ce qui précède la bascule ne change (lots R6 et R11).
  # - Les jours figés vont jusqu'à LA VEILLE du jour de bascule ; les jours que la production sert (son image : le commit de l'étiquette, plus les commits
  #   « Jours figés » versés depuis) sont remis avant de figer.
  # - Les empreintes de chaque jour sont calculées par le code en production et par la nouvelle construction (jours figés superposés) : toute différence
  #   d'un jour protégé arrête la mise en production, avant le moindre déploiement.
  # - L'ancien code doit tourner sur la base que le nouveau a migrée (retour arrière).
  figer:
    needs: [verifier, ci-verdict]
    if: ${{ !cancelled() && needs.verifier.result == 'success' && (inputs.mode == 'repetition' || needs.ci-verdict.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      jours_track: ${{ steps.empreintes.outputs.jours_track }}
      jours_jump: ${{ steps.empreintes.outputs.jours_jump }}
      jours_tower: ${{ steps.empreintes.outputs.jours_tower }}
      tower_ligne: ${{ steps.tower.outputs.tower_ligne }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verifier.outputs.reference }}
          path: prod
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verifier.outputs.sha }}
          path: cible
      # Les outils sont ceux du commit du workflow, avec tout l'historique : le code en production n'a pas le garde-fou.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: outils
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Lot R11 (décision de Nathan) : le garde-fou ne protège que les jours d'avant le lancement, ceux qui sont déjà figés et ceux qui ont au moins un résultat en production.
      # Les résultats se lisent en LECTURE SEULE (GET /api/portail/classement?date=, route publique) ; un jour sans aucun résultat est régénéré avec le code déployé.
      - name: Les jours protégés (lecture seule des résultats de la production)
        env:
          PREMIER: ${{ needs.verifier.outputs.premier }}
          VEILLE: ${{ needs.verifier.outputs.veille }}
        run: |
          mkdir -p "$RUNNER_TEMP/registre-track"
          node outils/scripts/mise-en-production.mjs proteges --origine "$(node outils/scripts/domaine.mjs adresse production)" --cible cible --premier "$PREMIER" --veille "$VEILLE" \
            --sortie "$RUNNER_TEMP/registre-track/proteges.json" --resume "$GITHUB_STEP_SUMMARY" \
            || { echo "::error title=Mise en production arrêtée::les résultats de la production n'ont pas pu être lus (lecture seule) : sans eux, les jours à protéger sont inconnus"; exit 1; }
      - name: Les jours que la production sert
        working-directory: outils
        env:
          REFERENCE: ${{ needs.verifier.outputs.reference }}
        run: node scripts/mise-en-production.mjs jours-servis "$REFERENCE" "$GITHUB_WORKSPACE/prod/apps/jump/public/levels" --jusqua origin/main --registre "$GITHUB_WORKSPACE/prod/packages/sim/src/jours-track.json"
      - name: freeze:days -- veille du jour de bascule (code en production)
        working-directory: prod
        env:
          VEILLE: ${{ needs.verifier.outputs.veille }}
        run: |
          npm ci --ignore-scripts
          npm run freeze:days -w @cdj/jump -- "$VEILLE"
      - name: Les jours sans résultat ne sont pas figés (le nouveau code les régénère)
        run: node outils/scripts/mise-en-production.mjs jours-figes-filtrer prod/apps/jump/public/levels --proteges "$RUNNER_TEMP/registre-track/proteges.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Les jours figés s'accordent-ils avec le commit déployé ?
        run: |
          mkdir -p "$RUNNER_TEMP/cible-levels"
          cp cible/apps/jump/public/levels/*.json "$RUNNER_TEMP/cible-levels/" 2>/dev/null || true
          node outils/scripts/mise-en-production.mjs jours-figes prod/apps/jump/public/levels "$RUNNER_TEMP/cible-levels" | tee -a "$GITHUB_STEP_SUMMARY"
      # Lot R11 : le registre des jours de Track. Ce que la production sert pour chaque jour jusqu'à la veille de la bascule s'ajoute à celui du dépôt ; un jour qui
      # diffère (ou un jour du dépôt au-delà de la veille) arrête la mise en production. La construction (cible) l'a ensuite : ses empreintes sont celles de la production.
      - name: Le registre des jours de Track (code en production) — rien avant la bascule ne doit changer
        env:
          VEILLE: ${{ needs.verifier.outputs.veille }}
        run: |
          mkdir -p "$RUNNER_TEMP/registre"
          debut="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("cible/packages/sim/src/jours-track.json","utf8")).plages[0].du)')"
          node outils/scripts/mise-en-production.mjs registre prod --du "$debut" --au "$VEILLE" --proteges "$RUNNER_TEMP/registre-track/proteges.json" --sortie "$RUNNER_TEMP/registre/prod.json"
          node outils/scripts/mise-en-production.mjs registre-fusion cible/packages/sim/src/jours-track.json "$RUNNER_TEMP/registre/prod.json" --resume "$GITHUB_STEP_SUMMARY" \
            || { echo "::error title=Mise en production arrêtée::un jour du registre de Track ne s'accorde pas avec ce que la production sert : la liste est dans le résumé du run"; exit 1; }
          cp cible/packages/sim/src/jours-track.json "$RUNNER_TEMP/registre-track/jours-track.json"
      - name: Les empreintes des jours (code en production, puis nouvelle construction) — rien avant la bascule ne doit changer
        id: empreintes
        env:
          DERNIER: ${{ needs.verifier.outputs.dernier_regenere }}
          BASCULE: ${{ needs.verifier.outputs.bascule_le }}
          INSTANT: ${{ needs.verifier.outputs.instant }}
          MODE: ${{ inputs.mode }}
        run: |
          (cd cible && npm ci --ignore-scripts)
          # Les jours d'avant le lancement « restent tels quels » : la comparaison part du plus ancien niveau figé de Jump (lot R11), pas de la journée n° 1.
          PREMIER="$(jq -r .debut "$RUNNER_TEMP/registre-track/proteges.json")"
          node outils/scripts/mise-en-production.mjs empreintes prod --du "$PREMIER" --au "$DERNIER" --niveaux prod/apps/jump/public/levels --tower prod/apps/tower/public/jours --sortie "$RUNNER_TEMP/empreintes/prod.json"
          node outils/scripts/mise-en-production.mjs empreintes cible --du "$PREMIER" --au "$DERNIER" --niveaux "$RUNNER_TEMP/cible-levels" --tower cible/apps/tower/public/jours --sortie "$RUNNER_TEMP/empreintes/cible.json"
          simulee=(); [ "$MODE" != repetition ] || simulee=(--simulee)
          node outils/scripts/mise-en-production.mjs comparer "$RUNNER_TEMP/empreintes/prod.json" "$RUNNER_TEMP/empreintes/cible.json" "$BASCULE" "${simulee[@]}" --proteges "$RUNNER_TEMP/registre-track/proteges.json" --instant "$INSTANT" --resume "$GITHUB_STEP_SUMMARY" --sortie "$GITHUB_OUTPUT" > /dev/null \
            || { echo "::error title=Mise en production arrêtée::un jour d'avant la bascule changerait (ou un jour régénéré n'est pas valide) : la liste est dans le résumé du run"; exit 1; }
      # Lot TP — les jours de Tower. Les médailles de Tower viennent d'un bot (≈ 45 s par jour, `npm run preparer:tower`) : un jour doit être préparé AVANT d'être servi. Règle des jours (R11) :
      # un jour protégé (d'avant le lancement, déjà figé, ou avec un résultat de Tower ou d'un autre jeu) ne change jamais ; un jour sans résultat est préparé, ou refait avec le code déployé si sa
      # version (g, sim) diffère, ou gardé s'il est déjà à la version du code. Fenêtre : de la veille de la bascule à J+14 (une mise en production tous les quinze jours au plus ; au-delà,
      # les jours sans fichier passent à l'estimation géométrique « provisoire » : le résumé le dit). Le code de préparation est celui du commit DÉPLOYÉ (`cible`), jamais celui de la production.
      - name: Les jours de Tower (plan, préparation avec le code déployé, vérification)
        id: tower
        env:
          VEILLE: ${{ needs.verifier.outputs.veille }}
          BASCULE: ${{ needs.verifier.outputs.bascule_le }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tower-artefact/jours"
          plan="$RUNNER_TEMP/tower-artefact/plan.json"
          node outils/scripts/mise-en-production.mjs tower-plan --cible cible --proteges "$RUNNER_TEMP/registre-track/proteges.json" --veille "$VEILLE" --bascule "$BASCULE" --sortie "$plan" --github-sortie "$GITHUB_OUTPUT" > /dev/null
          plages="$(jq -r '.plages | map(.[0] + ":" + .[1]) | join(" ")' "$plan")"
          node outils/scripts/mise-en-production.mjs tower-nettoyer cible/apps/tower/public/jours --plan "$plan"
          mkdir -p cible/apps/tower/public/jours
          debut="$(date +%s)"
          for plage in $plages; do
            du="${plage%%:*}"; au="${plage##*:}"
            (cd cible && npm run preparer:tower -w @cdj/tower-sim -- --du "$du" --au "$au" --dossier="$GITHUB_WORKSPACE/cible/apps/tower/public/jours")
          done
          secondes=$(( $(date +%s) - debut ))
          # Chaque fichier (ceux de la fenêtre comme ceux du dépôt) se relit, se régénère à l'identique et sa preuve rejouée redonne son Diamant (garde-fou du lot T3).
          (cd cible && npx vitest run --project sqlite packages/tower-sim/test/jours.test.ts)
          cp cible/apps/tower/public/jours/*.json "$RUNNER_TEMP/tower-artefact/jours/" 2>/dev/null || true
          node outils/scripts/mise-en-production.mjs tower-resume --plan "$plan" --secondes "$secondes" --fils "$(nproc)" --resume "$GITHUB_STEP_SUMMARY" --github-sortie "$GITHUB_OUTPUT" > /dev/null
      # Le nouveau serveur de l'essai a les jours figés qu'il aura une fois déployé (la même commande que `deploy-api.yml`) : sans eux il régénère avec le
      # nouveau générateur un jour que la production sert figé (ex. le jour même), l'ancien code lit alors des rediffusions d'une autre version (28/10/2026).
      - name: L'ancien code tourne-t-il sur la base migrée (le retour arrière) ?
        run: |
          node outils/scripts/mise-en-production.mjs jours-figes prod/apps/jump/public/levels cible/apps/jump/public/levels
          node outils/scripts/base-migree.mjs cible prod --resume "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jours-figes
          path: prod/apps/jump/public/levels/*.json
          retention-days: 30
          if-no-files-found: error
      # Lot R11 : le registre des jours de Track (celui du dépôt, complété de ce que la production sert) part avec le serveur, le site et le dépôt.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registre-track
          path: ${{ runner.temp }}/registre-track
          retention-days: 30
          if-no-files-found: error
      # Lot TP : les jours de Tower (conservés, préparés, refaits) et le plan qui les nomme : ils rejoignent le serveur (preuve comprise : elle reste dans l'image), le site (sans la preuve) et le dépôt.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jours-tower
          path: ${{ runner.temp }}/tower-artefact
          retention-days: 30
          if-no-files-found: error
      # Les empreintes des jours passés (jusqu'à la veille de la bascule) entrent dans le dépôt avec les jours figés (apps/api/test/jours-passes.json).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: empreintes-jours
          path: ${{ runner.temp }}/empreintes/prod.json
          retention-days: 30
          if-no-files-found: error

  # 4. La répétition sur la RECETTE, à l'heure réelle (mode `repetition` : à l'heure simulée) : exactement la construction qui partira (commit, jours figés, registre),
  # serveur par défaut de la recette puis site de recette ; le jour de bascule n'y est pas re-vérifié (pas de validation à attendre).
  recette-serveur:
    needs: [verifier, figer]
    if: ${{ !cancelled() && needs.figer.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: recette
      ref: ${{ needs.verifier.outputs.sha }}
      jours_figes: jours-figes
      jours_tower: jours-tower
      registre_track: registre-track
    secrets: inherit

  recette-site:
    needs: [verifier, recette-serveur]
    if: ${{ !cancelled() && needs.recette-serveur.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      cible: recette
      api: /
      ref: ${{ needs.verifier.outputs.sha }}
      jours_figes: jours-figes
      jours_tower: jours-tower
      registre_track: registre-track
    secrets: inherit

  # `smoke --lecture-seule` puis `smoke` complet (il crée des joueurs « Fumée » : la recette seulement, jamais la production). Une recette non configurée arrête :
  # sans répétition, rien ne part.
  recette-verification:
    needs: [verifier, figer, recette-serveur, recette-site]
    if: ${{ !cancelled() && needs.figer.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: La recette a-t-elle reçu la construction ?
        env:
          SERVEUR: ${{ needs.recette-serveur.result }}
          SERVEUR_ON: ${{ needs.recette-serveur.outputs.enabled }}
          SITE: ${{ needs.recette-site.result }}
        run: |
          [ "$SERVEUR" = success ] && [ "$SITE" = success ] || { echo "::error title=Répétition en échec::le déploiement de la recette a échoué (serveur : $SERVEUR, site : $SITE) — rien n'est parti en production"; exit 1; }
          [ "$SERVEUR_ON" = true ] || { echo "::error title=Répétition impossible::la recette n'est pas configurée (docs/plateforme/recette.md) : sans répétition, rien ne part en production"; exit 1; }
      # Le smoke complet recalcule lui-même le circuit et le niveau du jour (`dailyCircuit` lit le registre de Track, le niveau de Jump vient des fichiers
      # figés) : il doit tourner sur exactement ce que la recette a reçu — le commit déployé, ses jours figés et son registre (artefacts de `figer`, les
      # mêmes commandes que deploy-api.yml). Sans eux, un jour figé par cette mise en production se recalculait avec le nouveau générateur (28/10/2026).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verifier.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jours-figes
          path: ${{ runner.temp }}/jours-figes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: registre-track
          path: ${{ runner.temp }}/registre-track
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jours-tower
          path: ${{ runner.temp }}/jours-tower
      - name: Les jours figés, les jours de Tower et le registre que la recette a reçus
        run: |
          node scripts/mise-en-production.mjs jours-figes "$RUNNER_TEMP/jours-figes" apps/jump/public/levels
          node scripts/mise-en-production.mjs tower-poser "$RUNNER_TEMP/jours-tower" apps/tower/public/jours
          node scripts/mise-en-production.mjs registre-fusion packages/sim/src/jours-track.json "$RUNNER_TEMP/registre-track/jours-track.json"
      - name: Vérifier la recette (lecture seule, puis smoke complet)
        env:
          SITE_ON: ${{ needs.recette-site.outputs.enabled }}
          SITE_URL: ${{ needs.recette-site.outputs.url }}
          API_URL: ${{ needs.recette-serveur.outputs.url }}
        run: |
          npm ci -w @cdj/api --ignore-scripts
          if [ "$SITE_ON" = true ]; then url="$SITE_URL"; else url="$API_URL"; echo "- Firebase non configuré : répétition contre l'adresse du service ($url)" >> "$GITHUB_STEP_SUMMARY"; fi
          origine="$(node scripts/domaine.mjs adresse recette)"
          npm run smoke -w @cdj/api -- "${url%/}" --lecture-seule --environnement recette --origin "$origine" --resume "$GITHUB_STEP_SUMMARY" --retour "Rien n'est parti en production : corriger par une PR, puis relancer le bouton."
          npm run smoke -w @cdj/api -- "${url%/}" --distant --origin "$origine"
          echo "- ✅ Répétition sur la recette ($url) : lecture seule et smoke complet verts" >> "$GITHUB_STEP_SUMMARY"

  # 5. La sauvegarde de la base, avant tout déploiement (production : la base des joueurs ; essai : la base de recette). LECTURE SEULE : un jeton Turso
  # `--read-only` dans Secret Manager (cdj-turso-lecture / cdj-recette-turso-lecture), que seul le compte `cdj-sauvegarde` lit ; ce compte, seul ce job
  # peut le prendre (fédération liée à l'environnement GitHub `sauvegarde`, limité à main). Le fichier va dans un bucket privé (effacé au bout de 30 jours) :
  # jamais en artefact, jamais dans un journal. Installation (une fois, par Nathan) : docs/plateforme/mise-en-production.md, annexe C.
  sauvegarde:
    needs: [verifier, recette-verification]
    if: ${{ !cancelled() && inputs.mode != 'repetition' && needs.recette-verification.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sauvegarde
    permissions:
      contents: read
      id-token: write
    outputs:
      fichier: ${{ steps.cfg.outputs.fichier }}
    env:
      CIBLE: ${{ inputs.mode == 'production' && 'production' || 'recette' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROD_DB: ${{ vars.TURSO_DATABASE_URL }}
      RECETTE_DB: ${{ vars.RECETTE_TURSO_DATABASE_URL }}
      BUCKET: ${{ vars.SAUVEGARDE_BUCKET }}
      SAUVEGARDE_SA: ${{ vars.GCP_SAUVEGARDE_SA }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Configuration
        id: cfg
        run: |
          fail() { echo "::error title=Sauvegarde impossible::$1"; echo "### ⛔ Sauvegarde impossible — rien n'est parti en production" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$GCP_PROJECT_ID" ] && [ -n "$WIF_PROVIDER" ] || fail "fédération Google non configurée (GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER) : docs/plateforme/mise-en-production.md, annexe C"
          if [ "$CIBLE" = production ]; then db="$PROD_DB"; secret=cdj-turso-lecture; else db="$RECETTE_DB"; secret=cdj-recette-turso-lecture; fi
          [ -n "$db" ] || fail "adresse de la base ($CIBLE) non configurée"
          # La règle des noms de base (la même que apps/api/src/config.ts, que le script refait).
          dbname="$(printf '%s' "$db" | sed -E 's#^[a-z]+://##; s#[/:?].*$##; s#\..*$##' | tr '[:upper:]' '[:lower:]')"
          if [ "$CIBLE" = recette ]; then case "$dbname" in *recette*) ;; *) fail "la base de recette « $dbname » n'a pas « recette » dans son nom" ;; esac
          else case "$dbname" in *recette*) fail "la base de production « $dbname » est une base de recette" ;; esac; fi
          bucket="${BUCKET:-${GCP_PROJECT_ID}-sauvegardes}"
          {
            echo "db=$db"
            echo "secret=$secret"
            echo "bucket=$bucket"
            echo "sa=${SAUVEGARDE_SA:-cdj-sauvegarde@${GCP_PROJECT_ID}.iam.gserviceaccount.com}"
            echo "fichier=gs://$bucket/$CIBLE/$(TZ=Europe/Paris date +%Y-%m-%d-%H%M)-$dbname-run$GITHUB_RUN_ID.sql.gz"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Le compte dédié à la sauvegarde, jamais `cdj-deploy` : seul ce job (environnement `sauvegarde`) peut le prendre (annexe C).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.cfg.outputs.sa }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Chaque accès vérifié un par un (fédération, secret, bucket) : un refus dit lequel et donne la commande à lancer (28/10/2026 : « PERMISSION_DENIED » seul).
      - name: Les accès de la sauvegarde
        env:
          SA: ${{ steps.cfg.outputs.sa }}
          SECRET: ${{ steps.cfg.outputs.secret }}
          BUCKET_CHOISI: ${{ steps.cfg.outputs.bucket }}
        run: node scripts/sauvegarde-acces.mjs --projet "$GCP_PROJECT_ID" --sa "$SA" --secret "$SECRET" --bucket "$BUCKET_CHOISI" --resume "$GITHUB_STEP_SUMMARY"
      - name: Lire la base (lecture seule), restaurer à blanc, compresser
        env:
          DB: ${{ steps.cfg.outputs.db }}
          SECRET: ${{ steps.cfg.outputs.secret }}
        run: |
          set -o pipefail
          if ! token="$(gcloud secrets versions access latest --secret="$SECRET" --project="$GCP_PROJECT_ID" 2>"$RUNNER_TEMP/secret-err")"; then
            echo "::error title=Sauvegarde impossible::le jeton en lecture seule $SECRET est illisible : $(grep -oE 'PERMISSION_DENIED|NOT_FOUND' "$RUNNER_TEMP/secret-err" | head -1) — docs/plateforme/mise-en-production.md, annexe C"
            exit 1
          fi
          echo "::add-mask::$token"
          [ -n "$token" ] || { echo "::error::secret $SECRET vide"; exit 1; }
          npm ci -w @cdj/api --ignore-scripts
          TURSO_DATABASE_URL="$DB" TURSO_AUTH_TOKEN="$token" npm run -s base:sauvegarde -w @cdj/api -- --distant --cible "$CIBLE" --sortie "$RUNNER_TEMP/sauvegarde.sql.gz" | tee -a "$GITHUB_STEP_SUMMARY"
          unset token
      - name: Déposer dans le bucket privé
        env:
          FICHIER: ${{ steps.cfg.outputs.fichier }}
        run: |
          gcloud storage cp "$RUNNER_TEMP/sauvegarde.sql.gz" "$FICHIER" --quiet
          rm -f "$RUNNER_TEMP/sauvegarde.sql.gz"
          {
            echo ""
            echo "- ✅ Sauvegarde : \`$FICHIER\` (effacée au bout de 30 jours)"
            echo "- Restaurer (annexe C de docs/plateforme/mise-en-production.md) : \`gcloud storage cp $FICHIER . && gunzip $(basename "$FICHIER") && turso db create dailytrack-restauree --from-dump $(basename "$FICHIER" .gz)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 7. Le serveur de production, puis le site (playdujour.com). Plus de validation : le lancement du bouton sur main l'a donnée (lot R12) ; l'environnement
  # `production` (dans deploy-api.yml) reste limité à main.
  serveur:
    needs: [verifier, figer, sauvegarde]
    if: ${{ !cancelled() && inputs.mode == 'production' && needs.sauvegarde.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: production
      ref: ${{ needs.verifier.outputs.sha }}
      jours_figes: jours-figes
      jours_tower: jours-tower
      registre_track: registre-track
      # Lot N1 : l'étiquette prod-… (calculée au début du run) que le tableau de bord du panneau d'administration montre comme « version en production ».
      etiquette: ${{ needs.verifier.outputs.etiquette }}
      # Le jour de bascule se re-vérifie juste avant de déployer (le run a pu durer : CI, répétition, sauvegarde).
      bascule_le: ${{ needs.verifier.outputs.bascule_le }}
    secrets: inherit

  site:
    needs: [verifier, serveur]
    if: ${{ !cancelled() && needs.serveur.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      cible: production
      api: /
      ref: ${{ needs.verifier.outputs.sha }}
      jours_figes: jours-figes
      jours_tower: jours-tower
      registre_track: registre-track
      bascule_le: ${{ needs.verifier.outputs.bascule_le }}
    secrets: inherit

  # Lecture seule (`smoke --lecture-seule`, apps/api/scripts/smokeRead.ts : des GET seulement, aucun identifiant, rien n'est écrit) contre playdujour.com/api/ — le
  # chemin des joueurs (Firebase → Cloud Run). Un échec rend le run rouge ; le résumé donne le retour arrière.
  verification:
    needs: [verifier, serveur, site]
    if: ${{ !cancelled() && needs.serveur.result == 'success' && (needs.serveur.outputs.enabled == 'true' || needs.site.outputs.enabled == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verifier.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Vérifier la production en lecture seule
        id: smoke
        env:
          SITE_ON: ${{ needs.site.outputs.enabled }}
          SITE_URL: ${{ needs.site.outputs.url }}
          API_URL: ${{ needs.serveur.outputs.url }}
        run: |
          npm ci -w @cdj/api --ignore-scripts
          if [ "$SITE_ON" = true ]; then url="$SITE_URL"; else url="$API_URL"; echo "- Firebase non configuré : vérification contre l'adresse du service ($url)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          retour="Actions → « Retour arrière » → Run workflow (sur main) : serveur et site de la mise en production précédente, puis vérification."
          if ! npm run smoke -w @cdj/api -- "${url%/}" --lecture-seule --environnement production --origin "$(node scripts/domaine.mjs adresse production)" --resume "$GITHUB_STEP_SUMMARY" --retour "$retour"; then
            echo "::error title=Vérification en échec (production)::Une route ne répond pas comme prévu (détail dans le résumé du run) : retour arrière, workflow « Retour arrière »."
            exit 1
          fi

  # L'étiquette `prod-AAAA-MM-JJ-HHMM` sur le commit déployé ; son message garde l'image et la version du site (retour-arriere.yml les relit).
  etiquette:
    needs: [verifier, serveur, site, verification]
    if: ${{ !cancelled() && inputs.mode == 'production' && needs.verification.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Étiqueter le commit
        env:
          TAG: ${{ needs.verifier.outputs.etiquette }}
          SHA: ${{ needs.verifier.outputs.sha }}
          IMAGE: ${{ needs.serveur.outputs.image }}
          API: ${{ needs.serveur.outputs.url }}
          SITE: ${{ needs.site.outputs.site }}
          VERSION: ${{ needs.site.outputs.version }}
          BASCULE: ${{ needs.verifier.outputs.bascule_le }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Mise en production $TAG (run $GITHUB_RUN_ID)"
            echo ""
            echo "image: ${IMAGE:-}"
            echo "api: ${API:-}"
            echo "site: ${SITE:+$SITE@$VERSION}"
            echo "basculement: $BASCULE"
          } > message.txt
          git tag -a "$TAG" "$SHA" -F message.txt
          git push origin "refs/tags/$TAG"
          echo "### Étiquette \`$TAG\` posée sur \`${SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

  # 8. Les jours figés VERSÉS DANS MAIN par le workflow (lot R12 : Nathan n'a plus de PR à fusionner) — production, ou essai lancé sur main. Une branche robot,
  # une PR, sa CI (celle d'une PR : `pull_request` avec ROBOT_TOKEN ; sinon ci.yml lancé ici en mode `pr`, la règle de GitHub ne lançant aucun workflow pour un
  # jeton de workflow), puis le workflow fusionne LUI-MÊME dès que `test` et `e2e` sont verts (la protection de main est respectée : mêmes statuts requis).
  # Aucune mise en production n'exige plus le run `push` de main (lot R12) : une fusion faite par le jeton du workflow ne bloque donc plus rien.
  depot:
    needs: [verifier, figer, serveur, recette-verification]
    if: ${{ !cancelled() && needs.figer.result == 'success' && ((inputs.mode == 'production' && needs.serveur.result == 'success' && needs.serveur.outputs.enabled == 'true') || (inputs.mode == 'essai' && github.ref == 'refs/heads/main' && needs.recette-verification.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    outputs:
      etat: ${{ steps.depot.outputs.etat }}
      pr: ${{ steps.depot.outputs.pr }}
    env:
      GH_TOKEN: ${{ secrets.ROBOT_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HAS_ROBOT: ${{ secrets.ROBOT_TOKEN != '' }}
      TAG: ${{ needs.verifier.outputs.etiquette }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          token: ${{ secrets.ROBOT_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jours-figes
          path: ${{ runner.temp }}/jours-figes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: empreintes-jours
          path: ${{ runner.temp }}/empreintes-jours
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jours-tower
          path: ${{ runner.temp }}/jours-tower
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: registre-track
          path: ${{ runner.temp }}/registre-track
      - name: Les jours figés dans main
        id: depot
        env:
          VEILLE: ${{ needs.verifier.outputs.veille }}
        run: |
          node scripts/mise-en-production.mjs jours-figes "$RUNNER_TEMP/jours-figes" apps/jump/public/levels
          # Lot TP : les jours de Tower (préparés ou refaits avec le code déployé, preuve comprise : le dépôt est privé du serveur, le site publié la perd) rejoignent le dépôt.
          node scripts/mise-en-production.mjs tower-poser "$RUNNER_TEMP/jours-tower" apps/tower/public/jours
          # Lot R11 : le registre des jours de Track (jusqu'à la veille de la bascule) rejoint le dépôt avec les niveaux figés de Jump ; les jours d'avant ne changent jamais.
          node scripts/mise-en-production.mjs registre-fusion packages/sim/src/jours-track.json "$RUNNER_TEMP/registre-track/jours-track.json" --resume "$GITHUB_STEP_SUMMARY"
          # Lot R6 : les empreintes des jours passés (jusqu'à la veille de la bascule) rejoignent le test `jours-passes.test.ts` : un jour passé ne change plus jamais.
          node scripts/mise-en-production.mjs empreintes-fusion apps/api/test/jours-passes.json "$RUNNER_TEMP/empreintes-jours/prod.json" --jusqua "$VEILLE" --proteges "$RUNNER_TEMP/registre-track/proteges.json"
          # La démonstration de Jump (`?api=demo`, apps/jump/public/demo) rejoue les niveaux de ses jours, fichiers figés compris : un jour qu'elle couvre et que
          # cette mise en production fige change de niveau, ses données se refont (déterministe, ≈ 1 min ; sans cela la CI de la PR échoue : « relancer jump:seed »).
          if [ -n "$(git status --porcelain apps/jump/public/levels)" ]; then
            npm ci --ignore-scripts --no-audit --no-fund > /dev/null
            npm run jump:seed -w @cdj/api > /dev/null
          fi
          if [ -z "$(git status --porcelain apps/jump/public/levels apps/jump/public/demo apps/tower/public/jours apps/api/test/jours-passes.json packages/sim/src/jours-track.json)" ]; then
            echo "etat=rien" >> "$GITHUB_OUTPUT"
            echo "### ✅ Jours figés : déjà dans main, rien à ajouter" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          nom="$TAG"; [ "$MODE" = production ] || nom="essai-$GITHUB_RUN_ID"
          branch="robot/jours-figes-$nom"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/jump/public/levels apps/jump/public/demo apps/tower/public/jours apps/api/test/jours-passes.json packages/sim/src/jours-track.json
          # « Jours figés de la mise en production » : le début du message est lu par `jours-servis` (les jours que la production sert).
          git commit -q -m "Jours figés de la mise en production $nom (code en production, freeze:days jusqu'à la veille de la bascule)"
          git push -q origin "$branch"
          body="Jours figés par « Mettre en production » ($nom, run $GITHUB_RUN_ID) avec **le code qui était en production** : niveaux de DailyJump, registre des jours de DailyTrack (packages/sim/src/jours-track.json) et empreintes des jours passés (apps/api/test/jours-passes.json). **Le workflow fusionne cette PR lui-même** dès que sa CI est verte (lot R12) : rien à faire."
          url="$(gh pr create --base main --head "$branch" --title "Jours figés — $nom" --body "$body")"
          echo "pr=$url" >> "$GITHUB_OUTPUT"
          # La CI de la PR, puis la fusion faite par le workflow lui-même. Si `main` a avancé entre-temps (« à jour avant de fusionner »), la branche reprend main
          # (`update-branch`, une fusion : rien n'est réécrit) et sa CI recommence ; trois essais au plus.
          for essai in 1 2 3; do
            sleep 10
            sha="$(gh pr view "$url" --json headRefOid --jq .headRefOid)"
            # Sans ROBOT_TOKEN, un commit poussé par le jeton du workflow ne lance aucune CI (règle de GitHub) : on la lance, en mode `pr` (comme une PR).
            if [ "$HAS_ROBOT" != true ]; then GH_TOKEN="$GITHUB_TOKEN" gh workflow run ci.yml --ref "$branch" -f mode=pr; fi
            if ! node scripts/ci-complete.mjs statuts "$GITHUB_REPOSITORY" "$sha" test,e2e --attente-max 45; then
              echo "etat=ci-rouge" >> "$GITHUB_OUTPUT"
              echo "### ⛔ Jours figés : la CI de $url n'est pas verte — la lire, corriger, puis la fusionner" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if gh pr merge "$url" --merge --delete-branch --match-head-commit "$sha"; then
              echo "etat=fusionnee" >> "$GITHUB_OUTPUT"
              echo "### ✅ Jours figés versés dans main : $url (fusionnée par le workflow)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$essai" = 3 ] || gh pr update-branch "$url" || break
          done
          if gh pr merge "$url" --merge --auto; then
            echo "etat=auto" >> "$GITHUB_OUTPUT"
            echo "### ⛔ Jours figés : la protection de main retient $url (fusion automatique programmée) — réglage : docs/plateforme/lots/lot-R12-un-seul-bouton.md, « Jours figés sans PR »" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "etat=refusee" >> "$GITHUB_OUTPUT"
            echo "### ⛔ Jours figés : la protection de main refuse la fusion de $url par le workflow — réglage : docs/plateforme/lots/lot-R12-un-seul-bouton.md, « Jours figés sans PR »" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  # 9. Le résumé, en haut du run : ✅ ou ⛔, la CI (relancée ou reprise), ce qui part, le jour de bascule, les jours par jeu, la sauvegarde, les liens ;
  # en cas d'arrêt, UNE phrase qui dit quoi faire (scripts/resume-bouton.mjs, testé).
  resume:
    needs: [verifier, ci, ci-verdict, figer, recette-serveur, recette-site, recette-verification, sauvegarde, serveur, site, verification, etiquette, depot]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Résumé
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/resume-bouton.mjs --resume "$GITHUB_STEP_SUMMARY"
