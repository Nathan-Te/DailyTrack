name: Preview
on:
  push:
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Vérifier la configuration Cloudflare
        id: cfg
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets Cloudflare absents : aperçu ignoré."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci && npm run build
      - name: Déployer l'aperçu
        if: steps.cfg.outputs.ok == 'true'
        run: >
          npx wrangler@4 pages deploy apps/web/dist
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch "${{ github.head_ref || github.ref_name }}"
