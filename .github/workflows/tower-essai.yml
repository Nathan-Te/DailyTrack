name: Tower — essai de la physique
# Lot T0 (Tower) : le déterminisme des deux moteurs de l'essai (A : entiers ; B : Rapier déterministe, WebAssembly) rejoué dans Chromium, Firefox et WebKit
# (`apps/tower/e2e/determinisme.spec.ts`, étiqueté `@navigateurs` comme les autres : règle R13). Les empreintes de référence viennent de Node (`npm test`).
# Workflow DÉDIÉ, ajouté par le lot T0 parce que ni la CI de PR courte ni la matrice « petit ensemble » de ci.yml ne connaissent encore un troisième jeu (la table
# e2e/zones.json, scripts/ci-zones.mjs, le rapport fusionné) : leur extension est un lot de la plateforme (docs/tower/lots/lot-T0-physique.md, « Questions »).
# Non requis pour fusionner. Se lance sur une PR qui touche l'essai, et à la demande.
on:
  pull_request:
    paths:
      - packages/tower-sim/**
      - apps/tower/**
      - .github/workflows/tower-essai.yml
  workflow_dispatch:

# Lot R7 (audit de sécurité) : lecture seule.
permissions:
  contents: read

concurrency:
  group: tower-essai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinisme:
    name: determinisme (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
      - run: npx playwright install ${{ matrix.browser }}
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit != 'true'
      # Les paquets système du navigateur sans apt lent (scripts/paquets-playwright.sh, lot R12) : même clé et même cache que ci.yml.
      - name: Clé des paquets système
        id: paquets
        run: |
          pw="$(node -p 'require("./node_modules/@playwright/test/package.json").version')"
          echo "prefixe=paquets-${{ runner.os }}-${{ matrix.browser }}-pw$pw-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "cle=paquets-${{ runner.os }}-${{ matrix.browser }}-pw$pw-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: paquets-cache
        with:
          path: ~/paquets-playwright
          key: ${{ steps.paquets.outputs.cle }}
          restore-keys: ${{ steps.paquets.outputs.prefixe }}
      - name: Paquets système de Playwright
        run: bash scripts/paquets-playwright.sh ${{ matrix.browser }} "$HOME/paquets-playwright"
        timeout-minutes: 15
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.paquets-cache.outputs.cache-hit != 'true'
        with:
          path: ~/paquets-playwright
          key: ${{ steps.paquets.outputs.cle }}
      - run: npm run build -w @cdj/tower
      - name: Déterminisme dans ${{ matrix.browser }}
        run: npm run e2e -w @cdj/tower -- --project=tower-${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: tower-essai-${{ matrix.browser }}
          path: apps/tower/test-results/
          retention-days: 7
          if-no-files-found: ignore
