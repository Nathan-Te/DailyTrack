name: Stabilité
# Lot R3 (plateforme) : preuve qu'un test réparé ne vacille plus — `repetitions` passages DE SUITE (`--repeat-each`, `--retries=0` : aucune
# relance), sur son navigateur, sur le runner de la CI (2 parts de rendu logiciel, mêmes réglages que ci.yml). Liste : e2e/stabilite.json
# (testée par apps/web/test/stabilite.test.ts). Se lance sur une PR qui change cette liste ou ce workflow, et à la demande. Non requis pour
# fusionner : c'est une preuve, donnée par le README du lot qui répare.
on:
  pull_request:
    paths:
      - e2e/stabilite.json
      - .github/workflows/stabilite.yml
  workflow_dispatch:

# Lot R7 (audit de sécurité) : lecture seule.
permissions:
  contents: read

concurrency:
  group: stabilite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.liste.outputs.matrix }}
      repetitions: ${{ steps.liste.outputs.repetitions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: liste
        # Lot K4 : le projet Playwright et le dossier de chaque test viennent de la fiche de son jeu (scripts/e2e-suite.mjs).
        run: node scripts/e2e-suite.mjs stabilite >> "$GITHUB_OUTPUT"

  repetition:
    needs: liste
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.liste.outputs.matrix) }}
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.navigateur }}${{ matrix.navigateur != 'chromium' && '-avec-chromium' || '' }}
      # Lot B1b : Chromium en plus (les images de partage du site assemblé par un spec sont dessinées par lui seul : scripts/images-partage.mjs).
      - run: npx playwright install --with-deps ${{ matrix.navigateur != 'chromium' && format('{0} chromium', matrix.navigateur) || 'chromium' }}
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps ${{ matrix.navigateur != 'chromium' && format('{0} chromium', matrix.navigateur) || 'chromium' }}
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Construction (${{ matrix.jeu }})
        env:
          SUITE: ${{ matrix.jeu }}
        run: node scripts/e2e-suite.mjs construire "$SUITE"
      - name: ${{ needs.liste.outputs.repetitions }} passages de suite, sans relance
        env:
          FICHIER: ${{ matrix.fichier }}
          TITRE: ${{ matrix.titre }}
          PROJET: ${{ matrix.projet }}
          N: ${{ needs.liste.outputs.repetitions }}
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          args=(--project="$PROJET" --workers=1 --retries=0 --repeat-each="$N" --reporter=list)
          [ -z "$TITRE" ] || args+=(--grep "$TITRE")
          set +e
          npx playwright test "e2e/$FICHIER" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/sortie.txt"
          code=${PIPESTATUS[0]}
          # Le compte de la fin de sortie de Playwright (« 30 passed », « 1 failed ») ; absent = 0 (sans faire échouer l'étape).
          count() { grep -Eo "^ +[0-9]+ $1" "$RUNNER_TEMP/sortie.txt" | grep -Eo '[0-9]+' | tail -1; }
          passed=$(count passed); failed=$(count failed); flaky=$(count flaky)
          echo "### $FICHIER${TITRE:+ › $TITRE} ($PROJET) : ${passed:-0} réussis, ${failed:-0} échecs, ${flaky:-0} instables, $N passages demandés par test, sans relance" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: stabilite-${{ strategy.job-index }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 7
          if-no-files-found: ignore
