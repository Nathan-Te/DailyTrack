name: Aperçu
# Lot R4 (plateforme) : un aperçu par PR, sur une adresse à part — un **canal d'aperçu Firebase** du site de RECETTE (`pr-<n>`,
# `https://<site de recette>--pr-<n>-<empreinte>.web.app`), avec le portail, /track/ et /jump/. Il remplace les aperçus `/b/<branche>/` de
# GitHub Pages. Une origine à part : son stockage local est séparé de celui de la production par le navigateur (plus de préfixe `apercu:`).
#   - PR ouverte ou mise à jour : construit avec VITE_API_URL=/ → /api/** renvoyé vers la recette PAR DÉFAUT (cdj-api-recette) ; commentaire
#     « Aperçu » sur la PR ; le canal expire 7 jours après la dernière poussée.
#     Une PR qui touche le serveur (SERVER_PATHS) : rien ici, recette.yml publie son aperçu, branché sur SA révision de recette.
#   - PR fermée (fusionnée ou non) : le canal est supprimé.
# Jamais pour une PR venue d'un fork (aucun secret). Sans Firebase configuré : sauté, « Firebase non configuré : voir docs/plateforme/domaine.md ».
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: apercu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS: firebase-tools@15.34.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
      canal: ${{ steps.plan.outputs.canal }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          PR_ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          canal="$(node scripts/domaine.mjs canal "$PR")"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            action=fork
            echo "::notice title=Aperçu::PR venue d'un fork ($HEAD_REPO) : pas d'aperçu (aucun secret ne sort du dépôt)."
          elif [ "$PR_ACTION" = closed ]; then
            action=cleanup
          else
            # La même règle que recette.yml (`on.pull_request.paths` = SERVER_PATHS) : une PR qui touche le serveur a son aperçu par recette.yml.
            git fetch --no-tags -q origin "$BASE"
            server="$(git diff --name-only "origin/$BASE...HEAD" | node scripts/recette.mjs touches-server)"
            if [ "$server" = true ]; then
              action=recette
              echo "### Aperçu : la PR touche le serveur — publié par le workflow « Recette », branché sur sa révision" >> "$GITHUB_STEP_SUMMARY"
            else
              action=deploy
            fi
          fi
          { echo "action=$action"; echo "canal=$canal"; } >> "$GITHUB_OUTPUT"
          echo "action : $action · canal : $canal"

  deploy:
    needs: plan
    if: needs.plan.outputs.action == 'deploy'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      cible: recette
      canal: ${{ needs.plan.outputs.canal }}
      api: /
    secrets: inherit

  announce:
    needs: [plan, deploy]
    if: needs.deploy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW: ${{ needs.deploy.outputs.url }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Commentaire sur la PR
        run: |
          marker="<!-- apercu-r4 -->"
          {
            echo "$marker"
            echo "### Aperçu"
            echo ""
            echo "- Portail : ${PREVIEW%/}/ · **DailyTrack** : ${PREVIEW%/}/track/ · **DailyJump** : ${PREVIEW%/}/jump/"
            echo "- Serveur : la recette par défaut (\`/api/\`, même origine). Stockage local séparé de la production (une autre origine)."
            echo "- Construit depuis \`${GITHUB_SHA::7}\` (la PR fusionnée avec main). Expire 7 jours après la dernière poussée ; supprimé à la fermeture de la PR."
          } > body.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
          fi

  # PR fermée : le canal d'aperçu est supprimé (celui d'une PR qui touche le serveur aussi : c'est le même canal `pr-<n>`).
  cleanup:
    needs: plan
    if: needs.plan.outputs.action == 'cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SITE: ${{ vars.FIREBASE_SITE_RECETTE }}
      CANAL: ${{ needs.plan.outputs.canal }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Configuration présente ?
        id: cfg
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$SITE" ] && { { [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; } || [ "$HAS_SA_KEY" = true ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Firebase non configuré : voir docs/plateforme/domaine.md (aucun canal à supprimer)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Firebase non configuré::Firebase non configuré : voir docs/plateforme/domaine.md"
          fi
      - uses: google-github-actions/auth@v3
        if: steps.cfg.outputs.enabled == 'true' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/auth@v3
        if: steps.cfg.outputs.enabled == 'true' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '')
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Supprimer le canal d'aperçu
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          if npx --yes "$FIREBASE_TOOLS" hosting:channel:delete "$CANAL" --site "$SITE" --project "$GCP_PROJECT_ID" --force; then
            echo "- Canal d'aperçu \`$CANAL\` supprimé." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Canal d'aperçu \`$CANAL\` : rien à supprimer (déjà expiré, ou jamais créé)." >> "$GITHUB_STEP_SUMMARY"
          fi
