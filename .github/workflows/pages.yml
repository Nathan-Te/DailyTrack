name: Pages
# Lot R4 (plateforme) : GitHub Pages ne publie plus les jeux, seulement des **pages de redirection** vers playdujour.com
# (apps/portail/redirection.html, scripts/site.mjs redirections) :
#   /DailyTrack/            → https://playdujour.com/track/      (paramètres gardés : ?seed=, ?watch=, ?api=…)
#   /DailyTrack/jump/       → https://playdujour.com/jump/
#   /DailyTrack/b/…         → une page qui explique que les aperçus ont déménagé (canaux d'aperçu Firebase, lien commenté sur chaque PR)
# La page lit l'identité de la plateforme dans le stockage de l'ancienne origine (et les données locales utiles de DailyJump) et la transmet
# dans le FRAGMENT de l'adresse (`#dujour=…`, jamais envoyé au serveur) ; le jeu l'importe une seule fois (@cdj/profile, migration.ts).
#
# **Bascule** : à la première mise en production de ce lot (production.yml l'appelle, après la vérification de la production sur playdujour.com),
# pas avant : d'ici là, la branche gh-pages garde les jeux tels qu'ils ont été publiés la dernière fois. Chaque mise en production republie ces
# pages (sans effet si rien n'a changé). Les redirections restent au moins 6 mois : date de retrait dans docs/plateforme/domaine.md.
# « Run workflow » à la main : seulement en écrivant « rediriger » (une erreur ne doit pas basculer avant l'heure).
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Écrire « rediriger » : l'ancienne adresse ne servira plus que des redirections vers playdujour.com"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: pages-redirections
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: Confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMER: ${{ inputs.confirmer }}
        run: |
          [ "$CONFIRMER" = rediriger ] || { echo "::error::écrire « rediriger » pour publier les redirections (rien n'a été publié)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire les pages de redirection
        run: |
          cible="$(node scripts/domaine.mjs adresse production)"
          node scripts/site.mjs redirections --sortie pages --cible "$cible" --base "/${GITHUB_REPOSITORY#*/}/"
          # Garde-fou : la page ne doit viser que le domaine (aucune adresse lue dans l'URL : voir apps/portail/src/redirection.ts).
          grep -rq "$cible" pages/assets || { echo "::error::la cible $cible n'est pas dans les pages construites"; exit 1; }
      - name: Publier sur gh-pages (tout est remplacé, anciens aperçus compris)
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            rm -rf site
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
              git clone -q --depth 1 --branch gh-pages "$remote" site
            else
              mkdir site && (cd site && git init -q -b gh-pages && git remote add origin "$remote")
            fi
            find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R pages/. site/
            cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then cd ..; echo "redirections déjà publiées : rien de neuf"; break; fi
            git commit -q -m "Redirections vers playdujour.com (${GITHUB_SHA::7})"
            if git push -q origin gh-pages; then cd ..; break; fi
            cd ..
            [ "$attempt" = 3 ] && { echo "::error::gh-pages n'a pas pu être poussée"; exit 1; }
            sleep $((attempt * 3))
          done
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "### GitHub Pages : redirections publiées"
            echo "- https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/ → https://playdujour.com/track/ (profil transmis dans le fragment)"
            echo "- https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/jump/ → https://playdujour.com/jump/"
            echo "- https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/b/… → « les aperçus ont déménagé »"
          } >> "$GITHUB_STEP_SUMMARY"
