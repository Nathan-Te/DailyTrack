name: Pages
# Publie le jeu sur GitHub Pages (branche gh-pages) :
#   main     → https://<utilisateur>.github.io/<dépôt>/            (DailyTrack)      et  …/<dépôt>/jump/            (DailyJump)
#   branche  → https://<utilisateur>.github.io/<dépôt>/b/<branche>/ (DailyTrack)      et  …/b/<branche>/jump/        (DailyJump)
on:
  push:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref_name != 'gh-pages'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Construit DailyTrack (apps/web) puis DailyJump (apps/jump) ; VITE_API_URL ne concerne que DailyTrack.
      - run: npm run build
        env:
          # L'adresse de l'API de production n'est injectée que dans la construction de main : un aperçu de branche ne classe jamais
          # ses essais dans la vraie base (il peut toujours viser une autre API avec ?api=…).
          VITE_API_URL: ${{ github.ref_name == 'main' && vars.VITE_API_URL || '' }}
          # Lot 31 : le site publié depuis main n'a ni touches N et T, ni circuit à venir (?day=), ni ?variant= / ?theme= pour aujourd'hui :
          # ces outils restent dans les aperçus de branche et en ?debug (voir apps/web/src/access.ts).
          VITE_PRODUCTION: ${{ github.ref_name == 'main' && '1' || '' }}

      - name: Récupérer la branche gh-pages (ou la créer)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site && cd site && git init -q -b gh-pages
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Copier le build
        run: |
          slug="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            # La racine est remplacée, les aperçus de branches (b/) sont conservés.
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name b -exec rm -rf {} +
            cp -R apps/web/dist/. site/
            mkdir -p site/jump && cp -R apps/jump/dist/. site/jump/
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          else
            rm -rf "site/b/${slug}"
            mkdir -p "site/b/${slug}"
            cp -R apps/web/dist/. "site/b/${slug}/"
            mkdir -p "site/b/${slug}/jump" && cp -R apps/jump/dist/. "site/b/${slug}/jump/"
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/b/${slug}/"
          fi
          touch site/.nojekyll
          echo "### Aperçu : ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "### Aperçu DailyJump : ${url}jump/?debug" >> "$GITHUB_STEP_SUMMARY"

      # Lot 3c : les niveaux figés de DailyJump (apps/jump/public/levels/, lot 10) doivent être dans le site publié, pour main comme pour un
      # aperçu de branche : le jeu les lit à côté de la page (`levels/AAAA-MM-JJ.json`) et, s'ils manquent, un jour déjà joué changerait de niveau.
      - name: Vérifier les niveaux figés publiés
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then dest="site/jump"; else dest="site/b/$(echo "${GITHUB_REF_NAME}" | tr '/' '-')/jump"; fi
          missing=0
          for f in apps/jump/public/levels/*.json; do
            [ -e "$f" ] || continue
            cmp -s "$f" "$dest/levels/$(basename "$f")" || { echo "::error::niveau figé absent ou différent du site publié : $dest/levels/$(basename "$f")"; missing=1; }
          done
          [ "$missing" = 0 ] && echo "niveaux figés publiés : $(ls apps/jump/public/levels | wc -l) fichier(s) dans $dest/levels" >> "$GITHUB_STEP_SUMMARY"
          exit $missing

      - name: Publier
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Aperçu de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push origin gh-pages
