name: Deploy site
# Lot R4 (plateforme) : publie le site (portail « Du Jour » à la racine, DailyTrack sous /track/, DailyJump sous /jump/) sur Firebase Hosting.
# Appelé par les autres workflows, jamais seul :
#   - production : site de production (playdujour.com), version « live » — production.yml (« Mettre en production »), après le serveur ;
#   - recette    : site de recette (recette.playdujour.com), « live » — recette.yml, à chaque fusion dans main ;
#   - recette + canal : un canal d'aperçu `pr-<n>` du site de RECETTE (adresse `https://<site>--pr-<n>-<empreinte>.web.app`, 7 jours) —
#     apercu.yml (toute PR), ou recette.yml (PR qui touche le serveur : l'aperçu vise alors sa révision de recette par son adresse directe).
# Le serveur est sous la même adresse : firebase.json renvoie /api/** vers le service Cloud Run de la cible (production → cdj-api, recette et
# aperçus → cdj-api-recette, europe-west1) ; les jeux sont construits avec VITE_API_URL=/ (`/api/` sur leur propre origine, aucun pré-vol CORS).
# Chaque site et chaque canal est une origine à part : leur stockage local est séparé de celui de la production par le navigateur.
# Lot I6 : les images de partage sont produites à la construction par le Chromium de Playwright (installé ici) ; les aperçus de partage portent
# l'adresse absolue du site déployé (`--origine`) : la production, la recette, ou le canal d'aperçu (retrouvé ou créé AVANT la construction,
# pour que l'aperçu d'une PR montre sa propre image et pas celle de la production).
# Tant que Firebase n'est pas configuré (variables ci-dessous), tout est sauté avec le message « Firebase non configuré : voir
# docs/plateforme/domaine.md » et le job reste vert.
#
# Variables GitHub : FIREBASE_SITE_PRODUCTION, FIREBASE_SITE_RECETTE (identifiants des deux sites), GCP_PROJECT_ID ; facultatives :
# GCP_SERVICE (cdj-api), RECETTE_GCP_SERVICE (cdj-api-recette), GCP_REGION (europe-west1). Secrets : les mêmes que le serveur
# (GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT, ou GCP_SA_KEY) ; le compte de déploiement a le rôle « Firebase Hosting Admin ».
on:
  workflow_call:
    inputs:
      cible:
        description: "production ou recette"
        type: string
        required: true
      canal:
        description: "canal d'aperçu (recette seulement, ex. pr-12) ; vide : la version « live » du site"
        type: string
        default: ""
      api:
        description: "VITE_API_URL : « / » (la même origine, défaut) ou l'adresse directe d'une révision de recette (aperçu d'une PR qui touche le serveur)"
        type: string
        default: "/"
      ref:
        description: "commit à construire (défaut : celui du workflow)"
        type: string
        default: ""
      jours_figes:
        description: "artefact de jours figés à ajouter avant la construction (production.yml) ; vide : aucun"
        type: string
        default: ""
      jours_tower:
        description: "lot TP : artefact des jours de Tower (préparés ou refaits avec le code déployé, plan compris) posés dans apps/tower/public/jours avant la construction (production.yml) ; vide : aucun"
        type: string
        default: ""
      registre_track:
        description: "lot R11 : artefact du registre des jours de Track (jours-track.json), fusionné dans packages/sim/src/jours-track.json avant la construction (production.yml) ; vide : aucun"
        type: string
        default: ""
      expire:
        description: "durée d'un canal d'aperçu"
        type: string
        default: "7d"
      bascule_le:
        description: "lot R6 : le jour de bascule de la mise en production (AAAA-MM-JJ), re-vérifié avant de publier ; vide : pas de vérification (recette)"
        type: string
        default: ""
    outputs:
      enabled:
        description: "« true » si Firebase est configuré et le site déployé"
        value: ${{ jobs.deploy.outputs.enabled }}
      url:
        description: "adresse publique (production, recette) ou du canal d'aperçu"
        value: ${{ jobs.deploy.outputs.url }}
      version:
        description: "version Firebase déployée (identifiant : retour arrière par hosting:clone)"
        value: ${{ jobs.deploy.outputs.version }}
      site:
        description: "identifiant du site Firebase"
        value: ${{ jobs.deploy.outputs.site }}

permissions:
  contents: read
  id-token: write

env:
  # Outil officiel de Firebase, version épinglée (lancé par npx : aucune dépendance ajoutée au dépôt). Changer de version = relire le README du lot R4.
  FIREBASE_TOOLS: firebase-tools@15.34.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-site-${{ inputs.cible }}-${{ inputs.canal || 'live' }}
      cancel-in-progress: false
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
      url: ${{ steps.deploy.outputs.url }}
      version: ${{ steps.deploy.outputs.version }}
      site: ${{ steps.cfg.outputs.site }}
    env:
      CIBLE: ${{ inputs.cible }}
      CANAL: ${{ inputs.canal }}
      API: ${{ inputs.api }}
      BASCULE: ${{ inputs.bascule_le }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SITE_PRODUCTION: ${{ vars.FIREBASE_SITE_PRODUCTION }}
      SITE_RECETTE: ${{ vars.FIREBASE_SITE_RECETTE }}
      PROD_SERVICE: ${{ vars.GCP_SERVICE || 'cdj-api' }}
      RECETTE_SERVICE: ${{ vars.RECETTE_GCP_SERVICE || 'cdj-api-recette' }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      PROD_API_URL: ${{ vars.VITE_API_URL }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Configuration présente ?
        id: cfg
        run: |
          if [ "$CIBLE" != production ] && [ "$CIBLE" != recette ]; then echo "::error::cible inconnue : « $CIBLE » (production ou recette)"; exit 1; fi
          # Garde-fous (avant toute configuration) : un aperçu ne vit que sur le site de recette ; la production ne parle qu'à elle-même.
          if [ "$CIBLE" = production ] && [ -n "$CANAL" ]; then echo "::error::les canaux d'aperçu vont sur le site de recette, jamais sur celui de la production"; exit 1; fi
          if [ "$CIBLE" = production ] && [ "$API" != / ]; then echo "::error::la production appelle /api/ sur sa propre origine (VITE_API_URL=/), reçu « $API »"; exit 1; fi
          if [ "$CIBLE" = recette ] && [ "$API" != / ]; then
            api_host="$(printf '%s' "$API" | sed -E 's#^https?://##; s#/.*$##')"
            case "$api_host" in *playdujour.com) [ "$api_host" = "recette.playdujour.com" ] || { echo "::error title=Aperçu branché sur la production::$API"; exit 1; } ;; esac
            if [ -n "$PROD_API_URL" ]; then
              prod_host="$(printf '%s' "$PROD_API_URL" | sed -E 's#^https?://##; s#/.*$##')"
              case "$api_host" in "$prod_host"|*"---$prod_host") echo "::error title=Aperçu branché sur la production::$API est l'adresse du serveur de production"; exit 1 ;; esac
            fi
          fi
          if [ "$CIBLE" = production ]; then site="$SITE_PRODUCTION"; sitevar=FIREBASE_SITE_PRODUCTION; service="$PROD_SERVICE"; else site="$SITE_RECETTE"; sitevar=FIREBASE_SITE_RECETTE; service="$RECETTE_SERVICE"; fi
          missing=""
          [ -n "$GCP_PROJECT_ID" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "$site" ] || missing="$missing $sitevar"
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            [ "$HAS_SA_KEY" = true ] || missing="$missing (GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT, ou GCP_SA_KEY)"
          fi
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Firebase non configuré : voir docs/plateforme/domaine.md" >> "$GITHUB_STEP_SUMMARY"
            echo "Site ($CIBLE${CANAL:+, canal $CANAL}) non publié. Il manque :$missing." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Firebase non configuré::Firebase non configuré : voir docs/plateforme/domaine.md (il manque :$missing)"
            exit 0
          fi
          if [ "$CIBLE" = recette ] && [ "$SITE_RECETTE" = "$SITE_PRODUCTION" ]; then echo "::error::FIREBASE_SITE_RECETTE est le site de production"; exit 1; fi
          { echo "enabled=true"; echo "site=$site"; echo "service=$service"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Lot R6 : le jour de bascule ne doit pas avoir commencé quand le site part (production.yml, après la validation du serveur).
      - name: Le jour de bascule n'a pas encore commencé
        if: ${{ steps.cfg.outputs.enabled == 'true' && inputs.bascule_le != '' }}
        run: node scripts/mise-en-production.mjs bascule-valide "$BASCULE"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.enabled == 'true' && inputs.jours_figes != ''
        with:
          name: ${{ inputs.jours_figes }}
          path: ${{ runner.temp }}/jours-figes

      # Les jours figés avec le code en production (production.yml) rejoignent le site : ajoutés s'ils manquent, refusés s'ils diffèrent.
      - name: Jours figés de la mise en production
        if: steps.cfg.outputs.enabled == 'true' && inputs.jours_figes != ''
        run: node scripts/mise-en-production.mjs jours-figes "$RUNNER_TEMP/jours-figes" apps/jump/public/levels | tee -a "$GITHUB_STEP_SUMMARY"

      # Lot TP : les jours de Tower préparés avec le code déployé entrent dans le site (la construction de production en retire la preuve).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.enabled == 'true' && inputs.jours_tower != ''
        with:
          name: ${{ inputs.jours_tower }}
          path: ${{ runner.temp }}/jours-tower
      - name: Jours de Tower de la mise en production
        if: steps.cfg.outputs.enabled == 'true' && inputs.jours_tower != ''
        run: node scripts/mise-en-production.mjs tower-poser "$RUNNER_TEMP/jours-tower" apps/tower/public/jours | tee -a "$GITHUB_STEP_SUMMARY"

      # Lot R11 : le registre des jours de Track rejoint le site (le jeu calcule le circuit du jour avec la version que le registre note pour ce jour).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.enabled == 'true' && inputs.registre_track != ''
        with:
          name: ${{ inputs.registre_track }}
          path: ${{ runner.temp }}/registre-track
      - name: Registre des jours de Track
        if: steps.cfg.outputs.enabled == 'true' && inputs.registre_track != ''
        run: node scripts/mise-en-production.mjs registre-fusion packages/sim/src/jours-track.json "$RUNNER_TEMP/registre-track/jours-track.json" --resume "$GITHUB_STEP_SUMMARY"
      # Lot R11 : la validation de Nathan a pu durer. Un jour que cette mise en production régénère (aucun résultat à la lecture du garde-fou) ne doit pas en avoir reçu depuis (lecture seule).
      - name: Les jours sans résultat n'en ont toujours pas
        if: ${{ steps.cfg.outputs.enabled == 'true' && inputs.registre_track != '' && inputs.bascule_le != '' }}
        run: node scripts/mise-en-production.mjs proteges-verifier "$RUNNER_TEMP/registre-track/proteges.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.enabled == 'true'

      - name: Authentification Google Cloud (fédération d'identité)
        if: steps.cfg.outputs.enabled == 'true' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Authentification Google Cloud (clé JSON)
        if: steps.cfg.outputs.enabled == 'true' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Lot I6 : le navigateur qui dessine les images de partage et les icônes (scripts/images-partage.mjs, appelé par scripts/site.mjs).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.cfg.outputs.enabled == 'true'
        id: navigateur
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Chromium de Playwright (images de partage)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.navigateur.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      # Lot I6 : l'origine du site déployé, écrite dans les aperçus de partage (og:url, og:image). Production et recette : leur adresse publique ;
      # un canal d'aperçu : son adresse, retrouvée ou créée maintenant (le même canal est ensuite publié par `hosting:channel:deploy`).
      - name: Origine du site
        id: origine
        if: steps.cfg.outputs.enabled == 'true'
        env:
          SITE: ${{ steps.cfg.outputs.site }}
          EXPIRE: ${{ inputs.expire }}
        run: |
          if [ -n "$CANAL" ]; then
            list() { npx --yes "$FIREBASE_TOOLS" hosting:channel:list --site "$SITE" --project "$GCP_PROJECT_ID" --json | jq -r --arg c "$CANAL" '.result.channels[]? | select(.name | endswith("/channels/" + $c)) | .url'; }
            url="$(list)"
            if [ -z "$url" ]; then
              npx --yes "$FIREBASE_TOOLS" hosting:channel:create "$CANAL" --site "$SITE" --project "$GCP_PROJECT_ID" --expires "$EXPIRE" --json > created.json || { cat created.json; exit 1; }
              url="$(jq -r '.result.url // empty' created.json)"
              [ -n "$url" ] || url="$(list)"
            fi
            [ -n "$url" ] || { echo "::error::adresse du canal $CANAL introuvable"; exit 1; }
            origine="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$url")"
          else
            origine="$(node scripts/domaine.mjs adresse "$CIBLE")"
          fi
          echo "origine=$origine" >> "$GITHUB_OUTPUT"
          echo "- Aperçus de partage : $origine (og:url, og:image)" >> "$GITHUB_STEP_SUMMARY"

      # Les deux jeux, puis le site assemblé (scripts/site.mjs : portail, /track/, /jump/, niveaux figés vérifiés).
      # Plus de VITE_STORAGE : chaque site et chaque canal est une origine à part, son stockage est séparé par le navigateur (lot R4).
      - name: Construire les jeux et le site
        if: steps.cfg.outputs.enabled == 'true'
        env:
          VITE_API_URL: ${{ inputs.api }}
          # Lot 31 : la production n'a ni touches N et T, ni circuit à venir, ni ?variant= / ?theme= pour aujourd'hui (apps/web/src/access.ts) ;
          # la recette (main en entier) et les aperçus les gardent.
          VITE_PRODUCTION: ${{ inputs.cible == 'production' && '1' || '' }}
          # Lot R8 : la recette et les aperçus peuvent essayer « Journée n° 1 » un autre jour (variable du dépôt RECETTE_PREMIER_JOUR, AAAA-MM-JJ) ;
          # la production lit config/lancement.json seulement (scripts/site.mjs refuse la variable pour elle).
          VITE_LANCEMENT_PREMIER_JOUR: ${{ inputs.cible == 'recette' && vars.RECETTE_PREMIER_JOUR || '' }}
        run: |
          npm run build
          # Lot I1 : la vitrine des composants (/ui/) n'est jamais publiée en production (recette et aperçus seulement).
          node scripts/site.mjs site --sortie site ${{ inputs.cible == 'production' && '--production' || '' }} --origine "${{ steps.origine.outputs.origine }}"
          # Lot R7 : la recette et les aperçus ne sont pas indexés (en-tête X-Robots-Tag et robots.txt « tout interdit »).
          noindex=""; [ "$CIBLE" = production ] || noindex="--noindex"
          node scripts/site.mjs firebase --site "${{ steps.cfg.outputs.site }}" --service "${{ steps.cfg.outputs.service }}" --region "$REGION" --public site --sortie firebase.json $noindex

      - name: Publier sur Firebase Hosting
        id: deploy
        if: steps.cfg.outputs.enabled == 'true'
        env:
          SITE: ${{ steps.cfg.outputs.site }}
          EXPIRE: ${{ inputs.expire }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          message="${GITHUB_REPOSITORY}@${REF} (run ${GITHUB_RUN_ID})"
          if [ -n "$CANAL" ]; then
            npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "$CANAL" --project "$GCP_PROJECT_ID" --expires "$EXPIRE" --no-authorized-domains --json > deploy.json || { cat deploy.json; exit 1; }
            url="$(jq -r --arg s "$SITE" '.result[$s].url // ([.result[]][0].url) // empty' deploy.json)"
            version="$(jq -r --arg s "$SITE" '.result[$s].version // ([.result[]][0].version) // empty' deploy.json)"
          else
            npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project "$GCP_PROJECT_ID" --message "$message" --non-interactive --json > deploy.json || { cat deploy.json; exit 1; }
            version="$(jq -r '.result.hosting // empty | if type == "array" then .[0] else . end' deploy.json | sed -E 's#.*/versions/##')"
            url="$(node scripts/domaine.mjs adresse "$CIBLE")"
          fi
          [ -n "$url" ] || { echo "::error::adresse du site introuvable dans la réponse de Firebase"; cat deploy.json; exit 1; }
          { echo "url=$url"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Site publié ($CIBLE${CANAL:+, canal d’aperçu \`$CANAL\`})"
            echo "- Adresse : $url — DailyTrack : ${url%/}/track/ · DailyJump : ${url%/}/jump/"
            echo "- Site Firebase : \`$SITE\` (https://$SITE.web.app), version \`${version:-?}\`"
            echo "- Serveur : \`/api/\` → $( [ "$API" = / ] && echo "même origine (renvoi vers ${{ steps.cfg.outputs.service }})" || echo "$API (adresse directe)")"
            [ -z "$CANAL" ] || echo "- Expire dans $EXPIRE (supprimé à la fermeture de la PR)."
          } >> "$GITHUB_STEP_SUMMARY"
