name: Deploy API
# Déploie l'API (classement, planning, Salon) sur Google Cloud Run : image Docker → Artifact Registry → Cloud Run, puis contrôle de /api/health.
# Lot R1 (plateforme) : un seul workflow, appelé par les autres, pour deux cibles entièrement séparées :
#   - production : service `cdj-api`, base Turso des joueurs ; environnement GitHub `production` (limité à main ; lot R12 : sans relecteur, le lancement
#     du bouton « Mettre en production » vaut validation). Appelé par production.yml seulement.
#   - recette    : service `cdj-api-recette`, base Turso de recette, ses propres secrets (Secret Manager). Appelé par recette.yml :
#     une révision étiquetée SANS trafic par PR (`tag`), ou la révision qui reçoit le trafic de recette (fusion dans main, `tag` vide).
# Lot R4 : la production n'est plus déployée par une fusion, mais par le bouton « Mettre en production » (production.yml), qui construit un
# commit choisi (`ref`) avec les jours figés par le code en production (`jours_figes`). Les origines permises viennent de scripts/domaine.mjs
# (playdujour.com, recette.playdujour.com, l'ancienne origine jusqu'à sa date de retrait) ; `TRUST_PROXY` : variable du dépôt (Firebase Hosting
# ajoute un proxy devant Cloud Run, à mesurer : scripts/sonde-proxy.mjs, docs/plateforme/domaine.md).
# Tant qu'une cible n'est pas configurée (variables et secrets ci-dessous), le job ne fait rien et le dit dans son résumé.
# Pas à pas pour Nathan : docs/mise-en-ligne.md (production), docs/plateforme/recette.md (recette).
#
# Variables GitHub (Settings → Secrets and variables → Actions → Variables) :
#   GCP_PROJECT_ID              identifiant du projet Google Cloud (commun aux deux cibles)
#   GCP_REGION                  région Cloud Run (défaut : europe-west1, Belgique, tarif de niveau 1)
#   production : TURSO_DATABASE_URL, GCP_SERVICE (cdj-api), GCP_AR_REPO (cdj), GCP_RUNTIME_SA (cdj-api-runtime@…), ALLOWED_ORIGINS (facultatif,
#                en plus de scripts/domaine.mjs), TRUST_PROXY (défaut 1)
#   recette    : RECETTE_TURSO_DATABASE_URL (son nom contient « recette »), RECETTE_GCP_SERVICE (cdj-api-recette), RECETTE_GCP_AR_REPO
#                (cdj-recette), RECETTE_GCP_RUNTIME_SA (cdj-recette-runtime@…), RECETTE_ALLOWED_ORIGINS (facultatif), RECETTE_TRUST_PROXY (défaut 1)
# Secrets GitHub : GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT (fédération d'identité, recommandé) ou GCP_SA_KEY (clé JSON).
# Les secrets de l'API elle-même vivent dans Secret Manager, jamais ici ni dans le dépôt :
#   production : cdj-turso-token, cdj-admin-token, cdj-rate-salt · recette : cdj-recette-turso-token, cdj-recette-admin-token, cdj-recette-rate-salt
# Lot N1 (panneau d'administration, /admin/) — facultatifs : si le secret n'existe pas, le panneau n'existe pas (404), le déploiement réussit et le dit :
#   production : cdj-admin-emails (les adresses permises), cdj-admin-session-key (32 caractères au moins) · recette : cdj-recette-admin-emails, cdj-recette-admin-session-key
#   Variable du dépôt ADMIN_GOOGLE_CLIENT_ID : l'identifiant client OAuth de Google (public). Pas à pas : docs/plateforme/admin.md.
on:
  workflow_call:
    inputs:
      target:
        description: "production ou recette"
        type: string
        required: true
      tag:
        description: "recette : étiquette de la révision sans trafic (vide : la révision qui reçoit le trafic de recette)"
        type: string
        default: ""
      salon_minutes:
        description: "recette seulement : sessions du Salon raccourcies (SALON_MINUTES)"
        type: string
        default: ""
      test_clock_offset_ms:
        description: "recette seulement : horloge de test du serveur (TEST_CLOCK_OFFSET_MS)"
        type: string
        default: ""
      ref:
        description: "lot R4 : commit à construire (défaut : celui du workflow)"
        type: string
        default: ""
      jours_figes:
        description: "lot R4 : artefact de jours figés ajoutés à l'image (production.yml) ; vide : aucun"
        type: string
        default: ""
      registre_track:
        description: "lot R11 : artefact du registre des jours de Track (jours-track.json), fusionné dans packages/sim/src/jours-track.json avant la construction (production.yml) ; vide : aucun"
        type: string
        default: ""
      extra_origins:
        description: "lot R4 : origines permises en plus (recette : l'origine du canal d'aperçu de la PR), séparées par « ; »"
        type: string
        default: ""
      etiquette:
        description: "lot N1 : l'étiquette prod-AAAA-MM-JJ-HHMM de cette mise en production (production.yml), que le tableau de bord du panneau montre ; vide : aucune"
        type: string
        default: ""
      bascule_le:
        description: "lot R6 : le jour de bascule de la mise en production (AAAA-MM-JJ) ; re-vérifié après la validation de Nathan : s'il a déjà commencé à Paris, le déploiement s'arrête. Vide : pas de vérification (recette)"
        type: string
        default: ""
    outputs:
      enabled:
        description: "« true » si la cible est configurée et déployée"
        value: ${{ jobs.deploy.outputs.enabled }}
      url:
        description: "adresse du service (production, recette par défaut) ou de la révision étiquetée"
        value: ${{ jobs.deploy.outputs.url }}
      image:
        description: "lot R4 : l'image déployée (retour arrière : production.yml la note dans l'étiquette prod-…)"
        value: ${{ jobs.deploy.outputs.image }}
  workflow_dispatch:
    inputs:
      # Lot R4 : la production ne se déploie plus d'ici (ni à la fusion) : bouton « Mettre en production » (production.yml), qui fige les
      # jours, vérifie et étiquette. Ici : la recette seulement.
      target:
        description: "recette (la production passe par « Mettre en production »)"
        type: choice
        options: [recette]
        default: recette
      tag:
        description: "recette : étiquette de la révision (vide : révision par défaut de la recette)"
        type: string
        default: ""
      salon_minutes:
        description: "recette seulement : SALON_MINUTES (essai rapide du Salon ; l'essai de bout en bout est alors sauté)"
        type: string
        default: ""
      test_clock_offset_ms:
        description: "recette seulement : TEST_CLOCK_OFFSET_MS (ms, entier : tester minuit)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # fédération d'identité (aucune clé longue durée)

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production : environnement `production`, limité à main (lot R12 : plus de relecteur, le bouton lancé sur main vaut validation). Recette : sans règle.
    environment:
      name: ${{ inputs.target == 'production' && 'production' || 'recette' }}
      url: ${{ steps.result.outputs.url }}
    concurrency:
      group: deploy-api-${{ inputs.target }}-${{ inputs.tag || 'defaut' }}
      cancel-in-progress: false
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
      url: ${{ steps.result.outputs.url }}
      image: ${{ steps.cfg.outputs.image }}
    env:
      TARGET: ${{ inputs.target }}
      TAG: ${{ inputs.tag }}
      SALON_MINUTES_IN: ${{ inputs.salon_minutes }}
      TEST_CLOCK_IN: ${{ inputs.test_clock_offset_ms }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      PROD_DB: ${{ vars.TURSO_DATABASE_URL }}
      PROD_SERVICE: ${{ vars.GCP_SERVICE }}
      PROD_AR_REPO: ${{ vars.GCP_AR_REPO }}
      PROD_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      PROD_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      RECETTE_DB: ${{ vars.RECETTE_TURSO_DATABASE_URL }}
      RECETTE_SERVICE: ${{ vars.RECETTE_GCP_SERVICE }}
      RECETTE_AR_REPO: ${{ vars.RECETTE_GCP_AR_REPO }}
      RECETTE_RUNTIME_SA: ${{ vars.RECETTE_GCP_RUNTIME_SA }}
      RECETTE_ORIGINS: ${{ vars.RECETTE_ALLOWED_ORIGINS }}
      PROD_TRUST_PROXY: ${{ vars.TRUST_PROXY || '1' }}
      RECETTE_TRUST_PROXY: ${{ vars.RECETTE_TRUST_PROXY || '1' }}
      RECETTE_PREMIER_JOUR: ${{ vars.RECETTE_PREMIER_JOUR }}
      EXTRA_ORIGINS: ${{ inputs.extra_origins }}
      JOURS_FIGES: ${{ inputs.jours_figes }}
      BASCULE: ${{ inputs.bascule_le }}
      ETIQUETTE: ${{ inputs.etiquette }}
      ADMIN_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Lot R6 : le run a pu durer (lot R12 : CI complète, répétition, sauvegarde) : si le jour de bascule a commencé entre-temps, les jours conservés ne le seraient plus.
      - name: Le jour de bascule n'a pas encore commencé
        if: ${{ inputs.bascule_le != '' }}
        run: node scripts/mise-en-production.mjs bascule-valide "$BASCULE"

      - name: Configuration présente ?
        id: cfg
        run: |
          if [ "$TARGET" != production ] && [ "$TARGET" != recette ]; then
            echo "::error::cible inconnue : « $TARGET » (production ou recette)"; exit 1
          fi
          if [ "$TARGET" = production ] && { [ -n "$TAG" ] || [ -n "$SALON_MINUTES_IN" ] || [ -n "$TEST_CLOCK_IN" ]; }; then
            echo "::error::étiquette, SALON_MINUTES et TEST_CLOCK_OFFSET_MS sont réservés à la recette"; exit 1
          fi
          if [ "$TARGET" = recette ]; then db="$RECETTE_DB"; dbvar=RECETTE_TURSO_DATABASE_URL; else db="$PROD_DB"; dbvar=TURSO_DATABASE_URL; fi
          missing=""
          [ -n "$GCP_PROJECT_ID" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "$db" ] || missing="$missing $dbvar"
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            [ "$HAS_SA_KEY" = "true" ] || missing="$missing (GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT, ou GCP_SA_KEY)"
          fi
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$TARGET" = recette ]; then
              echo "### Recette non configurée : voir docs/plateforme/recette.md" >> "$GITHUB_STEP_SUMMARY"
              echo "Étape sautée. Il manque :$missing. Les aperçus de branche restent sans serveur, comme avant." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Recette non configurée::recette non configurée : voir docs/plateforme/recette.md (il manque :$missing)"
            else
              echo "### Déploiement de l'API ignoré" >> "$GITHUB_STEP_SUMMARY"
              echo "La mise en ligne n'est pas configurée. Il manque :$missing — voir docs/mise-en-ligne.md." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::Déploiement de l'API ignoré (mise en ligne non configurée) :$missing"
            fi
            exit 0
          fi
          # Règle des noms de base (lot R1, la même que apps/api/src/config.ts, qui refuse aussi de démarrer) : on la vérifie dès ici, avant de construire.
          dbname="$(printf '%s' "$db" | sed -E 's#^[a-z]+://##; s#[/:?].*$##; s#\..*$##' | tr '[:upper:]' '[:lower:]')"
          if [ "$TARGET" = recette ]; then
            case "$dbname" in *recette*) ;; *) echo "::error title=Base de recette mal branchée::RECETTE_TURSO_DATABASE_URL vise « $dbname », dont le nom ne contient pas « recette ». Voir docs/plateforme/recette.md, étape 1."; exit 1 ;; esac
            if [ -n "$PROD_DB" ] && [ "$RECETTE_DB" = "$PROD_DB" ]; then echo "::error::RECETTE_TURSO_DATABASE_URL est la base de production"; exit 1; fi
          else
            case "$dbname" in *recette*) echo "::error title=Base de production mal branchée::TURSO_DATABASE_URL vise « $dbname », une base de recette."; exit 1 ;; esac
          fi
          # Une valeur mal copiée donne plus tard une erreur obscure de Google (« Invalid value for "audience" ») : on la repère ici.
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            if ! printf '%s' "$WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9._-]+/providers/[A-Za-z0-9._-]+$'; then
              echo "::error title=Secret GCP_WORKLOAD_IDENTITY_PROVIDER mal formé::Attendu : projects/<NUMÉRO du projet, 12 chiffres, pas son identifiant>/locations/global/workloadIdentityPools/github/providers/github-repo — sans espace, retour à la ligne, guillemets, ni « //iam.googleapis.com/ » devant. Voir docs/mise-en-ligne.md, étape 2.6."
              exit 1
            fi
            if ! printf '%s' "$WIF_SERVICE_ACCOUNT" | grep -Eq '^[A-Za-z0-9._-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$'; then
              echo "::error title=Secret GCP_SERVICE_ACCOUNT mal formé::Attendu : cdj-deploy@<identifiant du projet>.iam.gserviceaccount.com — sans espace ni guillemets. Voir docs/mise-en-ligne.md, étape 2.6."
              exit 1
            fi
          fi
          region="${GCP_REGION:-europe-west1}"
          # Lot R4 : les origines permises de la cible (scripts/domaine.mjs : son adresse ; lot R5 : plus l'ancienne origine GitHub Pages), plus
          # celles des variables du dépôt et, pour une révision de recette, l'origine du canal d'aperçu de sa PR. La production refuse la recette
          # et tout aperçu (le script s'arrête en erreur).
          if [ "$TARGET" = recette ]; then
            service="${RECETTE_SERVICE:-cdj-api-recette}"
            repo="${RECETTE_AR_REPO:-cdj-recette}"
            runtime_sa="${RECETTE_RUNTIME_SA:-cdj-recette-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com}"
            extra="${RECETTE_ORIGINS};${EXTRA_ORIGINS}"
            trust="$RECETTE_TRUST_PROXY"
          else
            service="${PROD_SERVICE:-cdj-api}"
            repo="${PROD_AR_REPO:-cdj}"
            runtime_sa="${PROD_RUNTIME_SA:-cdj-api-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com}"
            extra="${PROD_ORIGINS};${EXTRA_ORIGINS}"
            trust="$PROD_TRUST_PROXY"
          fi
          origins="$(node scripts/domaine.mjs origines "$TARGET" --en-plus "$extra")"
          case "$trust" in [0-5]) ;; *) echo "::error::TRUST_PROXY / RECETTE_TRUST_PROXY : un nombre de proxys de 0 à 5, reçu « $trust »"; exit 1 ;; esac
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -Eq '^b-[a-z0-9-]{1,22}$'; then echo "::error::étiquette invalide : « $TAG » (scripts/recette.mjs)"; exit 1; fi
          sha="$(git rev-parse HEAD)"
          # Lot N1 : l'étiquette de la mise en production (affichée par le tableau de bord du panneau) et l'identifiant client Google : des formes strictes, ou rien.
          release_tag=""
          if [ -n "$ETIQUETTE" ]; then
            printf '%s' "$ETIQUETTE" | grep -Eq '^prod-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$' || { echo "::error::étiquette de mise en production invalide : « $ETIQUETTE »"; exit 1; }
            release_tag="$ETIQUETTE"
          fi
          client_id=""
          if [ -n "$ADMIN_CLIENT_ID" ]; then
            printf '%s' "$ADMIN_CLIENT_ID" | grep -Eq '^[A-Za-z0-9._-]{8,120}\.apps\.googleusercontent\.com$' || { echo "::error::ADMIN_GOOGLE_CLIENT_ID : un identifiant client Google (…apps.googleusercontent.com) attendu (docs/plateforme/admin.md, étape 2)"; exit 1; }
            client_id="$ADMIN_CLIENT_ID"
          fi
          # Une image avec des jours figés ajoutés n'est plus exactement le commit : son nom le dit (retour arrière : l'étiquette prod-… le note).
          image_tag="$sha"; [ -z "$JOURS_FIGES" ] || image_tag="${sha}-f${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "enabled=true"
            echo "region=$region"
            echo "service=$service"
            echo "db=$db"
            echo "image=${region}-docker.pkg.dev/${GCP_PROJECT_ID}/${repo}/api:${image_tag}"
            echo "runtime_sa=$runtime_sa"
            echo "origins=$origins"
            echo "trust=$trust"
            echo "sha=$sha"
            echo "release_tag=$release_tag"
            echo "client_id=$client_id"
          } >> "$GITHUB_OUTPUT"
          echo "Origines permises ($TARGET) : $origins · TRUST_PROXY=$trust" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.enabled == 'true' && inputs.jours_figes != ''
        with:
          name: ${{ inputs.jours_figes }}
          path: ${{ runner.temp }}/jours-figes

      # Lot R4 : les jours figés avec le code en production (production.yml) entrent dans l'image (le serveur les lit : apps/jump/public/levels).
      - name: Jours figés de la mise en production
        if: steps.cfg.outputs.enabled == 'true' && inputs.jours_figes != ''
        run: node scripts/mise-en-production.mjs jours-figes "$RUNNER_TEMP/jours-figes" apps/jump/public/levels | tee -a "$GITHUB_STEP_SUMMARY"

      # Lot R11 : le registre des jours de Track (la version du générateur de chaque jour servi), écrit avec le code en production, entre dans l'image : le serveur le lit par `generatorVersionOf`.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.cfg.outputs.enabled == 'true' && inputs.registre_track != ''
        with:
          name: ${{ inputs.registre_track }}
          path: ${{ runner.temp }}/registre-track
      - name: Registre des jours de Track
        if: steps.cfg.outputs.enabled == 'true' && inputs.registre_track != ''
        run: node scripts/mise-en-production.mjs registre-fusion packages/sim/src/jours-track.json "$RUNNER_TEMP/registre-track/jours-track.json" --resume "$GITHUB_STEP_SUMMARY"
      # Lot R11 : la validation de Nathan a pu durer. Un jour que cette mise en production régénère (aucun résultat à la lecture du garde-fou) ne doit pas en avoir reçu depuis (lecture seule).
      - name: Les jours sans résultat n'en ont toujours pas
        if: ${{ steps.cfg.outputs.enabled == 'true' && inputs.registre_track != '' && inputs.bascule_le != '' }}
        run: node scripts/mise-en-production.mjs proteges-verifier "$RUNNER_TEMP/registre-track/proteges.json"

      - name: Authentification Google Cloud (fédération d'identité)
        if: steps.cfg.outputs.enabled == 'true' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authentification Google Cloud (clé JSON)
        if: steps.cfg.outputs.enabled == 'true' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Outils Google Cloud
        if: steps.cfg.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # Lot N1 : les deux secrets du panneau d'administration sont facultatifs. Absents (avant les étapes manuelles de docs/plateforme/admin.md), le déploiement ne les demande
      # pas — Cloud Run refuserait de déployer une référence à un secret qui n'existe pas — et le panneau n'existe pas (404). Présents, ils sont montés comme variables.
      # Un refus de permission (autre chose que « introuvable ») est signalé : le compte de déploiement doit pouvoir lire l'EXISTENCE du secret (pas sa valeur).
      - name: Secrets du panneau d'administration
        id: admin
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          if [ "$TARGET" = recette ]; then prefix=cdj-recette; else prefix=cdj; fi
          lignes=""; virgules=""; manque=""; refuse=""
          for paire in "ADMIN_EMAILS:${prefix}-admin-emails" "ADMIN_SESSION_KEY:${prefix}-admin-session-key"; do
            variable="${paire%%:*}"; nom="${paire#*:}"
            if erreur="$(gcloud secrets describe "$nom" --format='value(name)' 2>&1 >/dev/null)"; then
              lignes="${lignes}${variable}=${nom}:latest"$'\n'
              virgules="${virgules},${variable}=${nom}:latest"
            elif printf '%s' "$erreur" | grep -Eqi 'not.?found|NOT_FOUND'; then
              manque="$manque $nom"
            else
              refuse="$refuse $nom"
            fi
          done
          {
            echo "lignes<<FIN_DES_SECRETS"
            printf '%s' "$lignes"
            echo "FIN_DES_SECRETS"
            echo "virgules=$virgules"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$manque$refuse" ]; then
            echo "- Panneau d'administration : désactivé (secret(s) absent(s) :${manque}${refuse}) — voir docs/plateforme/admin.md." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Panneau d'administration désactivé::secret(s) absent(s) :${manque}${refuse} (docs/plateforme/admin.md)"
          else
            echo "- Panneau d'administration : secrets montés." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$refuse" ]; then echo "::warning title=Secrets d'administration illisibles::le compte de déploiement n'a pas pu vérifier :${refuse} (permission refusée ?) : le panneau reste désactivé"; fi

      - name: Construire et pousser l'image
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          gcloud auth configure-docker "${{ steps.cfg.outputs.region }}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "${{ steps.cfg.outputs.image }}" .
          docker push "${{ steps.cfg.outputs.image }}"

      # --- Production : exactement le déploiement d'avant le lot R1, plus ENVIRONMENT=production (config.ts : jamais une base « recette »).
      - name: Déployer sur Cloud Run (production)
        id: deploy
        if: steps.cfg.outputs.enabled == 'true' && inputs.target == 'production'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ steps.cfg.outputs.service }}
          region: ${{ steps.cfg.outputs.region }}
          image: ${{ steps.cfg.outputs.image }}
          # Aucune valeur secrète ici : l'adresse de la base et les origines ne sont pas des secrets.
          env_vars: |
            ENVIRONMENT=production
            TURSO_DATABASE_URL=${{ steps.cfg.outputs.db }}
            ALLOWED_ORIGINS=${{ steps.cfg.outputs.origins }}
            TRUST_PROXY=${{ steps.cfg.outputs.trust }}
            GIT_SHA=${{ steps.cfg.outputs.sha }}
            RELEASE_TAG=${{ steps.cfg.outputs.release_tag }}
            ADMIN_GOOGLE_CLIENT_ID=${{ steps.cfg.outputs.client_id }}
          # Secrets : Secret Manager → variables d'environnement du conteneur (jamais dans la configuration en clair, ni dans les journaux).
          # Lot N1 : plus, s'ils existent, les deux secrets du panneau d'administration (étape « Secrets du panneau d'administration »).
          secrets: |
            TURSO_AUTH_TOKEN=cdj-turso-token:latest
            ADMIN_TOKEN=cdj-admin-token:latest
            RATE_SALT=cdj-rate-salt:latest
            ${{ steps.admin.outputs.lignes }}
          # Bornes du coût : 2 instances au plus, 0 au repos (aucun coût sans joueurs). Une instance : 1 vCPU (le calcul est la ressource
          # qui compte : un rejeu fait 20–40 ms de calcul) et 512 Mo (mesuré dans l'image : 16 Mo au repos, 43 Mo après la génération d'un
          # circuit et deux rejeux ; le gratuit compte les Go-secondes à part et ne limite pas ici, donc la marge est gratuite). 40 requêtes
          # à la fois : Node n'a qu'un fil, au-delà elles feraient la queue derrière un rejeu sans rien gagner et la deuxième instance prend
          # le relais ; une requête ne dure jamais 30 s.
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=40
            --timeout=30
            --port=8080
            --service-account=${{ steps.cfg.outputs.runtime_sa }}

      # --- Recette : gcloud directement, pour nommer la révision (`--revision-suffix`) et choisir le trafic.
      #     Avec étiquette : révision SANS trafic, joignable à https://<étiquette>---<hôte du service>. Sans étiquette (fusion dans main) :
      #     la nouvelle révision reçoit tout le trafic de recette ; les révisions étiquetées des PR ouvertes restent joignables.
      #     Bornes : 1 instance au plus, 0 au repos (la recette ne sert qu'aux essais de Nathan).
      - name: Déployer sur Cloud Run (recette)
        id: deploy_recette
        if: steps.cfg.outputs.enabled == 'true' && inputs.target == 'recette'
        env:
          ADMIN_SECRETS: ${{ steps.admin.outputs.virgules }} # lot N1 : « ,ADMIN_EMAILS=…,ADMIN_SESSION_KEY=… » si les secrets du panneau existent, sinon vide
        run: |
          service="${{ steps.cfg.outputs.service }}"
          region="${{ steps.cfg.outputs.region }}"
          suffix="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          envs="ENVIRONMENT=recette,TURSO_DATABASE_URL=${{ steps.cfg.outputs.db }},ALLOWED_ORIGINS=${{ steps.cfg.outputs.origins }},TRUST_PROXY=${{ steps.cfg.outputs.trust }},GIT_SHA=${{ steps.cfg.outputs.sha }}"
          # Lot N1 : l'identifiant client Google du panneau d'administration (public) ; la recette n'a pas d'étiquette de mise en production.
          if [ -n "${{ steps.cfg.outputs.client_id }}" ]; then envs="$envs,ADMIN_GOOGLE_CLIENT_ID=${{ steps.cfg.outputs.client_id }}"; fi
          if [ -n "$SALON_MINUTES_IN" ]; then envs="$envs,SALON_MINUTES=$SALON_MINUTES_IN"; fi
          if [ -n "$TEST_CLOCK_IN" ]; then envs="$envs,TEST_CLOCK_OFFSET_MS=$TEST_CLOCK_IN"; fi
          # Lot R8 : la recette peut essayer « Journée n° 1 » un autre jour que config/lancement.json (variable du dépôt RECETTE_PREMIER_JOUR, AAAA-MM-JJ) ;
          # la production ne reçoit jamais cette variable (le serveur la refuse aussi : apps/api/src/config.ts).
          if [ -n "$RECETTE_PREMIER_JOUR" ]; then
            printf '%s' "$RECETTE_PREMIER_JOUR" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::RECETTE_PREMIER_JOUR : une date AAAA-MM-JJ attendue, reçu « $RECETTE_PREMIER_JOUR »"; exit 1; }
            envs="$envs,LANCEMENT_PREMIER_JOUR=$RECETTE_PREMIER_JOUR"
          fi
          traffic=""
          if [ -n "$TAG" ]; then
            # Une révision sans trafic ne peut pas créer le service : la toute première fois, cette révision devient aussi la recette par
            # défaut (la prochaine fusion dans main la remplace).
            if gcloud run services describe "$service" --region "$region" --format='value(metadata.name)' >/dev/null 2>&1; then
              traffic="--tag=$TAG --no-traffic"
            else
              echo "::notice title=Service de recette créé::« $service » n'existait pas : cette révision reçoit aussi le trafic de recette jusqu'à la prochaine fusion dans main."
              traffic="--tag=$TAG"
            fi
          fi
          # La virgule sépare les variables de --set-env-vars : ALLOWED_ORIGINS utilise des points-virgules (config.ts les accepte).
          # shellcheck disable=SC2086 # $traffic : vide, ou deux options
          gcloud run deploy "$service" --region "$region" --image "${{ steps.cfg.outputs.image }}" --quiet \
            --revision-suffix="$suffix" $traffic \
            --set-env-vars="$envs" \
            --set-secrets="TURSO_AUTH_TOKEN=cdj-recette-turso-token:latest,ADMIN_TOKEN=cdj-recette-admin-token:latest,RATE_SALT=cdj-recette-rate-salt:latest${ADMIN_SECRETS}" \
            --allow-unauthenticated --min-instances=0 --max-instances=1 --cpu=1 --memory=512Mi --concurrency=40 --timeout=30 --port=8080 \
            --service-account="${{ steps.cfg.outputs.runtime_sa }}"
          revision="${service}-${suffix}"
          if [ -z "$TAG" ]; then
            gcloud run services update-traffic "$service" --region "$region" --to-revisions="${revision}=100" --quiet
            url="$(gcloud run services describe "$service" --region "$region" --format='value(status.url)')"
          else
            url="$(gcloud run services describe "$service" --region "$region" --format=json | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag == $t) | .url' | head -n1)"
            [ -n "$url" ] || { echo "::error::adresse de la révision étiquetée « $TAG » introuvable"; exit 1; }
            expected="$(node scripts/recette.mjs url "$(gcloud run services describe "$service" --region "$region" --format='value(status.url)')" "$GITHUB_HEAD_REF")" || expected=""
            [ -z "$GITHUB_HEAD_REF" ] || [ "$url" = "$expected" ] || echo "::warning::adresse de révision inattendue ($url, attendu $expected) : l'aperçu Pages, qui la calcule, ne la trouvera pas"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Adresse
        id: result
        if: steps.cfg.outputs.enabled == 'true'
        run: echo "url=${{ steps.deploy.outputs.url || steps.deploy_recette.outputs.url }}" >> "$GITHUB_OUTPUT"

      - name: Vérifier la santé du service déployé
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          url="${{ steps.result.outputs.url }}"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$url/api/health" | tee health.json
          if [ "$TARGET" = production ]; then
            jq -e '.ok == true and .db == "ok" and .salonOverride == false' health.json
          else
            jq -e '.ok == true and .db == "ok"' health.json
          fi
          {
            if [ "$TARGET" = production ]; then echo "### API déployée (production)"; else echo "### API de recette déployée${TAG:+ (révision $TAG, sans trafic)}"; fi
            echo "- Adresse : $url"
            echo "- Santé : \`$url/api/health\`"
            echo "- Commit : \`$(git rev-parse --short HEAD)\`${JOURS_FIGES:+ + jours figés de la mise en production}"
            [ "$TARGET" = production ] && echo "- Image : \`${{ steps.cfg.outputs.image }}\`"
            [ "$TARGET" = recette ] && [ -z "$TAG" ] && echo "- Révision par défaut de la recette : servie par https://recette.playdujour.com/api/ (lot R4)."
            true
          } >> "$GITHUB_STEP_SUMMARY"

      # Recette : l'essai de bout en bout existant (crée un joueur « Fumée… », jamais contre la vraie base : ici la base de recette).
      # Il exige un Salon de durée normale : avec SALON_MINUTES, il est sauté (et le résumé le dit).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cfg.outputs.enabled == 'true' && inputs.target == 'recette'
        with:
          node-version: 22
          cache: npm
      - name: Essai de bout en bout contre la recette
        if: steps.cfg.outputs.enabled == 'true' && inputs.target == 'recette'
        run: |
          if [ -n "$SALON_MINUTES_IN" ]; then
            echo "- Essai de bout en bout sauté : SALON_MINUTES=$SALON_MINUTES_IN (il vérifie un Salon de durée normale)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm ci -w @cdj/api --ignore-scripts
          # Lot R4 : l'origine de la recette (toujours permise, scripts/domaine.mjs).
          npm run smoke -w @cdj/api -- "${{ steps.result.outputs.url }}" --origin "$(node scripts/domaine.mjs adresse recette)"
          echo "- Essai de bout en bout (\`npm run smoke\`) : réussi." >> "$GITHUB_STEP_SUMMARY"

      # Lot R5 — la faille d'adresse : depuis ce runner (adresse publique), des appels DIRECTS à la révision, chacun avec une adresse inventée
      # différente dans X-Forwarded-For, doivent être refusés (429) au plus tard après 40 × PEER_FACTOR (scripts/sonde-proxy.mjs faille).
      # Révision d'une PR seulement (≈ 400 vérifications de pseudo comptées dans la base de recette, rien d'autre n'est écrit).
      - name: Faille d'adresse fermée (appels directs forgés)
        if: steps.cfg.outputs.enabled == 'true' && inputs.target == 'recette' && inputs.tag != ''
        run: |
          node scripts/sonde-proxy.mjs faille "${{ steps.result.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Lot R5 — la mesure par Firebase (révision par défaut, celle que recette.playdujour.com sert) : ce que le serveur reçoit d'un appel direct
      # et d'un appel par Firebase (hôte, en-têtes, adresses de connexion). Pour information : n'échoue jamais.
      - name: En-têtes reçus, direct et par Firebase (information)
        if: steps.cfg.outputs.enabled == 'true' && inputs.target == 'recette' && inputs.tag == ''
        continue-on-error: true
        run: |
          {
            echo "#### En-têtes reçus par le serveur de recette (lot R5)"
            echo '```json'
            node scripts/sonde-proxy.mjs entetes "${{ steps.result.outputs.url }}" "$(node scripts/domaine.mjs adresse recette)" --essais 20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
