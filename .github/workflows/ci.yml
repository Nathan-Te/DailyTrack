name: CI
# Lot R3 (plateforme) — deux régimes (docs/plateforme/lots/lot-R3-ci.md) :
#   - PR (`pull_request`) : les e2e des jeux touchés (scripts/ci-scope.mjs) sur Chromium, plus le SOUS-ENSEMBLE multi-navigateurs sur Firefox et
#     WebKit (`e2e/multi-navigateurs.json` de chaque jeu : rejeu Node ↔ navigateurs, déterminisme) ; un test de `e2e/quarantaine.json` n'y est
#     qu'un avertissement ;
#   - complet (`push` sur main, chaque fusion ; `workflow_dispatch`) et nuit (`schedule`) : TOUT, sur les trois navigateurs, sans filtre,
#     quarantaine bloquante ; la nuit, un instable ou une dette expirée fait aussi échouer. production.yml exige le run `push` de main vert.
# Un `push` sur une autre branche ne lance plus rien : la PR (brouillon) le fait, une fois (avant : deux runs par commit, `push` et `pull_request`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Garde-fou (retouche 29b) : la suite complète tourne chaque nuit sur `main` (03 h 17 UTC : loin d'un changement de jour, jamais sur
  # une heure pleine très chargée) ; à ce run, un test instable fait échouer le job pour qu'une instabilité qui revient se voie.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Lot R3 : les tests unitaires (toujours TOUS : rapides, ils protègent les imports croisés) en trois parts parallèles (`vitest --shard`), chacune
  # SQLite puis libSQL comme `npm test` (l'un après l'autre : le test de durée de génération se ferait voler le processeur) ; la part 1 fait
  # aussi le typecheck et la construction. Mesuré : `npm test` seul prenait 5 min 21 s du job `test` (run 39318954261), le chemin le plus long
  # d'une PR DailyJump.
  unit:
    name: unit (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.part == '1/3'
      # Lot R4 : le portail (apps/portail, hors des espaces de travail npm : il n'est pas dans `tsc -b`).
      - run: npx tsc -p apps/portail
        if: matrix.part == '1/3'
      - run: npx vitest run --project sqlite --shard=${{ matrix.part }} && npx vitest run --project libsql --shard=${{ matrix.part }}
      - run: npm run build
        if: matrix.part == '1/3'

  # Verdict des tests unitaires : le statut requis `test` (protection de main) ; il tourne toujours et échoue si une part a échoué.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.unit.result }}" = success ] || { echo "::error::une part des tests unitaires a échoué (jobs unit)"; exit 1; }

  # Lot R2 (plateforme) — portée de la PR : quels fichiers sont changés, donc quelles suites e2e et quelle image ont un sens. Typecheck et tests
  # unitaires (`test`) tournent TOUJOURS en entier (rapides, et ils protègent les imports croisés). Les e2e ne tournent que pour les jeux touchés,
  # `api-image` que si le serveur l'est. Une zone partagée ou un doute = tout (scripts/ci-scope.mjs, testé). Le run de nuit, un lancement manuel
  # et `main` ne filtrent rien. Un échec de ce job fait échouer `e2e` (jamais de « saut » par erreur). Règles : docs/plateforme/lots/lot-R2-hygiene.md.
  scope:
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.scope.outputs.track }}
      jump: ${{ steps.scope.outputs.jump }}
      server: ${{ steps.scope.outputs.server }}
      full: ${{ steps.scope.outputs.full }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Portée des fichiers changés
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=""
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$REF" = refs/heads/main ]; then full="--full"; fi
          # Lot R3 — « à la demande » depuis une PR : un commit dont le message contient « [ci complet] » lance la CI complète (trois
          # navigateurs, sans filtre, quarantaine bloquante). Pour un agent (« Run workflow » lui est refusé : 403) et avant une fusion délicate.
          if [ -z "$full" ] && [ -n "$HEAD_SHA" ] && git log -1 --format=%B "$HEAD_SHA" 2>/dev/null | grep -qF "[ci complet]"; then full="--full"; echo "commit « [ci complet] » : CI complète demandée"; fi
          # Lot R3 : pr (filtré, Chromium + sous-ensemble multi-navigateurs, quarantaine non bloquante) | complet (main, à la demande) | nuit.
          mode=pr; [ -n "$full" ] && mode=complet; [ "$EVENT" = schedule ] && mode=nuit
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/files.txt"
          if [ -z "$full" ]; then
            git fetch --no-tags origin "$BASE" || full="--full"
          fi
          if [ -z "$full" ]; then
            git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/files.txt" || full="--full"
          fi
          node scripts/ci-scope.mjs $full < "$RUNNER_TEMP/files.txt" | tee -a "$GITHUB_OUTPUT" > "$RUNNER_TEMP/scope.txt"
          {
            echo "### Portée de la CI"
            echo
            echo "Événement : \`$EVENT\` — mode \`$mode\` ${full:+(lancement complet : aucun filtre, trois navigateurs)}"
            echo
            echo '```'; cat "$RUNNER_TEMP/scope.txt"; echo '```'
            echo "Fichiers changés : $(wc -l < "$RUNNER_TEMP/files.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

  # Même rediffusion rejouée dans Chromium, Firefox et WebKit : le résultat doit être identique à celui de Node.
  # Retouche 29b — CI rapide et fiable : une matrice (un job par navigateur et par part, `--shard`), une relance unique (`retries: 1`, voir
  # apps/web/playwright.config.ts) et un job `e2e` qui fusionne les rapports, NOMME les tests instables dans le résumé du run et donne le verdict.
  # `e2e-parts` ne sert qu'à répartir le travail ; la protection de branche exige `test` et `e2e` (docs/lots/lot-29b-ci-fiable.md).
  # Lot 3c — DailyJump suit les mêmes règles : ses specs (apps/jump/e2e) sont des parts de la même matrice (`suite: jump`, un projet Playwright
  # `jump-<navigateur>`), avec la même relance (`retries: 1` en CI), des rapports « blob » fusionnés dans le même rapport et le même verdict `e2e`.
  # (Ne pas écrire `browser: chromium, shard: …` pour une entrée jump : apps/web/test/e2eParts.test.ts lit le nombre de parts DailyTrack ci-dessous.)
  e2e-parts:
    needs: scope
    name: e2e-parts (${{ matrix.suite == 'jump' && 'jump ' || '' }}${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: "1/8" }
          - { browser: chromium, shard: "2/8" }
          - { browser: chromium, shard: "3/8" }
          - { browser: chromium, shard: "4/8" }
          - { browser: chromium, shard: "5/8" }
          - { browser: chromium, shard: "6/8" }
          - { browser: chromium, shard: "7/8" }
          - { browser: chromium, shard: "8/8" }
          - { browser: firefox, shard: "1/2" }
          - { browser: firefox, shard: "2/2" }
          - { browser: webkit, shard: "1/2" }
          - { browser: webkit, shard: "2/2" }
          # Lot R3 : trois parts Chromium pour DailyJump (deux avant : 3 min 31 s pour la plus longue, run 39316002232).
          - { suite: jump, shard: "1/3", browser: chromium }
          - { suite: jump, shard: "2/3", browser: chromium }
          - { suite: jump, shard: "3/3", browser: chromium }
          - { suite: jump, shard: "1/1", browser: firefox }
          - { suite: jump, shard: "1/1", browser: webkit }
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      # Lot R2 : la matrice reste fixe (apps/web/test/e2eParts.test.ts et apps/jump/test/ciE2e.test.ts la lisent) ; une part dont le jeu n'est pas
      # touché ne fait QUE cette étape et réussit (chaque étape suivante est conditionnée par elle) : le verdict `e2e` voit « réussi », jamais un trou.
      # Lot R3 : sur une PR, Firefox et WebKit ne lancent que le sous-ensemble multi-navigateurs du jeu (`multi=true`), sur leur première part ;
      # leurs autres parts réussissent sans rien faire. En mode complet ou nuit, chaque part lance sa tranche de tout (`--shard`).
      - name: Cette part est-elle concernée ?
        id: gate
        env:
          TOUCHED: ${{ matrix.suite == 'jump' && needs.scope.outputs.jump || needs.scope.outputs.track }}
          MODE: ${{ needs.scope.outputs.mode }}
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          GAME: ${{ matrix.suite == 'jump' && 'DailyJump' || 'DailyTrack' }}
        run: |
          run=false; multi=false; why=""
          if [ "$TOUCHED" != true ]; then why="le jeu ($GAME) n'est pas touché par cette PR (portée : job scope)"
          elif [ "$BROWSER" = chromium ] || [ "$MODE" != pr ]; then run=true
          elif [ "${SHARD%%/*}" = 1 ]; then run=true; multi=true
          else why="PR : $BROWSER ne lance que le sous-ensemble multi-navigateurs de $GAME, sur sa part 1 (tout tourne sur main, la nuit et à la demande)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "multi=$multi" >> "$GITHUB_OUTPUT"
          [ -z "$why" ] || echo "part sautée : $why" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$multi" = false ] || echo "PR : $BROWSER lance le sous-ensemble multi-navigateurs de $GAME (e2e/multi-navigateurs.json)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
        if: steps.gate.outputs.run == 'true' && steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps ${{ matrix.browser }}
        working-directory: apps/web
        if: steps.gate.outputs.run == 'true' && steps.browsers.outputs.cache-hit == 'true'
      - run: npm run build && npm run build:node -w @cdj/api
        if: steps.gate.outputs.run == 'true' && matrix.suite != 'jump'
      - run: npm run build -w @cdj/jump
        if: steps.gate.outputs.run == 'true' && matrix.suite == 'jump'
      - name: Nom de la part
        if: steps.gate.outputs.run == 'true'
        run: |
          blob="$(echo '${{ matrix.suite == 'jump' && 'jump-' || '' }}${{ matrix.browser }}-${{ matrix.shard }}' | sed 's#/#sur#')"
          echo "blob=$blob" >> "$GITHUB_ENV"
          echo "E2E_BLOB_NAME=report-$blob.zip" >> "$GITHUB_ENV"
      # Chromium (retouche 31b) : parts composées par DURÉE (scripts/e2e-parts.mjs, apps/web/e2e/durees.json) et UN test à la fois.
      # Le runner a 2 cœurs : deux pages en WebGL logiciel côte à côte s'y affament (miniatures + spectateur : × 3 à × 6 sur les durées),
      # et `--shard` (coupe au nombre de tests) changeait de voisins à chaque spec ajouté. Firefox et WebKit (rapides, sans WebGL lourd) gardent `--shard`.
      - name: Tests e2e (${{ matrix.browser }}, part ${{ matrix.shard }})
        if: steps.gate.outputs.run == 'true' && matrix.suite != 'jump'
        run: |
          if [ "${{ matrix.browser }}" = chromium ]; then
            node scripts/e2e-parts.mjs ${{ matrix.shard }} chromium > "$RUNNER_TEMP/part.txt"
            npm run e2e -w @cdj/web -- --project=chromium --workers=1 --test-list "$RUNNER_TEMP/part.txt"
          elif [ "${{ steps.gate.outputs.multi }}" = true ]; then
            node scripts/e2e-parts.mjs multi ${{ matrix.browser }} > "$RUNNER_TEMP/part.txt"
            npm run e2e -w @cdj/web -- --project=${{ matrix.browser }} --test-list "$RUNNER_TEMP/part.txt"
          else
            npm run e2e -w @cdj/web -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
          fi
      # DailyJump (lot 3c) : mêmes règles que DailyTrack. Chromium : parts composées par durée (apps/jump/e2e/durees.json) et un test à la fois
      # (même runner à 2 cœurs, même rendu logiciel) ; Firefox et WebKit : `--shard`. Les outils de mesure et de captures (MESURE, CAPTURES) se
      # sautent d'eux-mêmes avec leur motif (« outil de mesure : MESURE=1 ») : ni l'un ni l'autre n'est défini ici.
      - name: Tests e2e DailyJump (${{ matrix.browser }}, part ${{ matrix.shard }})
        if: steps.gate.outputs.run == 'true' && matrix.suite == 'jump'
        run: |
          if [ "${{ matrix.browser }}" = chromium ]; then
            node scripts/e2e-parts.mjs ${{ matrix.shard }} jump-chromium > "$RUNNER_TEMP/part.txt"
            npm run e2e -w @cdj/jump -- --project=jump-chromium --workers=1 --test-list "$RUNNER_TEMP/part.txt"
          elif [ "${{ steps.gate.outputs.multi }}" = true ]; then
            node scripts/e2e-parts.mjs multi jump-${{ matrix.browser }} > "$RUNNER_TEMP/part.txt"
            npm run e2e -w @cdj/jump -- --project=jump-${{ matrix.browser }} --test-list "$RUNNER_TEMP/part.txt"
          else
            npm run e2e -w @cdj/jump -- --project=jump-${{ matrix.browser }} --shard=${{ matrix.shard }}
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: blob-${{ env.blob }}
          path: ${{ matrix.suite == 'jump' && 'apps/jump' || 'apps/web' }}/blob-report/
          retention-days: 7
          if-no-files-found: warn
      # Traces des essais ratés (même ceux d'un test réussi à la relance) : de quoi trouver la cause d'une instabilité.
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: resultats-${{ env.blob }}
          path: ${{ matrix.suite == 'jump' && 'apps/jump' || 'apps/web' }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Verdict unique (statut `e2e`) : fusionne les rapports des parts, écrit le résumé (instables nommés) et échoue au moindre vrai échec.
  # Lot R2 : ce job tourne TOUJOURS (`if: always()`), même si toutes les parts sont sautées : c'est lui qui porte le statut requis `e2e`, il n'est donc
  # jamais « sauté » ni en attente. Sans suite concernée (PR de documentation de la plateforme…), il le dit dans le résumé et réussit ; si `scope` a
  # échoué il échoue (on ne sait pas ce qui devait tourner).
  e2e:
    needs: [scope, e2e-parts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Portée connue ?
        run: |
          [ "${{ needs.scope.result }}" = success ] || { echo "::error::le job scope a échoué : on ne sait pas quelles suites devaient tourner"; exit 1; }
      - name: Aucune suite e2e concernée
        if: needs.scope.outputs.track != 'true' && needs.scope.outputs.jump != 'true'
        run: |
          echo "### e2e : aucune suite concernée par cette PR (ni DailyTrack ni DailyJump touchés) — verdict vert, rien à fusionner" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true'
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true'
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true'
        with:
          pattern: blob-*
          path: apps/web/all-blobs
          merge-multiple: true
      - name: Fusionner les rapports
        if: needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true'
        working-directory: apps/web
        run: |
          mkdir -p merged
          if ls all-blobs/*.zip >/dev/null 2>&1; then
            # --config : les rapports de DailyTrack et de DailyJump viennent de dossiers de tests différents (lot 3c, scripts/e2e-merge.config.mjs).
            # Chemins ABSOLUS : avec --config, Playwright range les sorties relativement au dossier de la configuration, pas du dossier courant.
            PLAYWRIGHT_JSON_OUTPUT_NAME="$PWD/merged/report.json" PLAYWRIGHT_HTML_OUTPUT_DIR="$PWD/playwright-report" npx playwright merge-reports --config ../../scripts/e2e-merge.config.mjs --reporter=json,html all-blobs
            ls merged
          else
            echo "aucun rapport de part : les jobs e2e-parts ont échoué avant les tests" >&2
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true')
        with:
          name: rapport-e2e
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Résumé du run
        if: needs.scope.outputs.track == 'true' || needs.scope.outputs.jump == 'true'
        run: |
          if [ ! -f apps/web/merged/report.json ]; then
            echo "### e2e : aucun rapport, les jobs de part ont échoué avant les tests" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Mode (lot R3) : `pr` — un test de e2e/quarantaine.json n'est qu'un avertissement ; `complet` (main, à la demande) — tout est bloquant ;
          # `nuit` — tout est bloquant, un instable aussi (c'est le but : voir une instabilité qui revient), une dette de plus de 14 jours aussi.
          # Une quarantaine qui ne respecte pas ses garde-fous fait échouer le run, quel que soit le mode.
          set +e
          node scripts/e2e-summary.mjs apps/web/merged/report.json --mode "${{ needs.scope.outputs.mode }}" --quarantaine e2e/quarantaine.json > summary.md
          code=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          [ "${{ needs.e2e-parts.result }}" = "success" ] || [ $code -ne 0 ] || { echo "::error::une part e2e a échoué sans test en échec (installation, construction, délai dépassé…) : voir le job"; code=1; }
          exit $code

  # Lot 28 : l'image Docker de l'API (celle de Cloud Run) démarre contre un vrai serveur libSQL (le protocole de Turso), répond à /api/health,
  # sert un temps du jour et du Salon rejoués par le serveur, et refuse de démarrer avec SALON_MINUTES.
  api-image:
    # Lot R2 : seulement si le serveur est touché (scripts/ci-scope.mjs : SERVER_PATHS, zone partagée ou doute). Non requis : sauté = sans effet.
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      libsql:
        # sqld, le serveur de Turso (épinglé par son empreinte ; à renouveler de temps en temps).
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w @cdj/api --ignore-scripts
      - name: Construire l'image
        run: docker build -f apps/api/Dockerfile -t cdj-api .
      - name: Démarrage refusé avec SALON_MINUTES (production)
        run: |
          set +e
          docker run --rm -e SALON_MINUTES=2 -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "attendu : sortie 1, obtenu $code"; exit 1; }
      # Lot R1 (plateforme) : la même image en recette. Elle refuse une base dont le nom ne contient pas « recette » (et la production refuse
      # une base de recette) ; en recette, l'horloge de test est permise, et l'essai de bout en bout passe (`recette.local` → le même sqld).
      - name: Recette — démarrage refusé sur une base sans « recette », production refusée sur une base de recette
        run: |
          set +e
          docker run --rm -e ENVIRONMENT=recette -e TURSO_DATABASE_URL=libsql://dailytrack-misterzcool.turso.io -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "recette sur la base de production : attendu sortie 1, obtenu $code"; exit 1; }
          docker run --rm -e TURSO_DATABASE_URL=libsql://dailytrack-recette-misterzcool.turso.io -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "production sur la base de recette : attendu sortie 1, obtenu $code"; exit 1; }
      - name: Recette — l'image démarre avec l'horloge de test et passe l'essai de bout en bout
        run: |
          # `recette.local` = l'hôte du runner (où sqld est publié sur 8081) : le nom de la base vue par config.ts est « recette ».
          docker run -d --name cdj-recette -p 8091:8091 --add-host recette.local:host-gateway -e PORT=8091 -e ENVIRONMENT=recette \
            -e TURSO_DATABASE_URL=http://recette.local:8081 -e TEST_CLOCK_OFFSET_MS=0 \
            -e ALLOWED_ORIGINS=https://playdujour.com -e RATE_SALT=un-sel-de-test-assez-long -e TRUST_PROXY=1 cdj-api
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8091/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8091/api/health | jq -e '.ok == true and .db == "ok"'
          npm run smoke -w @cdj/api -- http://127.0.0.1:8091 --origin https://playdujour.com
          docker logs cdj-recette
          docker rm -f cdj-recette
      - name: Démarrer l'image contre libSQL
        run: |
          docker run -d --name cdj --network host -e PORT=8090 -e TURSO_DATABASE_URL=http://127.0.0.1:8081 \
            -e ALLOWED_ORIGINS=https://playdujour.com -e RATE_SALT=un-sel-de-test-assez-long -e TRUST_PROXY=1 cdj-api
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8090/api/health | jq -e '.ok == true and .db == "ok" and .salonOverride == false'
      - name: Essai de bout en bout (temps du jour, Salon, DailyJump)
        run: npm run smoke -w @cdj/api -- http://127.0.0.1:8090 --origin https://playdujour.com
      # Lot P0 (plateforme) : l'image contient jump-sim et les jours figés ; `/api/jump/info` les liste tous, et chaque jour figé est servi depuis
      # son fichier (preuve rejouée) avec l'identifiant, l'empreinte et le temps de l'auteur du fichier du dépôt.
      - name: DailyJump — /api/jump/info et chaque jour figé servi avec l'empreinte de son fichier
        run: |
          info=$(curl -sf http://127.0.0.1:8090/api/jump/info)
          echo "$info"
          expected=$(ls apps/jump/public/levels/*.json | sed -E 's#.*/([0-9-]+)\.json#\1#' | sort | jq -R . | jq -cs .)
          echo "$info" | jq -e --argjson days "$expected" '.frozenDays == $days and (.frozenDays | length) > 0' > /dev/null || { echo "jours figés attendus : $expected"; exit 1; }
          for f in apps/jump/public/levels/*.json; do
            d=$(basename "$f" .json)
            got=$(curl -sf "http://127.0.0.1:8090/api/jump/day/$d")
            echo "$d → $got"
            jq -e --argjson g "$got" '$g.source == "fige" and $g.id == .id and $g.hash == .hash and $g.authorTicks == .auteur' "$f" > /dev/null || { echo "$d : réponse différente du fichier figé"; exit 1; }
          done
      - name: Journaux du conteneur
        if: always()
        run: docker logs cdj
