name: CI
# Lot R10 (plateforme) — une CI de PR COURTE ; la vérification complète est celle de `main` et du lot de mise en production
# (docs/plateforme/lots/lot-R10-ci-sobre.md, docs/orchestration.md « Préparer une mise en production »).
#   - PR (`pull_request`, mode `pr`, à chaque poussée ; c'est elle qui permet la fusion) : typecheck, construction, les tests unitaires des ZONES TOUCHÉES
#     (graphe des imports, scripts/ci-zones.mjs) et les specs e2e liés aux fichiers modifiés (table spec → zones, e2e/zones.json), Chromium seulement, quatre
#     parts au plus ; une modification qui ne touche que `docs/**` ou des `*.md` ne lance rien de lourd (sauf les tests qui lisent ces documents). Plus
#     d'étiquette `[ci complet]` : la vérification complète se lance à la main (« Run workflow ») ou se lit sur `main`.
#   - complet (`push` sur main, `workflow_dispatch`) et nuit (`schedule`) : TOUT, sur les trois navigateurs, sans filtre, quarantaine bloquante ; la
#     nuit, un instable ou une dette expirée fait aussi échouer. Sur main il est INFORMATIF pour les lots en cours (un rouge ne les bloque pas : ils ne
#     voient que leurs zones) ; production.yml exige le run `push` de main vert, et le lot de mise en production répare ce qui est rouge.
# Un `push` sur une autre branche ne lance rien : la PR (brouillon) le fait. Les statuts requis de `main` restent `test` et `e2e` (mêmes noms) : ils
# tournent toujours, même pour une PR de documentation (c'est pourquoi pas de `paths-ignore` ici : un statut requis qui ne s'est pas rapporté bloque la fusion).
# Lot R12 — « Mettre en production » APPELLE ce workflow (`workflow_call`, mode `complet`, sur le commit qu'il va déployer : entrée `ref`) : ses jobs
# s'appellent alors « ci / … » et ne reçoivent AUCUN secret, aucun environnement, aucune fédération Google (production.yml ne leur en passe pas). La sortie
# `echecs` (les tests e2e rouges) va dans le résumé du bouton. « Run workflow » à la main garde le mode `complet` ; le mode `pr` (les zones touchées par
# rapport à `main`, comme une PR) ne sert qu'au commit des jours figés que le bouton verse dans `main` (production.yml, job `depot`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "complet (tout : unitaires, Essentiel et Régression, Firefox et WebKit) ou pr (les zones touchées par rapport à main, comme une PR)"
        type: choice
        options: [complet, pr]
        default: complet
  workflow_call:
    inputs:
      mode:
        description: "complet (le seul mode du bouton « Mettre en production »)"
        type: string
        default: complet
      ref:
        description: "le commit à tester (celui que le bouton va déployer)"
        type: string
        default: ""
    outputs:
      echecs:
        description: "les tests e2e rouges (JSON : « fichier › titre »)"
        value: ${{ jobs.e2e.outputs.echecs }}
  # Garde-fou (retouche 29b) : la suite complète tourne chaque nuit sur `main` (03 h 17 UTC : loin d'un changement de jour, jamais sur
  # une heure pleine très chargée) ; à ce run, un test instable fait échouer le job pour qu'une instabilité qui revient se voie.
  schedule:
    - cron: "17 3 * * *"

# Lot R7 (audit de sécurité) : la CI ne fait que lire le dépôt (résumés, artefacts et cache n'ont pas besoin d'autre droit) ; sans ce bloc, elle
# recevrait les droits par défaut du dépôt (écriture possible).
permissions:
  contents: read

# Lot R10 : une nouvelle poussée annule le run de la précédente (jamais sur main : chaque fusion garde sa CI complète). Lot R12 : jamais la CI appelée
# par « Mettre en production » (`github.workflow` est alors celui du bouton : un autre groupe, rien ne l'annule).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.workflow == 'CI' }}

jobs:
  # Lot R10 : les tests unitaires des ZONES TOUCHÉES (scripts/ci-zones.mjs : le graphe des imports, comme `vitest related`), répartis en parts de DURÉE
  # égale (scripts/unit-durees.json ; avant, `vitest --shard` coupait au nombre de fichiers : 143 s, 308 s et 356 s). Chaque part lance SQLite, puis libSQL
  # pour les fichiers de `apps/api/test` (comme `npm test` : l'un après l'autre, le test de durée de génération se ferait voler le processeur). La part
  # `verif` fait aussi le typecheck, le portail et la construction ; sans test à lancer elle ne fait que cela. Docs seuls : aucun job. Complet / nuit : tout.
  unit:
    needs: scope
    if: needs.scope.outputs.unit_actif == 'true'
    name: unit (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.unit_matrice) }}
    env:
      FICHIERS: ${{ matrix.fichiers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.verif
      # Lot R4 : le portail (apps/portail, hors des espaces de travail npm : il n'est pas dans `tsc -b`).
      - run: npx tsc -p apps/portail
        if: matrix.verif
      - name: Tests unitaires (SQLite, puis libSQL pour apps/api)
        if: matrix.fichiers != ''
        run: |
          npx vitest run --project sqlite $FICHIERS
          api=$(printf '%s\n' $FICHIERS | grep '^apps/api/test/' || true)
          if [ -n "$api" ]; then npx vitest run --project libsql --passWithNoTests $api; fi
      - run: npm run build
        if: matrix.verif
        env:
          # Lot R8 : les e2e tournent le 20/10/2026 (horloge maîtrisée) : les archives des jeux commencent au circuit n° 1, pas au lancement public.
          VITE_LANCEMENT_PREMIER_JOUR: "2026-10-13"

  # Verdict des tests unitaires : le statut requis `test` (protection de main) ; il tourne toujours et échoue si une part a échoué.
  # Lot R10 : `unit` est sauté quand il n'y a rien à lancer (docs seuls) : « sauté » est un succès ici, mais jamais si `scope` a échoué.
  # Retouche du lot I6 : il porte aussi le verdict de `zones` (une PR de jeu restée dans ses zones).
  test:
    needs: [scope, unit, zones]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.scope.result }}" = success ] || { echo "::error::le job scope a échoué : on ne sait pas quels tests devaient tourner"; exit 1; }
          case "${{ needs.unit.result }}" in success|skipped) ;; *) echo "::error::une part des tests unitaires a échoué (jobs unit)"; exit 1;; esac
          [ "${{ needs.zones.result }}" = success ] || { echo "::error::une PR de jeu sort de ses zones (job zones, docs/orchestration.md « Lots en parallèle »)"; exit 1; }
          [ "${{ needs.unit.result }}" != skipped ] || echo "### test : aucun test unitaire concerné (docs seuls) — verdict vert" | tee -a "$GITHUB_STEP_SUMMARY"

  # Retouche du lot I6 — « Lots en parallèle » (docs/orchestration.md) : une PR de jeu (étiquette `jeu:track` / `jeu:jump`, ou `track` / `jump`
  # dans le nom de branche) ne change que les fichiers de ses zones ; une zone partagée = un lot de la plateforme (scripts/zones-jeu.mjs, testé).
  # Une PR de la plateforme n'a pas de garde ; hors PR (main, nuit, manuel), rien à garder. L'étiquette est lue à chaque run : posée après le
  # dernier push, elle compte au push suivant.
  zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Zones d'une PR de jeu
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BRANCHE: ${{ github.head_ref }}
          ETIQUETTES: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch --no-tags origin "$BASE"
          git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/fichiers.txt"
          set +e
          node scripts/zones-jeu.mjs --etiquettes "$ETIQUETTES" --branche "$BRANCHE" < "$RUNNER_TEMP/fichiers.txt" > "$RUNNER_TEMP/zones.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/zones.txt"
          { echo "### Zones d'une PR de jeu"; echo; echo '```'; cat "$RUNNER_TEMP/zones.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] || { echo "::error::$(head -1 "$RUNNER_TEMP/zones.txt")"; exit 1; }

  # Lot R10 — la portée : ce que la PR touche décide ce qui tourne. Le mode (`pr` | `complet` | `nuit`) ne dépend plus du message d'un commit. Deux sorties :
  #   - scripts/ci-scope.mjs (lot R2 : jeux touchés, serveur touché → `api-image`) ;
  #   - scripts/ci-zones.mjs (lot R10 : docs seuls, parts de tests unitaires, parts e2e liées aux fichiers modifiés — testé par apps/web/test/ciZones.test.ts).
  # Pas d'installation de dépendances ici : les deux scripts n'utilisent que Node. Un échec de ce job fait échouer `test` et `e2e` (jamais de « saut » par erreur).
  scope:
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.scope.outputs.track }}
      jump: ${{ steps.scope.outputs.jump }}
      server: ${{ steps.scope.outputs.server }}
      full: ${{ steps.scope.outputs.full }}
      mode: ${{ steps.scope.outputs.mode }}
      docs_seuls: ${{ steps.scope.outputs.docs_seuls }}
      unit_actif: ${{ steps.scope.outputs.unit_actif }}
      unit_matrice: ${{ steps.scope.outputs.unit_matrice }}
      e2e_pr_actif: ${{ steps.scope.outputs.e2e_pr_actif }}
      e2e_pr_matrice: ${{ steps.scope.outputs.e2e_pr_matrice }}
      e2e_complet_matrice: ${{ steps.scope.outputs.e2e_complet_matrice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Portée des fichiers changés
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          # Lot R12 : « Run workflow » en mode `pr` (le commit des jours figés) ; le bouton appelle en `complet`.
          MODE_DEMANDE: ${{ inputs.mode }}
        run: |
          full=""
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$REF" = refs/heads/main ]; then full="--full"; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$MODE_DEMANDE" = pr ]; then full=""; fi
          : > "$RUNNER_TEMP/files.txt"
          # Une base introuvable ou une différence illisible = le doute : la CI complète, jamais une CI vide.
          if [ -z "$full" ]; then
            { git fetch --no-tags origin "$BASE" && git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/files.txt"; } || full="--full"
          fi
          # pr (filtré, Chromium, quarantaine non bloquante) | main (chaque fusion : l'Essentiel de tout, lot R13) | complet (« Run workflow ») | nuit.
          mode=pr; [ -n "$full" ] && mode=complet; [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && mode=main; [ "$EVENT" = schedule ] && mode=nuit
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          node scripts/ci-scope.mjs $full < "$RUNNER_TEMP/files.txt" | tee -a "$GITHUB_OUTPUT" > "$RUNNER_TEMP/scope.txt"
          node scripts/ci-zones.mjs --mode "$mode" < "$RUNNER_TEMP/files.txt" >> "$GITHUB_OUTPUT" 2> "$RUNNER_TEMP/zones.txt"
          {
            echo "### Portée de la CI"
            echo
            echo "Événement : \`$EVENT\` — mode \`$mode\` ${full:+(CI complète : main = Essentiel de tous les specs ; complet et nuit = tout ; Firefox et WebKit = petit ensemble)}"
            echo
            echo '```'; cat "$RUNNER_TEMP/zones.txt"; echo; cat "$RUNNER_TEMP/scope.txt"; echo '```'
            echo "Fichiers changés : $(wc -l < "$RUNNER_TEMP/files.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

  # CI COMPLÈTE (main, « Run workflow », nuit) : même rediffusion rejouée dans Chromium, Firefox et WebKit : le résultat doit être identique à celui de Node.
  # Retouche 29b — CI rapide et fiable : une matrice (un job par navigateur et par part, `--shard`), une relance unique (`retries: 1`, voir
  # apps/web/playwright.config.ts) et un job `e2e` qui fusionne les rapports, NOMME les tests instables dans le résumé du run et donne le verdict.
  # `e2e-parts` ne sert qu'à répartir le travail ; la protection de branche exige `test` et `e2e` (docs/lots/lot-29b-ci-fiable.md).
  # Lot 3c — DailyJump suit les mêmes règles : ses specs (apps/jump/e2e) sont des parts de la même matrice (`suite: jump`, un projet Playwright
  # `jump-<navigateur>`), avec la même relance (`retries: 1` en CI), des rapports « blob » fusionnés dans le même rapport et le même verdict `e2e`.
  # (Ne pas écrire `browser: chromium, shard: …` pour une entrée jump : apps/web/test/e2eParts.test.ts lit le nombre de parts DailyTrack ci-dessous.)
  # Lot R10 : cette matrice ne sert plus qu'à la CI complète (une PR a `e2e-pr` ci-dessous) ; coût fixe mesuré d'un job de part : ≈ 35 s (checkout 3, node 3,
  # `npm ci` 8, cache 3, `install-deps` 13, construction 5) — trop peu pour fusionner des parts ou partager une construction (docs/plateforme/lots/lot-R10-ci-sobre.md).
  e2e-parts:
    needs: scope
    if: needs.scope.outputs.mode != 'pr'
    name: e2e-parts (${{ matrix.suite == 'jump' && 'jump ' || '' }}${{ matrix.browser }}${{ matrix.suite == 'navigateurs' && ', petit ensemble' || format(' {0}', matrix.shard) }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Lot R13 (docs/tests.md) : la matrice vient de `scope` (scripts/ci-zones.mjs, `matriceComplete`) — `main` : Chromium en 3 parts et DailyJump en 1, l'Essentiel
      # seulement (`--essentiel`, `--grep-invert @regression`) ; `complet` et `nuit` : tout, Chromium en 8 parts (lot R12 ; 6 au lot R13). Firefox et WebKit : un job chacun, le petit
      # ensemble `@navigateurs` des deux jeux (rediffusion bit à bit, chargement, une partie ; `grep` de leurs projets Playwright). Avant le lot R13 : 17 jobs,
      # dont 6 de Firefox et WebKit pour des specs sautés aux trois quarts (sans WebGL).
      matrix: ${{ fromJSON(needs.scope.outputs.e2e_complet_matrice) }}
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
      - run: npx playwright install ${{ matrix.browser }}
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit != 'true'
      # Lot R12 : les paquets système du navigateur SANS apt (le miroir d'apt prenait jusqu'à 10 min sur un runner sur cinq, lot R13). Clé : le navigateur,
      # la version de Playwright et l'image du runner (elle change ≈ chaque semaine : le cache de la précédente sert s'il s'accorde) ; sinon apt, une fois.
      # Choix (cache plutôt que l'image Docker de Playwright) et mesures : scripts/paquets-playwright.sh, docs/plateforme/lots/lot-R12-un-seul-bouton.md.
      - name: Clé des paquets système
        id: paquets
        run: |
          pw="$(node -p 'require("./node_modules/@playwright/test/package.json").version')"
          echo "prefixe=paquets-${{ runner.os }}-${{ matrix.browser }}-pw$pw-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "cle=paquets-${{ runner.os }}-${{ matrix.browser }}-pw$pw-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: paquets-cache
        with:
          path: ~/paquets-playwright
          key: ${{ steps.paquets.outputs.cle }}
          restore-keys: ${{ steps.paquets.outputs.prefixe }}
      - name: Paquets système de Playwright
        run: bash scripts/paquets-playwright.sh ${{ matrix.browser }} "$HOME/paquets-playwright"
        timeout-minutes: 15
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.paquets-cache.outputs.cache-hit != 'true'
        with:
          path: ~/paquets-playwright
          key: ${{ steps.paquets.outputs.cle }}
      - run: npm run build && npm run build:node -w @cdj/api
        if: matrix.suite != 'jump'
        env:
          # Lot R8 : les e2e tournent le 20/10/2026 (horloge maîtrisée) : les archives des jeux commencent au circuit n° 1, pas au lancement public.
          VITE_LANCEMENT_PREMIER_JOUR: "2026-10-13"
      - run: npm run build -w @cdj/jump
        if: matrix.suite == 'jump'
        env:
          # Lot R8 : les e2e tournent le 20/10/2026 (horloge maîtrisée) : les archives des jeux commencent au circuit n° 1, pas au lancement public.
          VITE_LANCEMENT_PREMIER_JOUR: "2026-10-13"
      - name: Nom de la part
        run: |
          blob="$(echo '${{ matrix.suite == 'jump' && 'jump-' || '' }}${{ matrix.browser }}-${{ matrix.shard }}' | sed 's#/#sur#')"
          # Lot R13 : `--essentiel` (CI de main) écarte les specs « Régression » ; `--grep-invert` les tests `@regression` des autres.
          if [ "${{ matrix.essentiel }}" = true ]; then echo "PARTS_OPT=--essentiel" >> "$GITHUB_ENV"; echo "PW_OPT=--grep-invert=@regression" >> "$GITHUB_ENV"; fi
          echo "blob=$blob" >> "$GITHUB_ENV"
          # Le petit ensemble (lot R13) nomme le rapport de chacune de ses deux étapes.
          [ "${{ matrix.suite }}" = navigateurs ] || echo "E2E_BLOB_NAME=report-$blob.zip" >> "$GITHUB_ENV"
      # Chromium (retouche 31b) : parts composées par DURÉE (scripts/e2e-parts.mjs, apps/web/e2e/durees.json) et UN test à la fois.
      # Le runner a 2 cœurs : deux pages en WebGL logiciel côte à côte s'y affament (miniatures + spectateur : × 3 à × 6 sur les durées),
      # et `--shard` (coupe au nombre de tests) changeait de voisins à chaque spec ajouté.
      - name: Tests e2e (${{ matrix.browser }}, part ${{ matrix.shard }})
        if: matrix.suite != 'jump' && matrix.suite != 'navigateurs'
        run: |
          node scripts/e2e-parts.mjs ${{ matrix.shard }} chromium $PARTS_OPT > "$RUNNER_TEMP/part.txt"
          npm run e2e -w @cdj/web -- --project=chromium --workers=1 --test-list "$RUNNER_TEMP/part.txt" $PW_OPT
      # Lot R13 : le petit ensemble `@navigateurs` (la configuration de Playwright filtre Firefox et WebKit) des deux jeux, l'un après l'autre (un rapport chacun).
      - name: Tests e2e DailyTrack, petit ensemble (${{ matrix.browser }})
        if: matrix.suite == 'navigateurs'
        env:
          E2E_BLOB_NAME: report-${{ matrix.browser }}-web.zip
        run: npm run e2e -w @cdj/web -- --project=${{ matrix.browser }}
      - name: Tests e2e DailyJump, petit ensemble (${{ matrix.browser }})
        if: always() && matrix.suite == 'navigateurs'
        env:
          E2E_BLOB_NAME: report-${{ matrix.browser }}-jump.zip
        run: npm run e2e -w @cdj/jump -- --project=jump-${{ matrix.browser }}
      # DailyJump (lot 3c) : mêmes règles que DailyTrack. Chromium : parts composées par durée (apps/jump/e2e/durees.json) et un test à la fois
      # (même runner à 2 cœurs, même rendu logiciel). Les outils de mesure et de captures (MESURE, CAPTURES) ne sont pas listés sans leur variable
      # (`testIgnore` des configurations de Playwright, lot R13) : ni l'une ni l'autre n'est définie ici.
      - name: Tests e2e DailyJump (${{ matrix.browser }}, part ${{ matrix.shard }})
        if: matrix.suite == 'jump'
        run: |
          node scripts/e2e-parts.mjs ${{ matrix.shard }} jump-chromium $PARTS_OPT > "$RUNNER_TEMP/part.txt"
          npm run e2e -w @cdj/jump -- --project=jump-chromium --workers=1 --test-list "$RUNNER_TEMP/part.txt" $PW_OPT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.suite != 'navigateurs'
        with:
          name: blob-${{ env.blob }}
          path: ${{ matrix.suite == 'jump' && 'apps/jump' || 'apps/web' }}/blob-report/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.suite == 'navigateurs'
        with:
          name: blob-${{ env.blob }}-web
          path: apps/web/blob-report/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.suite == 'navigateurs'
        with:
          name: blob-${{ env.blob }}-jump
          path: apps/jump/blob-report/
          retention-days: 7
          if-no-files-found: warn
      # Traces des essais ratés (même ceux d'un test réussi à la relance) : de quoi trouver la cause d'une instabilité.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: resultats-${{ env.blob }}
          path: |
            apps/web/test-results/
            apps/jump/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Lot R10 — les e2e d'une PR : seulement les specs liés aux fichiers modifiés (e2e/zones.json), Chromium, un test à la fois, au plus quatre parts de
  # durée égale (scripts/ci-zones.mjs). Une part peut porter des specs des deux jeux (deux étapes successives du même job, chacune avec son rapport).
  e2e-pr:
    needs: scope
    if: needs.scope.outputs.e2e_pr_actif == 'true'
    name: e2e-pr (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.e2e_pr_matrice) }}
    env:
      SPECS_WEB: ${{ matrix.web }}
      SPECS_JUMP: ${{ matrix.jump }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - run: npx playwright install chromium
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit != 'true'
      # Lot R12 : les paquets système du navigateur SANS apt (le miroir d'apt prenait jusqu'à 10 min sur un runner sur cinq, lot R13). Clé : le navigateur,
      # la version de Playwright et l'image du runner (elle change ≈ chaque semaine : le cache de la précédente sert s'il s'accorde) ; sinon apt, une fois.
      # Choix (cache plutôt que l'image Docker de Playwright) et mesures : scripts/paquets-playwright.sh, docs/plateforme/lots/lot-R12-un-seul-bouton.md.
      - name: Clé des paquets système
        id: paquets
        run: |
          pw="$(node -p 'require("./node_modules/@playwright/test/package.json").version')"
          echo "prefixe=paquets-${{ runner.os }}-chromium-pw$pw-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "cle=paquets-${{ runner.os }}-chromium-pw$pw-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: paquets-cache
        with:
          path: ~/paquets-playwright
          key: ${{ steps.paquets.outputs.cle }}
          restore-keys: ${{ steps.paquets.outputs.prefixe }}
      - name: Paquets système de Playwright
        run: bash scripts/paquets-playwright.sh chromium "$HOME/paquets-playwright"
        timeout-minutes: 15
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.paquets-cache.outputs.cache-hit != 'true'
        with:
          path: ~/paquets-playwright
          key: ${{ steps.paquets.outputs.cle }}
      # DailyTrack a besoin des deux jeux (e2e/deux-jeux.mjs) et du serveur ; DailyJump seul n'a besoin que de lui.
      - run: npm run build && npm run build:node -w @cdj/api
        if: matrix.web != ''
        env:
          # Lot R8 : les e2e tournent le 20/10/2026 (horloge maîtrisée) : les archives des jeux commencent au circuit n° 1, pas au lancement public.
          VITE_LANCEMENT_PREMIER_JOUR: "2026-10-13"
      - run: npm run build -w @cdj/jump
        if: matrix.web == '' && matrix.jump != ''
        env:
          # Lot R8 : les e2e tournent le 20/10/2026 (horloge maîtrisée) : les archives des jeux commencent au circuit n° 1, pas au lancement public.
          VITE_LANCEMENT_PREMIER_JOUR: "2026-10-13"
      - name: Tests e2e DailyTrack (Chromium)
        if: matrix.web != ''
        env:
          E2E_BLOB_NAME: report-pr-web-${{ strategy.job-index }}.zip
        run: |
          node scripts/e2e-parts.mjs liste chromium $(printf 'web/%s ' $SPECS_WEB) > "$RUNNER_TEMP/part-web.txt"
          # Lot R13 : les tests `@regression` (famille « Régression », docs/tests.md) ne tournent que dans la CI complète.
          npm run e2e -w @cdj/web -- --project=chromium --workers=1 --test-list "$RUNNER_TEMP/part-web.txt" --grep-invert=@regression
      - name: Tests e2e DailyJump (Chromium)
        if: always() && matrix.jump != ''
        env:
          E2E_BLOB_NAME: report-pr-jump-${{ strategy.job-index }}.zip
        run: |
          node scripts/e2e-parts.mjs liste chromium $(printf 'jump/%s ' $SPECS_JUMP) > "$RUNNER_TEMP/part-jump.txt"
          npm run e2e -w @cdj/jump -- --project=jump-chromium --workers=1 --test-list "$RUNNER_TEMP/part-jump.txt" --grep-invert=@regression
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.web != ''
        with:
          name: blob-pr-web-${{ strategy.job-index }}
          path: apps/web/blob-report/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.jump != ''
        with:
          name: blob-pr-jump-${{ strategy.job-index }}
          path: apps/jump/blob-report/
          retention-days: 7
          if-no-files-found: warn
      # Traces des essais ratés (même ceux d'un test réussi à la relance).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: resultats-pr-${{ strategy.job-index }}
          path: |
            apps/web/test-results/
            apps/jump/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Verdict unique (statut `e2e`) : fusionne les rapports des parts, écrit le résumé (instables nommés) et échoue au moindre vrai échec.
  # Lot R2 : ce job tourne TOUJOURS (`if: always()`), même si toutes les parts sont sautées : c'est lui qui porte le statut requis `e2e`, il n'est donc
  # jamais « sauté » ni en attente. Sans suite concernée (PR de documentation, ou aucun spec lié), il le dit dans le résumé et réussit ; si `scope` a
  # échoué il échoue (on ne sait pas ce qui devait tourner).
  # Lot R10 : `rapports` = des specs ont tourné (CI complète : toujours ; PR : `e2e-pr` actif) ; la part qui a tourné est `e2e-pr` (PR) ou `e2e-parts`.
  e2e:
    needs: [scope, e2e-parts, e2e-pr]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      echecs: ${{ steps.resume.outputs.echecs }}
    env:
      RAPPORTS: ${{ needs.scope.outputs.mode != 'pr' || needs.scope.outputs.e2e_pr_actif == 'true' }}
      MODE: ${{ needs.scope.outputs.mode }}
      PARTS: ${{ needs.scope.outputs.mode == 'pr' && needs.e2e-pr.result || needs.e2e-parts.result }}
    steps:
      - name: Portée connue ?
        run: |
          [ "${{ needs.scope.result }}" = success ] || { echo "::error::le job scope a échoué : on ne sait pas quelles suites devaient tourner"; exit 1; }
      - name: Aucune suite e2e concernée
        if: env.RAPPORTS != 'true'
        run: |
          echo "### e2e : aucun spec e2e lié aux fichiers de cette PR (documentation seule, ou rien que les tests unitaires ne couvrent) — verdict vert, rien à fusionner" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RAPPORTS == 'true'
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.RAPPORTS == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: env.RAPPORTS == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.RAPPORTS == 'true'
        with:
          pattern: blob-*
          path: apps/web/all-blobs
          merge-multiple: true
      - name: Fusionner les rapports
        if: env.RAPPORTS == 'true'
        working-directory: apps/web
        run: |
          mkdir -p merged
          if ls all-blobs/*.zip >/dev/null 2>&1; then
            # --config : les rapports de DailyTrack et de DailyJump viennent de dossiers de tests différents (lot 3c, scripts/e2e-merge.config.mjs).
            # Chemins ABSOLUS : avec --config, Playwright range les sorties relativement au dossier de la configuration, pas du dossier courant.
            PLAYWRIGHT_JSON_OUTPUT_NAME="$PWD/merged/report.json" PLAYWRIGHT_HTML_OUTPUT_DIR="$PWD/playwright-report" npx playwright merge-reports --config ../../scripts/e2e-merge.config.mjs --reporter=json,html all-blobs
            ls merged
          else
            echo "aucun rapport de part : les jobs e2e ont échoué avant les tests" >&2
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.RAPPORTS == 'true'
        with:
          name: rapport-e2e
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Résumé du run
        id: resume
        if: env.RAPPORTS == 'true'
        run: |
          if [ ! -f apps/web/merged/report.json ]; then
            echo "### e2e : aucun rapport, les jobs de part ont échoué avant les tests" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Mode (lot R3) : `pr` — un test de e2e/quarantaine.json n'est qu'un avertissement ; `complet` (main, à la demande) — tout est bloquant ;
          # `nuit` — tout est bloquant, un instable aussi (c'est le but : voir une instabilité qui revient), une dette de plus de 14 jours aussi.
          # Une quarantaine qui ne respecte pas ses garde-fous fait échouer le run, quel que soit le mode.
          set +e
          node scripts/e2e-summary.mjs apps/web/merged/report.json --mode "$MODE" --quarantaine e2e/quarantaine.json --echecs echecs.json > summary.md
          code=$?
          # Lot R12 : les tests rouges, pour le résumé de « Mettre en production » (sortie `echecs` du workflow appelé).
          echo "echecs=$(cat echecs.json 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          [ "$PARTS" = "success" ] || [ $code -ne 0 ] || { echo "::error::une part e2e a échoué sans test en échec (installation, construction, délai dépassé…) : voir le job"; code=1; }
          exit $code

  # Lot 28 : l'image Docker de l'API (celle de Cloud Run) démarre contre un vrai serveur libSQL (le protocole de Turso), répond à /api/health,
  # sert un temps du jour et du Salon rejoués par le serveur, et refuse de démarrer avec SALON_MINUTES.
  api-image:
    # Lot R2 : seulement si le serveur est touché (scripts/ci-scope.mjs : SERVER_PATHS, zone partagée ou doute). Non requis : sauté = sans effet.
    # Lot R10 : jamais pour une PR de documentation seule.
    needs: scope
    if: needs.scope.outputs.server == 'true' && needs.scope.outputs.docs_seuls != 'true'
    runs-on: ubuntu-latest
    services:
      libsql:
        # sqld, le serveur de Turso (épinglé par son empreinte ; à renouveler de temps en temps).
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w @cdj/api --ignore-scripts
      - name: Construire l'image
        run: docker build -f apps/api/Dockerfile -t cdj-api .
      - name: Démarrage refusé avec SALON_MINUTES (production)
        run: |
          set +e
          docker run --rm -e SALON_MINUTES=2 -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "attendu : sortie 1, obtenu $code"; exit 1; }
      # Lot R1 (plateforme) : la même image en recette. Elle refuse une base dont le nom ne contient pas « recette » (et la production refuse
      # une base de recette) ; en recette, l'horloge de test est permise, et l'essai de bout en bout passe (`recette.local` → le même sqld).
      - name: Recette — démarrage refusé sur une base sans « recette », production refusée sur une base de recette
        run: |
          set +e
          docker run --rm -e ENVIRONMENT=recette -e TURSO_DATABASE_URL=libsql://dailytrack-misterzcool.turso.io -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "recette sur la base de production : attendu sortie 1, obtenu $code"; exit 1; }
          docker run --rm -e TURSO_DATABASE_URL=libsql://dailytrack-recette-misterzcool.turso.io -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "production sur la base de recette : attendu sortie 1, obtenu $code"; exit 1; }
      - name: Recette — l'image démarre avec l'horloge de test et passe l'essai de bout en bout
        run: |
          # `recette.local` = l'hôte du runner (où sqld est publié sur 8081) : le nom de la base vue par config.ts est « recette ».
          docker run -d --name cdj-recette -p 8091:8091 --add-host recette.local:host-gateway -e PORT=8091 -e ENVIRONMENT=recette \
            -e TURSO_DATABASE_URL=http://recette.local:8081 -e TEST_CLOCK_OFFSET_MS=0 \
            -e ALLOWED_ORIGINS=https://playdujour.com -e RATE_SALT=un-sel-de-test-assez-long -e TRUST_PROXY=1 cdj-api
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8091/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8091/api/health | jq -e '.ok == true and .db == "ok"'
          npm run smoke -w @cdj/api -- http://127.0.0.1:8091 --origin https://playdujour.com
          docker logs cdj-recette
          docker rm -f cdj-recette
      - name: Démarrer l'image contre libSQL
        run: |
          docker run -d --name cdj --network host -e PORT=8090 -e TURSO_DATABASE_URL=http://127.0.0.1:8081 \
            -e ALLOWED_ORIGINS=https://playdujour.com -e RATE_SALT=un-sel-de-test-assez-long -e TRUST_PROXY=1 cdj-api
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8090/api/health | jq -e '.ok == true and .db == "ok" and .salonOverride == false'
      - name: Essai de bout en bout (temps du jour, Salon, DailyJump)
        run: npm run smoke -w @cdj/api -- http://127.0.0.1:8090 --origin https://playdujour.com
      # Lot P0 (plateforme) : l'image contient jump-sim et les jours figés ; `/api/jump/info` les liste tous, et chaque jour figé est servi depuis
      # son fichier (preuve rejouée) avec l'identifiant, l'empreinte et le temps de l'auteur du fichier du dépôt.
      - name: DailyJump — /api/jump/info et chaque jour figé servi avec l'empreinte de son fichier
        run: |
          info=$(curl -sf http://127.0.0.1:8090/api/jump/info)
          echo "$info"
          expected=$(ls apps/jump/public/levels/*.json | sed -E 's#.*/([0-9-]+)\.json#\1#' | sort | jq -R . | jq -cs .)
          echo "$info" | jq -e --argjson days "$expected" '.frozenDays == $days and (.frozenDays | length) > 0' > /dev/null || { echo "jours figés attendus : $expected"; exit 1; }
          today=$(echo "$info" | jq -r .today)
          for f in apps/jump/public/levels/*.json; do
            d=$(basename "$f" .json)
            # « Mettre en production » fige aussi demain (freeze:days -- demain) : un jour figé à venir n'est pas encore servi (404).
            if [[ "$d" > "$today" ]]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8090/api/jump/day/$d")
              echo "$d → $code (à venir)"
              [ "$code" = 404 ] || { echo "$d : jour à venir servi ($code)"; exit 1; }
              continue
            fi
            got=$(curl -sf "http://127.0.0.1:8090/api/jump/day/$d")
            echo "$d → $got"
            jq -e --argjson g "$got" '$g.source == "fige" and $g.id == .id and $g.hash == .hash and $g.authorTicks == .auteur' "$f" > /dev/null || { echo "$d : réponse différente du fichier figé"; exit 1; }
          done
      - name: Journaux du conteneur
        if: always()
        run: docker logs cdj
