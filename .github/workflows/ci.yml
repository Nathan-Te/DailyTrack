name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  # Garde-fou (retouche 29b) : la suite complète tourne chaque nuit sur `main` (03 h 17 UTC : loin d'un changement de jour, jamais sur
  # une heure pleine très chargée) ; à ce run, un test instable fait échouer le job pour qu'une instabilité qui revient se voie.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Même rediffusion rejouée dans Chromium, Firefox et WebKit : le résultat doit être identique à celui de Node.
  # Retouche 29b — CI rapide et fiable : une matrice (un job par navigateur et par part, `--shard`), une relance unique (`retries: 1`, voir
  # apps/web/playwright.config.ts) et un job `e2e` qui fusionne les rapports, NOMME les tests instables dans le résumé du run et donne le verdict.
  # `e2e-parts` ne sert qu'à répartir le travail ; la protection de branche exige `test` et `e2e` (docs/lots/lot-29b-ci-fiable.md).
  # Lot 3c — DailyJump suit les mêmes règles : ses specs (apps/jump/e2e) sont des parts de la même matrice (`suite: jump`, un projet Playwright
  # `jump-<navigateur>`), avec la même relance (`retries: 1` en CI), des rapports « blob » fusionnés dans le même rapport et le même verdict `e2e`.
  # (Ne pas écrire `browser: chromium, shard: …` pour une entrée jump : apps/web/test/e2eParts.test.ts lit le nombre de parts DailyTrack ci-dessous.)
  e2e-parts:
    name: e2e-parts (${{ matrix.suite == 'jump' && 'jump ' || '' }}${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: "1/8" }
          - { browser: chromium, shard: "2/8" }
          - { browser: chromium, shard: "3/8" }
          - { browser: chromium, shard: "4/8" }
          - { browser: chromium, shard: "5/8" }
          - { browser: chromium, shard: "6/8" }
          - { browser: chromium, shard: "7/8" }
          - { browser: chromium, shard: "8/8" }
          - { browser: firefox, shard: "1/2" }
          - { browser: firefox, shard: "2/2" }
          - { browser: webkit, shard: "1/2" }
          - { browser: webkit, shard: "2/2" }
          - { suite: jump, shard: "1/2", browser: chromium }
          - { suite: jump, shard: "2/2", browser: chromium }
          - { suite: jump, shard: "1/1", browser: firefox }
          - { suite: jump, shard: "1/1", browser: webkit }
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps ${{ matrix.browser }}
        working-directory: apps/web
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npm run build && npm run build:node -w @cdj/api
        if: matrix.suite != 'jump'
      - run: npm run build -w @cdj/jump
        if: matrix.suite == 'jump'
      - name: Nom de la part
        run: |
          blob="$(echo '${{ matrix.suite == 'jump' && 'jump-' || '' }}${{ matrix.browser }}-${{ matrix.shard }}' | sed 's#/#sur#')"
          echo "blob=$blob" >> "$GITHUB_ENV"
          echo "E2E_BLOB_NAME=report-$blob.zip" >> "$GITHUB_ENV"
      # Chromium (retouche 31b) : parts composées par DURÉE (scripts/e2e-parts.mjs, apps/web/e2e/durees.json) et UN test à la fois.
      # Le runner a 2 cœurs : deux pages en WebGL logiciel côte à côte s'y affament (miniatures + spectateur : × 3 à × 6 sur les durées),
      # et `--shard` (coupe au nombre de tests) changeait de voisins à chaque spec ajouté. Firefox et WebKit (rapides, sans WebGL lourd) gardent `--shard`.
      - name: Tests e2e (${{ matrix.browser }}, part ${{ matrix.shard }})
        if: matrix.suite != 'jump'
        run: |
          if [ "${{ matrix.browser }}" = chromium ]; then
            node scripts/e2e-parts.mjs ${{ matrix.shard }} chromium > "$RUNNER_TEMP/part.txt"
            npm run e2e -w @cdj/web -- --project=chromium --workers=1 --test-list "$RUNNER_TEMP/part.txt"
          else
            npm run e2e -w @cdj/web -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
          fi
      # DailyJump (lot 3c) : mêmes règles que DailyTrack. Chromium : parts composées par durée (apps/jump/e2e/durees.json) et un test à la fois
      # (même runner à 2 cœurs, même rendu logiciel) ; Firefox et WebKit : `--shard`. Les outils de mesure et de captures (MESURE, CAPTURES) se
      # sautent d'eux-mêmes avec leur motif (« outil de mesure : MESURE=1 ») : ni l'un ni l'autre n'est défini ici.
      - name: Tests e2e DailyJump (${{ matrix.browser }}, part ${{ matrix.shard }})
        if: matrix.suite == 'jump'
        run: |
          if [ "${{ matrix.browser }}" = chromium ]; then
            node scripts/e2e-parts.mjs ${{ matrix.shard }} jump-chromium > "$RUNNER_TEMP/part.txt"
            npm run e2e -w @cdj/jump -- --project=jump-chromium --workers=1 --test-list "$RUNNER_TEMP/part.txt"
          else
            npm run e2e -w @cdj/jump -- --project=jump-${{ matrix.browser }} --shard=${{ matrix.shard }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ env.blob }}
          path: ${{ matrix.suite == 'jump' && 'apps/jump' || 'apps/web' }}/blob-report/
          retention-days: 7
          if-no-files-found: warn
      # Traces des essais ratés (même ceux d'un test réussi à la relance) : de quoi trouver la cause d'une instabilité.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-${{ env.blob }}
          path: ${{ matrix.suite == 'jump' && 'apps/jump' || 'apps/web' }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Verdict unique (statut `e2e`) : fusionne les rapports des parts, écrit le résumé (instables nommés) et échoue au moindre vrai échec.
  e2e:
    needs: e2e-parts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: apps/web/all-blobs
          merge-multiple: true
      - name: Fusionner les rapports
        working-directory: apps/web
        run: |
          mkdir -p merged
          if ls all-blobs/*.zip >/dev/null 2>&1; then
            # --config : les rapports de DailyTrack et de DailyJump viennent de dossiers de tests différents (lot 3c, scripts/e2e-merge.config.mjs).
            # Chemins ABSOLUS : avec --config, Playwright range les sorties relativement au dossier de la configuration, pas du dossier courant.
            PLAYWRIGHT_JSON_OUTPUT_NAME="$PWD/merged/report.json" PLAYWRIGHT_HTML_OUTPUT_DIR="$PWD/playwright-report" npx playwright merge-reports --config ../../scripts/e2e-merge.config.mjs --reporter=json,html all-blobs
            ls merged
          else
            echo "aucun rapport de part : les jobs e2e-parts ont échoué avant les tests" >&2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-e2e
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Résumé du run
        run: |
          if [ ! -f apps/web/merged/report.json ]; then
            echo "### e2e : aucun rapport, les jobs de part ont échoué avant les tests" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Run de nuit : un test instable fait échouer le job (c'est le but : voir une instabilité qui revient).
          flags=""; [ "${{ github.event_name }}" = "schedule" ] && flags="--fail-on-flaky"
          set +e
          node scripts/e2e-summary.mjs apps/web/merged/report.json $flags > summary.md
          code=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          [ "${{ needs.e2e-parts.result }}" = "success" ] || [ $code -ne 0 ] || { echo "::error::une part e2e a échoué sans test en échec (installation, construction, délai dépassé…) : voir le job"; code=1; }
          exit $code

  # Lot 28 : l'image Docker de l'API (celle de Cloud Run) démarre contre un vrai serveur libSQL (le protocole de Turso), répond à /api/health,
  # sert un temps du jour et du Salon rejoués par le serveur, et refuse de démarrer avec SALON_MINUTES.
  api-image:
    runs-on: ubuntu-latest
    services:
      libsql:
        # sqld, le serveur de Turso (épinglé par son empreinte ; à renouveler de temps en temps).
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w @cdj/api --ignore-scripts
      - name: Construire l'image
        run: docker build -f apps/api/Dockerfile -t cdj-api .
      - name: Démarrage refusé avec SALON_MINUTES (production)
        run: |
          set +e
          docker run --rm -e SALON_MINUTES=2 -e ALLOWED_ORIGINS='*' -e RATE_SALT=un-sel-de-test-assez-long cdj-api
          code=$?
          [ "$code" = "1" ] || { echo "attendu : sortie 1, obtenu $code"; exit 1; }
      - name: Démarrer l'image contre libSQL
        run: |
          docker run -d --name cdj --network host -e PORT=8090 -e TURSO_DATABASE_URL=http://127.0.0.1:8081 \
            -e ALLOWED_ORIGINS=https://nathan-te.github.io -e RATE_SALT=un-sel-de-test-assez-long -e TRUST_PROXY=1 cdj-api
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8090/api/health | jq -e '.ok == true and .db == "ok" and .salonOverride == false'
      - name: Essai de bout en bout (temps du jour, Salon)
        run: npm run smoke -w @cdj/api -- http://127.0.0.1:8090 --origin https://nathan-te.github.io
      - name: Journaux du conteneur
        if: always()
        run: docker logs cdj
