name: Recette
# Lot R1 (plateforme), repris au lot R4 (playdujour.com). Le serveur de recette (service Cloud Run `cdj-api-recette`, base Turso de recette) et le
# site de recette (recette.playdujour.com, Firebase Hosting), séparés de la production. Pas à pas : docs/plateforme/recette.md, docs/plateforme/domaine.md.
#   - Fusion dans main (lot R4) : la recette prend `main` en entier — révision par défaut du serveur, joueurs fictifs (`recette:seed`), puis le
#     site de recette (/api/** renvoyé vers cdj-api-recette). Plus aucun déploiement automatique de la production (bouton : production.yml).
#   - PR qui touche le serveur (SERVER_PATHS) : révision `b-<branche>-<empreinte>` SANS trafic, contrôle de /api/health, `npm run smoke`, puis
#     son canal d'aperçu Firebase (`pr-<n>`, site de recette) construit pour parler à CETTE révision par son adresse directe (l'origine du canal
#     est ajoutée aux origines permises de la révision) ; commentaire « Recette » sur la PR. Les autres PR : apercu.yml (recette par défaut).
#     Pourquoi une adresse directe et pas un renvoi épinglé : README du lot R4 (`pinTag` de Firebase est expérimental, suit la dernière révision
#     créée du service et exige d'épingler aussi le site de recette « live »).
#   - PR fermée : l'étiquette est retirée (le canal d'aperçu, lui, est supprimé par apercu.yml).
#   - « Run workflow » : sur main, comme une fusion ; sur une branche, sa révision étiquetée, avec au besoin un Salon court ou une horloge de test.
# Jamais pour une PR venue d'un fork : les secrets ne sortent pas du dépôt. Tant que la recette n'est pas configurée, tout est sauté avec le
# message « recette non configurée : voir docs/plateforme/recette.md » (Firebase : « Firebase non configuré : voir docs/plateforme/domaine.md »)
# et la CI reste verte.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Recopié de SERVER_PATHS (scripts/recette.mjs) ; apps/api/test/recette.test.ts vérifie que les deux listes sont identiques.
    paths:
      - "apps/api/**"
      - "packages/sim/**"
      - "packages/core/**"
      - "packages/clock/**"
      - "packages/jump-sim/**"
      - "packages/profile/**"
      - "apps/jump/public/levels/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/recette.yml"
  workflow_dispatch:
    inputs:
      salon_minutes:
        description: "SALON_MINUTES (Salon court, ex. 2) ; vide : durée normale"
        type: string
        default: ""
      test_clock_offset_ms:
        description: "TEST_CLOCK_OFFSET_MS (ms, entier : décale l'horloge du serveur, ex. pour tester minuit) ; vide : heure réelle"
        type: string
        default: ""

permissions:
  contents: read

# Une fusion à la fois dans la recette (une nouvelle attend la précédente) ; une PR : une poussée remplace la précédente.
concurrency:
  group: recette-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIREBASE_TOOLS: firebase-tools@15.34.0

jobs:
  # Ce qui est à faire, et pour quelle étiquette (même calcul que le workflow Aperçu).
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
      tag: ${{ steps.plan.outputs.tag }}
      branch: ${{ steps.plan.outputs.branch }}
      canal: ${{ steps.plan.outputs.canal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          canal=""
          if [ "$EVENT" = pull_request ]; then
            branch="$HEAD_REF"
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              action=fork
              echo "### Recette : PR venue d'un fork, rien n'est déployé (les secrets ne sortent pas du dépôt)" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Recette::PR venue d'un fork ($HEAD_REPO) : pas de révision de recette."
            elif [ "$PR_ACTION" = closed ]; then action=cleanup
            else action=deploy; canal="$(node scripts/domaine.mjs canal "$PR")"
            fi
          else
            branch="$GITHUB_REF_NAME"
            if [ "$branch" = main ]; then action=default; else action=deploy; fi
          fi
          tag=""
          [ "$action" = deploy ] || [ "$action" = cleanup ] && tag="$(node scripts/recette.mjs tag "$branch")"
          { echo "action=$action"; echo "tag=$tag"; echo "branch=$branch"; echo "canal=$canal"; } >> "$GITHUB_OUTPUT"
          echo "branche : $branch · action : $action · étiquette : ${tag:-(révision par défaut)}${canal:+ · canal d’aperçu : $canal}"

  # Lot R4 : le canal d'aperçu de la PR existe AVANT la révision (son adresse — `https://<site>--pr-<n>-<empreinte>.web.app`, fixée à la
  # création — doit être dans les origines permises de la révision : l'aperçu l'appelle par son adresse directe, donc en CORS).
  canal:
    needs: plan
    if: needs.plan.outputs.canal != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      origin: ${{ steps.canal.outputs.origin }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SITE: ${{ vars.FIREBASE_SITE_RECETTE }}
      CANAL: ${{ needs.plan.outputs.canal }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Configuration présente ?
        id: cfg
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$SITE" ] && { { [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; } || [ "$HAS_SA_KEY" = true ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Firebase non configuré : voir docs/plateforme/domaine.md (pas de canal d'aperçu)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Firebase non configuré::Firebase non configuré : voir docs/plateforme/domaine.md"
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.cfg.outputs.enabled == 'true' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.cfg.outputs.enabled == 'true' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '')
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Créer (ou retrouver) le canal d'aperçu
        id: canal
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          # Lot R5 : `hosting:channel:create` refuse de tourner hors d'un dossier d'application Firebase (« could not locate firebase.json ») ;
          # ce job n'a pas le dépôt : un firebase.json minimal (le site seulement) suffit, rien n'est publié ici.
          printf '{"hosting":{"site":"%s","public":"."}}\n' "$SITE" > firebase.json
          list() { npx --yes "$FIREBASE_TOOLS" hosting:channel:list --site "$SITE" --project "$GCP_PROJECT_ID" --json | jq -r --arg c "$CANAL" '.result.channels[]? | select(.name | endswith("/channels/" + $c)) | .url'; }
          url="$(list)"
          if [ -z "$url" ]; then
            npx --yes "$FIREBASE_TOOLS" hosting:channel:create "$CANAL" --site "$SITE" --project "$GCP_PROJECT_ID" --expires 7d --json > created.json || { cat created.json; exit 1; }
            url="$(jq -r '.result.url // empty' created.json)"
            [ -n "$url" ] || url="$(list)"
          fi
          [ -n "$url" ] || { echo "::error::adresse du canal $CANAL introuvable"; exit 1; }
          origin="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$url")"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "- Canal d'aperçu \`$CANAL\` : $url (origine permise par la révision de recette)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, canal]
    if: ${{ !cancelled() && (needs.plan.outputs.action == 'deploy' || needs.plan.outputs.action == 'default') && needs.canal.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: recette
      tag: ${{ needs.plan.outputs.tag }}
      salon_minutes: ${{ inputs.salon_minutes || '' }}
      test_clock_offset_ms: ${{ inputs.test_clock_offset_ms || '' }}
      extra_origins: ${{ needs.canal.outputs.origin || '' }}
    secrets: inherit

  # Lot P2 : les joueurs fictifs de la recette (`recette:seed`), tout de suite après le déploiement d'une révision (recette-seed.yml : mêmes accès,
  # aucun secret GitHub de plus ; refuse la production). Il tourne aussi chaque jour, seul.
  seed:
    needs: [plan, deploy]
    if: ${{ !cancelled() && needs.deploy.outputs.enabled == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/recette-seed.yml
    secrets: inherit

  # Lot R4 : le site de recette (recette.playdujour.com) prend main en entier, après le serveur. Sans recette serveur configurée, il est publié
  # quand même (les jeux marchent sans serveur ; /api/ ne répond pas).
  site:
    needs: [plan, deploy]
    if: ${{ !cancelled() && needs.plan.outputs.action == 'default' && needs.deploy.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      cible: recette
      api: /
    secrets: inherit

  # Lot I3 : le cache de Firebase Hosting respecte-t-il `Vary: X-Player-Id` ? Le portail rend la même adresse (`/api/portail/jour`, `/api/portail/classement`) en version
  # publique (gardée par le CDN, 60 s au plus) et en version personnelle (avec l'identifiant, `private`). Par l'adresse de Hosting (jamais Cloud Run en direct : sans CDN,
  # la vérification ne prouverait rien), une lecture avec l'identifiant du joueur de démonstration faite juste après une lecture sans doit recevoir l'état du joueur, et
  # l'inverse (`smoke --lecture-seule --par-hosting --joueur-demo`, apps/api/scripts/smokeRead.ts : des GET seulement, rien n'est écrit). Fusion dans main seulement (la
  # révision d'une PR n'a pas le trafic : l'adresse de Hosting sert la recette par défaut).
  hosting:
    needs: [plan, deploy, seed, site]
    if: ${{ !cancelled() && needs.plan.outputs.action == 'default' && needs.deploy.result == 'success' && needs.deploy.outputs.enabled == 'true' && needs.site.result == 'success' && needs.site.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Cache de Firebase Hosting (Vary X-Player-Id)
        env:
          SITE_URL: ${{ needs.site.outputs.url }}
          SEED: ${{ needs.seed.result }}
        run: |
          npm ci -w @cdj/api --ignore-scripts
          # Le joueur de démonstration est créé par recette:seed (job précédent) ; sans lui, un identifiant inventé (404 `unknown_player` attendu, jamais la réponse publique).
          demo=""
          [ "$SEED" = success ] && demo="--joueur-demo" || echo "- recette:seed n'a pas tourné (${SEED:-sauté}) : identifiant inventé à la place du joueur de démonstration" >> "$GITHUB_STEP_SUMMARY"
          if ! npm run smoke -w @cdj/api -- "${SITE_URL%/}" --lecture-seule --environnement recette --par-hosting $demo --origin "$(node scripts/domaine.mjs adresse recette)" --resume "$GITHUB_STEP_SUMMARY"; then
            echo "::error title=Recette : le cache de Firebase Hosting::Une lecture du portail n'a pas la réponse attendue par l'adresse de Hosting (détail dans le résumé du run). Si Hosting ignorait Vary, séparer la réponse publique de la réponse personnelle (voir docs/plateforme/lots/lot-I3-journee-partagee.md)."
            exit 1
          fi

  # Lot R4 : l'aperçu d'une PR qui touche le serveur, construit pour parler à SA révision (adresse directe). Sans révision (recette non
  # configurée), il vise la recette par défaut (/api/, même origine).
  apercu:
    needs: [plan, deploy]
    if: ${{ !cancelled() && needs.plan.outputs.action == 'deploy' && needs.plan.outputs.canal != '' && needs.deploy.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      cible: recette
      canal: ${{ needs.plan.outputs.canal }}
      api: ${{ needs.deploy.outputs.enabled == 'true' && needs.deploy.outputs.url || '/' }}
    secrets: inherit

  # Commentaire sur la PR (un seul, mis à jour à chaque poussée) : la révision de recette et son aperçu.
  announce:
    needs: [plan, deploy, apercu]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.outputs.action == 'deploy' && (needs.deploy.outputs.enabled == 'true' || needs.apercu.outputs.enabled == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      URL: ${{ needs.deploy.outputs.url }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIEW: ${{ needs.apercu.outputs.url }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Commentaire sur la PR
        run: |
          marker="<!-- recette-r1 -->"
          {
            echo "$marker"
            echo "### Recette"
            echo ""
            if [ -n "$URL" ]; then
              echo "- Révision de recette : $URL (étiquette \`$TAG\`, sans trafic ; construite depuis la PR fusionnée avec main, \`${GITHUB_SHA::7}\`)"
              echo "- Santé : $URL/api/health"
            else
              echo "- Révision de recette : non déployée (recette non configurée : voir docs/plateforme/recette.md)"
            fi
            if [ -n "$PREVIEW" ]; then
              echo "- **Aperçu** : ${PREVIEW%/}/ · DailyTrack : ${PREVIEW%/}/track/ · DailyJump : ${PREVIEW%/}/jump/"
              echo "- L'aperçu parle à ${URL:-la recette par défaut} ; son stockage local est le sien (une autre origine que la production). Il expire 7 jours après la dernière poussée et disparaît à la fermeture de la PR."
            else
              echo "- Aperçu : non publié (Firebase non configuré : voir docs/plateforme/domaine.md)"
            fi
            echo ""
            echo "_Mis à jour à chaque poussée ; l'étiquette est retirée et l'aperçu supprimé à la fermeture de la PR._"
          } > body.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
          fi

  # PR fermée : l'étiquette est retirée ; la révision, qui ne reçoit plus rien, est supprimée (sans effet si elle sert encore).
  cleanup:
    needs: plan
    if: needs.plan.outputs.action == 'cleanup'
    runs-on: ubuntu-latest
    environment: recette
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      RECETTE_DB: ${{ vars.RECETTE_TURSO_DATABASE_URL }}
      SERVICE: ${{ vars.RECETTE_GCP_SERVICE || 'cdj-api-recette' }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Configuration présente ?
        id: cfg
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$RECETTE_DB" ] && { { [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; } || [ "$HAS_SA_KEY" = true ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Recette non configurée : voir docs/plateforme/recette.md (rien à nettoyer)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Recette non configurée::recette non configurée : voir docs/plateforme/recette.md"
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.cfg.outputs.enabled == 'true' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.cfg.outputs.enabled == 'true' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '')
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.cfg.outputs.enabled == 'true'
      - name: Retirer l'étiquette
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          revisions="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json 2>/dev/null | jq -r --arg t "$TAG" '.status.traffic[]? | select(.tag == $t) | .revisionName')"
          if [ -z "$revisions" ]; then
            echo "- Aucune révision étiquetée \`$TAG\` : rien à retirer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags="$TAG" --quiet
          for r in $revisions; do
            gcloud run revisions delete "$r" --region "$REGION" --quiet || echo "::notice::révision $r gardée (elle sert encore)"
          done
          echo "- Étiquette \`$TAG\` retirée du service de recette ($revisions)." >> "$GITHUB_STEP_SUMMARY"
