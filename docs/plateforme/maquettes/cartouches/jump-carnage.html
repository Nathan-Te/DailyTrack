<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Jump — Carnage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&amp;family=JetBrains+Mono:wght@700&amp;family=Lilita+One&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:844px;height:390px;position:relative;overflow:hidden;background:#0E1719;font-family:Archivo, sans-serif;color:#2A1E16">
  <svg aria-hidden="true" width="844" height="390" viewBox="0 0 844 390" style="position:absolute;inset:0">
    <rect width="844" height="390" fill="#0E1719"/>
    <path d="M0 110 L844 170 L844 390 L0 390Z" fill="#122023"/>
    <g fill="#182A2C"><circle cx="110" cy="200" r="38"/><circle cx="330" cy="190" r="46"/><circle cx="520" cy="205" r="40"/><circle cx="760" cy="180" r="42"/></g>
    <g fill="#2C4A2B"><rect x="0" y="280" width="150" height="110"/><rect x="200" y="280" width="80" height="110"/><rect x="330" y="280" width="80" height="110"/><rect x="460" y="280" width="180" height="110"/><rect x="700" y="268" width="22" height="122"/><rect x="790" y="250" width="22" height="140"/></g>
    <g fill="#6DBF4B"><rect x="0" y="280" width="150" height="4"/><rect x="200" y="280" width="80" height="4"/><rect x="330" y="280" width="80" height="4"/><rect x="460" y="280" width="180" height="4"/><rect x="700" y="268" width="22" height="4"/><rect x="790" y="250" width="22" height="4"/></g>
    <g fill="#F04040" stroke="#2A0A0A" stroke-width="2"><path d="M152 345 L164 318 L176 345Z M174 345 L186 318 L198 345Z M282 345 L294 318 L306 345Z M304 345 L316 318 L328 345Z M412 345 L424 318 L436 345Z M434 345 L446 318 L458 345Z"/></g>
    <g fill="#F04040" stroke="#2A0A0A" stroke-width="2"><path d="M720 112 l5 10 10-5-5 10 10 5-10 5 5 10-10-5-5 10-5-10-10 5 5-10-10-5 10-5-5-10 10 5z"/></g>
  </svg>

  <sc-for list="{{fantomes}}" as="f" hint-placeholder-count="30">
    <div aria-hidden="true" style="{{f.style}}">
      <span style="position:absolute;left:2px;top:3px;width:3px;height:3px;background:#2A1E16"></span>
      <span style="position:absolute;right:2px;top:3px;width:3px;height:3px;background:#2A1E16"></span>
    </div>
  </sc-for>

  <header style="position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
    <div style="transform:rotate(-2deg);background:#FFD23F;border:3px solid #2A1E16;box-shadow:4px 4px 0 #2A1E16;padding:4px 12px;display:flex;flex-direction:column">
      <h1 style="margin:0;font-family:'Lilita One', sans-serif;font-weight:400;font-size:34px;line-height:1">CARNAGE</h1>
      <span style="font-size:13px;font-weight:700">1 284 morts aujourd'hui, tous joueurs</span>
    </div>
    <div style="background:#FFF6E0;border:3px solid #2A1E16;box-shadow:3px 3px 0 #2A1E16;padding:4px 10px;display:flex;flex-direction:column;align-items:flex-end">
      <span style="font-size:11px;font-weight:700;letter-spacing:1px">VAGUE</span>
      <span style="font-family:'Lilita One', sans-serif;font-size:26px;line-height:1">3 / 12</span>
    </div>
  </header>

  <div style="position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:#FFF6E0;border:3px solid #2A1E16;box-shadow:3px 3px 0 #2A1E16;padding:6px 8px">
    <button aria-label="Vague précédente" style="width:44px;height:44px;border:3px solid #2A1E16;border-radius:3px;background:#FFD23F;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#2A1E16" stroke-width="3" stroke-linecap="square"/></svg></button>
    <button aria-label="Pause" style="width:44px;height:44px;border:3px solid #2A1E16;border-radius:3px;background:#2A1E16;display:flex;align-items:center;justify-content:center;gap:4px"><span style="width:4px;height:14px;background:#FFD23F"></span><span style="width:4px;height:14px;background:#FFD23F"></span></button>
    <button aria-label="Vague suivante" style="width:44px;height:44px;border:3px solid #2A1E16;border-radius:3px;background:#FFD23F;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M7 3l6 6-6 6" fill="none" stroke="#2A1E16" stroke-width="3" stroke-linecap="square"/></svg></button>
    <div role="img" aria-label="Avancement : vague 3 sur 12" style="flex:1;height:14px;border:3px solid #2A1E16;background:linear-gradient(90deg,#2A1E16 25%,#FFF6E0 25%)"></div>
    <span style="font-size:12px;font-weight:700;max-width:200px;line-height:1.2">Ta pire place : les pics du milieu (4 morts)</span>
    <button style="height:44px;padding:0 14px;border:3px solid #2A1E16;border-radius:3px;background:transparent;font-weight:700;font-size:13px">Fermer</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [
      [160,300,-20],[172,290,15],[184,305,40],[150,270,-35],[190,282,60],[168,250,10],[178,320,-10],
      [290,298,25],[300,286,-15],[312,304,50],[284,268,-40],[318,276,20],[296,240,5],
      [418,300,-25],[430,288,30],[442,306,-50],[424,262,15],[448,280,-5],
      [708,120,35],[722,98,-20],[736,132,10],[714,146,-45],[728,86,25],[742,108,-30],[700,96,60],
      [760,300,10],[772,320,-15],[660,330,20],[645,300,-25]
    ];
    const fantomes = pts.map(([x, y, r], i) => ({
      style: 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:14px;height:14px;box-sizing:border-box;background:' + (i % 5 === 0 ? '#FFD23F' : '#FFF6E0') + ';border:2px solid #2A1E16;transform:rotate(' + r + 'deg)'
    }));
    return { fantomes };
  }
}
</script>
</body>
</html>
