<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Track — Réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&amp;display=swap">
<style>
body{margin:0}
a{color:#F4EFE6}a:hover{color:#FF8A5C}
button{font:inherit;cursor:pointer}
input[type=range]{accent-color:#E8552D}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EDE3CF;color:#2A1E16;font-family:Archivo, sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px">
    <a href="track.html" style="height:44px;display:flex;align-items:center;gap:6px;text-decoration:none;color:#2A1E16;font-family:'Archivo Black', sans-serif;font-size:14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#2A1E16" stroke-width="2.5" stroke-linecap="square"/></svg>TRACK</a>
    <span style="font-family:'JetBrains Mono', monospace;font-weight:700;font-size:12px">Mar. 20 oct. · n° 8</span>
  </header>

  <main style="flex:1;margin:0 10px 10px;background:#1E1B19;color:#F4EFE6;border:3px solid #2A1E16;border-radius:10px 10px 4px 4px;box-shadow:4px 4px 0 #2A1E16;padding:14px 14px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden">
    <div aria-hidden="true" style="position:absolute;right:-30px;top:0;width:120px;height:70px;background:repeating-linear-gradient(115deg,#E8552D 0 10px,transparent 10px 18px)"></div>
    <h1 style="position:relative;margin:0;font-family:'Barlow Condensed', sans-serif;font-style:italic;font-weight:800;font-size:46px;line-height:.9">RÉGLAGES</h1>

    <section style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px;color:#CFC6BA">SON</h2>
      <label style="display:grid;grid-template-columns:80px minmax(0, 1fr) 36px;align-items:center;gap:8px;min-height:44px;font-size:14px">Moteur<input type="range" min="0" max="100" value="70" style="width:100%"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;text-align:right">70</span></label>
      <label style="display:grid;grid-template-columns:80px minmax(0, 1fr) 36px;align-items:center;gap:8px;min-height:44px;font-size:14px">Effets<input type="range" min="0" max="100" value="85" style="width:100%"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;text-align:right">85</span></label>
    </section>

    <section style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px;color:#CFC6BA">CAMÉRA</h2>
      <div role="group" aria-label="Caméra" style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));border:2px solid #5A524C;border-radius:3px;overflow:hidden">
        <button aria-pressed="false" style="height:44px;border:0;background:transparent;color:#F4EFE6;font-family:'Barlow Condensed', sans-serif;font-style:italic;font-weight:700;font-size:18px">LOIN</button>
        <button aria-pressed="true" style="height:44px;border:0;background:#E8552D;color:#1E1B19;font-family:'Barlow Condensed', sans-serif;font-style:italic;font-weight:800;font-size:18px">PROCHE</button>
        <button aria-pressed="false" style="height:44px;border:0;background:transparent;color:#F4EFE6;font-family:'Barlow Condensed', sans-serif;font-style:italic;font-weight:700;font-size:18px">CAPOT</button>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px;color:#CFC6BA">COMMANDES TACTILES</h2>
      <div role="group" aria-label="Disposition" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));border:2px solid #5A524C;border-radius:3px;overflow:hidden">
        <button aria-pressed="true" style="height:44px;border:0;background:#E8552D;color:#1E1B19;font-weight:700;font-size:13px">Direction à gauche</button>
        <button aria-pressed="false" style="height:44px;border:0;background:transparent;color:#F4EFE6;font-weight:600;font-size:13px">Direction à droite</button>
      </div>
    </section>

    <section style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px;color:#CFC6BA">LANGUE</h2>
      <div role="group" aria-label="Langue" style="display:flex;border:2px solid #F4EFE6;border-radius:4px;overflow:hidden">
        <button aria-pressed="true" style="width:52px;height:44px;border:0;background:#F4EFE6;color:#1E1B19;font-weight:700;font-size:13px">FR</button>
        <button aria-pressed="false" style="width:52px;height:44px;border:0;background:transparent;color:#F4EFE6;font-weight:700;font-size:13px">EN</button>
      </div>
    </section>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid #4A4440;padding-top:6px">
      <a href="#" style="min-height:44px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-weight:700;font-size:15px">Mon profil Du Jour<svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18"><path d="M7 3l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg></a>
      <a href="#" style="min-height:44px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-size:14px;color:#CFC6BA">Mentions légales<svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18"><path d="M7 3l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg></a>
    </div>
  </main>
</div>
</x-dc>

</body>
</html>
