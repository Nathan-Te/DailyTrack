<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Jump — Réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Lilita+One&amp;display=swap">
<style>
body{margin:0}
a{color:#2A1E16}
button{font:inherit;cursor:pointer}
input[type=range]{accent-color:#2A1E16}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EDE3CF;color:#2A1E16;font-family:Archivo, sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px">
    <a href="jump.html" style="height:44px;display:flex;align-items:center;gap:6px;text-decoration:none;font-family:'Archivo Black', sans-serif;font-size:14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="#2A1E16" stroke-width="2.5" stroke-linecap="square"/></svg>JUMP</a>
    <span style="font-family:'JetBrains Mono', monospace;font-weight:700;font-size:12px">Mar. 20 oct. · n° 5</span>
  </header>

  <main style="flex:1;margin:0 10px 10px;background:#FFD23F;border:3px solid #2A1E16;border-radius:10px 10px 4px 4px;box-shadow:4px 4px 0 #2A1E16;padding:14px 14px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <h1 style="margin:0;font-family:'Lilita One', sans-serif;font-weight:400;font-size:44px;line-height:.95;text-shadow:3px 3px 0 #FFF6E0">RÉGLAGES</h1>

    <section style="display:flex;flex-direction:column;gap:4px">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px">SON</h2>
      <label style="display:grid;grid-template-columns:80px minmax(0, 1fr) 36px;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600">Musique<input type="range" min="0" max="100" value="60" style="width:100%"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;text-align:right">60</span></label>
      <label style="display:grid;grid-template-columns:80px minmax(0, 1fr) 36px;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600">Effets<input type="range" min="0" max="100" value="90" style="width:100%"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;text-align:right">90</span></label>
    </section>

    <section style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px">FANTÔME DU PREMIER</h2>
      <div role="group" aria-label="Fantôme" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));border:3px solid #2A1E16;border-radius:3px;overflow:hidden">
        <button aria-pressed="true" style="height:44px;border:0;background:#2A1E16;color:#FFD23F;font-family:'Lilita One', sans-serif;font-size:18px">Montrer</button>
        <button aria-pressed="false" style="height:44px;border:0;background:#FFF6E0;font-family:'Lilita One', sans-serif;font-size:18px">Cacher</button>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px">COMMANDES TACTILES</h2>
      <div role="group" aria-label="Disposition" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));border:3px solid #2A1E16;border-radius:3px;overflow:hidden">
        <button aria-pressed="true" style="height:44px;border:0;background:#2A1E16;color:#FFD23F;font-weight:700;font-size:13px">Saut à droite</button>
        <button aria-pressed="false" style="height:44px;border:0;background:#FFF6E0;font-weight:700;font-size:13px">Saut à gauche</button>
      </div>
    </section>

    <section style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px">LANGUE</h2>
      <div role="group" aria-label="Langue" style="display:flex;border:3px solid #2A1E16;border-radius:4px;overflow:hidden">
        <button aria-pressed="true" style="width:52px;height:44px;border:0;background:#2A1E16;color:#FFD23F;font-weight:700;font-size:13px">FR</button>
        <button aria-pressed="false" style="width:52px;height:44px;border:0;background:#FFF6E0;font-weight:700;font-size:13px">EN</button>
      </div>
    </section>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:3px solid #2A1E16;padding-top:6px">
      <a href="#" style="min-height:44px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-family:'Lilita One', sans-serif;font-size:19px">Mon profil Du Jour<svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18"><path d="M7 3l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></a>
      <a href="#" style="min-height:44px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-size:14px;font-weight:600">Mentions légales<svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18"><path d="M7 3l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg></a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
