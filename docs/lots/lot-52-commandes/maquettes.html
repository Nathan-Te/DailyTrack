     @cdj/ui et de apps/web ; ouvrir le fichier depuis le dépôt (chemins relatifs). ?l=en pour l'anglais, ou le bouton FR / EN. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Archivo+Black&amp;family=JetBrains+Mono:wght@500;700&amp;family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&amp;display=swap">

<style>
/* La planche n'est pas le jeu : on rend le défilement à la page (interface.css le coupe) et on garde les composants du jeu tels quels. */
html, body { height: auto; overflow: auto; touch-action: auto; user-select: text; -webkit-user-select: text; background: var(--dj-creme); color: var(--dj-encre); }
body { padding-block: 0 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--dj-police-texte); }
body > .page { visibility: visible !important; }
.page { max-width: 1800px; margin: 0 auto; }
header.planche { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; padding: 28px 0 8px; border-bottom: 3px solid var(--dj-encre); }
header.planche h1 { font-family: var(--dj-police-marque); font-size: 30px; line-height: 1; text-transform: uppercase; }
header.planche p { max-width: 900px; font-size: 14px; color: var(--dj-encre-douce); }
.langue { margin-left: auto; display: flex; border: 3px solid var(--dj-encre); border-radius: 3px; overflow: hidden; }
.langue button { min-height: 44px; min-width: 56px; border: 0; background: var(--dj-papier); font-weight: 700; }
.langue button[aria-pressed="true"] { background: var(--dj-encre); color: var(--dj-papier); }
h2.section { margin: 40px 0 4px; font-family: var(--dj-police-marque); font-size: 22px; text-transform: uppercase; }
h2.section small { display: block; margin-top: 4px; font-family: var(--dj-police-texte); font-size: 13px; font-weight: 400; text-transform: none; color: var(--dj-encre-douce); }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(852px, 100%), 1fr)); gap: 28px 24px; margin-top: 16px; }
.grille--moyenne { grid-template-columns: repeat(auto-fill, minmax(446px, 1fr)); }
.grille--petite { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
figure { margin: 0; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
figcaption { max-width: 844px; margin-top: 8px; font-size: 13px; }
figcaption b { font-family: var(--dj-police-marque); font-size: 14px; }
figcaption ol { margin: 6px 0 0; padding-left: 20px; color: var(--dj-encre-douce); }
.puce { display: inline-block; margin-left: 6px; padding: 1px 6px; border: 2px solid var(--dj-encre); border-radius: 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: var(--dj-moutarde); }
.puce--inchange { background: var(--dj-papier); }
.puce--nouveau { background: var(--dj-diamant); }

/* --- Un écran de téléphone en paysage (844 × 390) ---------------------------------------------------------------------------------------------- */
.ecran { position: relative; width: 844px; height: 390px; overflow: hidden; background: var(--track-asphalte); color: var(--track-texte); font-family: var(--dj-police-texte); border: 3px solid var(--dj-encre); border-radius: 22px; box-sizing: content-box; }
.ecran--mini { width: 400px; height: 300px; border-radius: 14px; }
.ecran > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.ecran .cadre { position: absolute; z-index: 1; padding: 10px; }
.abs { position: absolute; }
.pl { background: var(--track-asphalte); color: var(--track-texte); border: var(--dj-trait) solid var(--dj-encre); border-radius: var(--dj-rayon-bouton); box-shadow: 2px 2px 0 var(--dj-encre); }
.btn44 { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 3px; box-shadow: none; }
.bande { display: flex; align-items: stretch; height: 30px; border: 2px solid var(--dj-encre); border-radius: 2px; box-shadow: 2px 2px 0 var(--dj-encre); overflow: hidden; font-family: var(--track-police); font-style: italic; }
.bande .chrono { position: relative; display: flex; align-items: center; background: var(--track-asphalte); padding: 0 14px 0 10px; font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.bande .chrono::after { content: ""; position: absolute; right: -3px; top: 0; bottom: 0; width: 9px; background: repeating-linear-gradient(115deg, var(--track-livree) 0 3px, transparent 3px 5px); }
.bande .pc { display: flex; align-items: center; padding: 0 7px; background: var(--track-texte); color: var(--track-asphalte); font-weight: 700; font-size: 16px; }
.bande .ecart { display: flex; align-items: center; padding: 0 8px; background: var(--track-livree); color: var(--track-asphalte); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.pastille { height: 30px; display: flex; align-items: center; gap: 5px; padding: 0 7px; font-size: 11px; font-weight: 700; font-family: var(--dj-police-chiffres); }
.rang { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px; font-family: var(--track-police); font-style: italic; font-weight: 800; font-size: 18px; }
.ligne-aide { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--track-texte-doux); white-space: nowrap; }
.vitesse { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 0 8px; font-family: var(--track-police); font-style: italic; font-weight: 800; font-size: 16px; line-height: 1.4; }
.annonce { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); font-family: var(--track-police); font-style: italic; font-weight: 800; font-size: 72px; line-height: 1; text-shadow: 4px 4px 0 var(--dj-encre); text-transform: uppercase; white-space: nowrap; }

/* --- Commandes de course -------------------------------------------------------------------------------------------------------------------------- */
.tbtn { position: absolute; display: flex; align-items: center; justify-content: center; font-family: var(--track-police); font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
.tbtn.gaz { background: var(--track-livree); color: var(--track-asphalte); box-shadow: 2px 2px 0 var(--track-livree-ombre); font-size: 22px; }
.tbtn.on { background: var(--track-livree); color: var(--track-asphalte); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dj-encre); }
.tbtn.gaz.on { background: var(--track-livree-texte); box-shadow: 1px 1px 0 var(--track-livree-ombre); }
/* glissière */
.glis { position: absolute; }
.glis .rail { position: absolute; left: 14px; right: 14px; top: 50%; height: 8px; margin-top: -4px; background: var(--track-piste); border: 2px solid var(--dj-encre); border-radius: 4px; }
.glis .gr { position: absolute; top: 50%; width: 2px; height: 12px; margin: -6px 0 0 -1px; background: var(--track-route); }
.glis .gr.c { height: 26px; margin-top: -13px; width: 4px; margin-left: -2px; background: var(--track-livree); }
.glis .fl { position: absolute; top: 50%; margin-top: -8px; color: var(--track-texte-doux); }
.glis .pouce { position: absolute; top: 6px; bottom: 6px; width: 56px; margin-left: -28px; display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--track-livree); color: var(--track-asphalte); border: var(--dj-trait) solid var(--dj-encre); border-radius: var(--dj-rayon-bouton); box-shadow: 2px 2px 0 var(--track-livree-ombre); }
.glis .pouce i { width: 3px; height: 22px; background: var(--track-asphalte); }
.glis .pouce.on { background: var(--track-livree-texte); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--track-livree-ombre); }
/* volant */
.volant { position: absolute; }
.volant svg { display: block; overflow: visible; }
/* jauge d'inclinaison */
.jauge { position: absolute; bottom: 8px; height: 26px; width: 96px; }
.jauge .gr { position: absolute; top: 50%; width: 2px; height: 8px; margin: -4px 0 0 -1px; background: var(--track-route); }
.jauge .gr.c { height: 16px; margin-top: -8px; background: var(--track-texte-doux); }
.jauge .zm { position: absolute; top: 4px; bottom: 4px; background: var(--track-coque); }
.jauge .cur { position: absolute; top: 3px; bottom: 3px; width: 6px; margin-left: -3px; background: var(--track-livree); border: 1px solid var(--dj-encre); }
.jauge .etat { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--track-police); font-style: italic; font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; background: var(--track-asphalte); }
/* doigt (annotation de la maquette : le vrai jeu ne dessine rien sous le doigt) */
.doigt { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 3px solid var(--track-texte); border-radius: 50%; background: var(--track-texte); opacity: .55; pointer-events: none; z-index: 3; }
.zone { position: absolute; border: 2px dashed var(--track-texte-doux); border-radius: 6px; pointer-events: none; font-size: 10px; font-weight: 700; color: var(--track-texte-doux); padding: 2px 5px; text-transform: uppercase; }
.num { position: absolute; z-index: 4; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--dj-moutarde); color: var(--dj-encre); border: 2px solid var(--dj-encre); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

/* --- Réglages et dialogues dans les cadres ----------------------------------------------------------------------------------------------------- */
.ecran .etiquette { width: 100%; max-height: 100%; }
.reglages__tabs { margin-bottom: 4px; }
.ecran .reglage__titre, .large .reglage__titre { font-size: 14px; }
.nouveau { display: inline-block; margin-left: 6px; padding: 0 5px; border: 2px solid var(--dj-encre); border-radius: 2px; background: var(--dj-diamant); color: var(--dj-diamant-texte); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; vertical-align: middle; }
.carte { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 2px solid var(--track-route); border-radius: 3px; background: var(--track-piste); font-size: 13px; }
.carte svg { flex: none; }
.carte p { margin: 0; }
.carte .petit { margin-top: 4px; font-size: 12px; color: var(--track-texte-doux); }
.carte--ok { border-color: var(--track-texte-doux); }
.carte--refus { border-color: var(--track-livree); }
.carte .dj-bouton { margin-top: 8px; min-height: 44px; }
.essai { position: relative; height: 34px; border: 2px solid var(--track-route); border-radius: 3px; background: var(--track-piste); }
.essai .gr { position: absolute; top: 50%; width: 2px; height: 10px; margin: -5px 0 0 -1px; background: var(--track-route); }
.essai .gr.c { height: 20px; margin-top: -10px; background: var(--track-texte-doux); }
.essai .zm { position: absolute; top: 5px; bottom: 5px; background: var(--track-coque); }
.essai .cur { position: absolute; top: 4px; bottom: 4px; width: 8px; margin-left: -4px; background: var(--track-livree); border: 2px solid var(--dj-encre); }
.essai small { position: absolute; right: 6px; top: -18px; font-family: var(--dj-police-chiffres); font-size: 11px; color: var(--track-texte-doux); }
.systeme { position: absolute; left: 50%; top: 50%; width: 270px; transform: translate(-50%, -50%); padding: 16px 14px 0; background: var(--dj-papier); color: var(--dj-encre); border: 2px solid var(--dj-encre); border-radius: 14px; font-family: -apple-system, "Segoe UI", sans-serif; text-align: center; z-index: 5; }
.systeme b { display: block; font-size: 15px; margin-bottom: 4px; }
.systeme p { margin: 0 0 12px; font-size: 12px; color: var(--dj-encre-douce); }
.systeme .deux { display: flex; margin: 0 -14px; border-top: 1px solid var(--dj-creme-2); }
.systeme .deux span { flex: 1; padding: 11px 0; font-size: 15px; color: #1a62d6; }
.systeme .deux span + span { border-left: 1px solid var(--dj-creme-2); font-weight: 700; }
.voile-scene { position: absolute; inset: 0; background: var(--cadre-voile); z-index: 4; }
.etat-btn { display: flex; flex-direction: column; gap: 4px; }
.barre-progres { height: 6px; border: 2px solid var(--dj-encre); background: var(--track-piste); }
.barre-progres i { display: block; height: 100%; width: 60%; background: var(--track-livree); }

/* --- Tableaux et notes -------------------------------------------------------------------------------------------------------------------------------- */
table.tab { width: 100%; max-width: 1100px; border-collapse: collapse; margin-top: 12px; font-size: 13px; background: var(--dj-papier); border: 2px solid var(--dj-encre); }
table.tab th, table.tab td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--dj-creme-2); vertical-align: top; }
table.tab th { background: var(--dj-encre); color: var(--dj-papier); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
ul.decisions { max-width: 1000px; margin: 12px 0 0; padding-left: 20px; font-size: 14px; }
ul.decisions li { margin-bottom: 8px; }
.cadran { display: block; background: var(--dj-papier); border: 2px solid var(--dj-encre); }
</style>
</head>

/** Une pédale (position absolue dans l'écran). */
const pedale = (nom, x, y, w, h, on) => `<div class="pl tbtn ${nom === "gaz" ? "gaz" : ""} ${on ? "on" : ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${t(nom === "gaz" ? "ped_gaz" : "ped_frein")}</div>`;

/**
 * Pédales selon la disposition : `droite` = frein 64×56 et gaz 84×84 groupés à droite (aujourd'hui) ; `gauche` = leur image dans un miroir ; `scindees` = frein à gauche (72×72),
 * gaz à droite ; `scindees-inv` = gaz à gauche, frein à droite.
 */
function pedales(disp, { gaz = false, frein = false } = {}) {
  const m = 12, g = 84, bw = 64, bh = 56, b2 = 72;
  const bas = H - m;
  if (disp === "droite") return pedale("gaz", W - m - g, bas - g, g, g, gaz) + pedale("frein", W - m - g - 8 - bw, bas - bh, bw, bh, frein);
  if (disp === "gauche") return pedale("gaz", m, bas - g, g, g, gaz) + pedale("frein", m + g + 8, bas - bh, bw, bh, frein);
  if (disp === "scindees") return pedale("frein", m, bas - b2, b2, b2, frein) + pedale("gaz", W - m - g, bas - g, g, g, gaz);
  return pedale("gaz", m, bas - g, g, g, gaz) + pedale("frein", W - m - b2, bas - b2, b2, b2, frein);
}

function boutons(cote, { gauche = false, droite = false } = {}) {
  const a = 72, m = 12, x0 = cote === "gauche" ? m : W - m - 2 * a - 8, y = H - m - a;
  return `<div class="pl tbtn ${gauche ? "on" : ""}" style="left:${x0}px;top:${y}px;width:${a}px;height:${a}px">${fleche("M19 5 9 15l10 10")}</div>
          <div class="pl tbtn ${droite ? "on" : ""}" style="left:${x0 + a + 8}px;top:${y}px;width:${a}px;height:${a}px">${fleche("M11 5l10 10-10 10")}</div>`;
}

/** Glissière : `pos` ∈ [-1, 1]. Taille moyenne : 236 × 64. */
function glissiere(cote, pos, { on = false, w = 236, h = 64 } = {}) {
  const x = cote === "gauche" ? 12 : W - 12 - w;
  const y = H - 12 - h;
  const ticks = Array.from({ length: 9 }, (_, i) => `<i class="gr ${i === 4 ? "c" : ""}" style="left:${14 + (i / 8) * (w - 28)}px"></i>`).join("");
  const course = (w - 28) / 2 - 20;
  const px = w / 2 + pos * course;
  return `<div class="pl glis" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <span class="fl" style="left:5px">${fleche("M19 5 9 15l10 10").replace('width="26" height="26"', 'width="14" height="14"')}</span>
    <span class="fl" style="right:5px">${fleche("M11 5l10 10-10 10").replace('width="26" height="26"', 'width="14" height="14"')}</span>
    <div class="rail"></div>${ticks}
    <div class="pouce ${on ? "on" : ""}" style="left:${px}px"><i></i><i></i><i></i></div>
  </div>`;
}

/** Volant en SVG (viewBox 160). `deg` : rotation de la jante ; `max` : butoir marqué en dehors ; `size` : px. */
function volantSvg(size, deg, { max = 90, on = false, trace = [] } = {}) {
  const pol = (a, r) => [80 + r * Math.sin((a * Math.PI) / 180), 80 - r * Math.cos((a * Math.PI) / 180)];
  let reperes = "";
  for (let a = -max; a <= max; a += 15) {
    const [x1, y1] = pol(a, 70), [x2, y2] = pol(a, a === -max || a === max ? 79 : 75);
    const fort = a === -max || a === max;
    reperes += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${fort ? "var(--track-texte)" : "var(--track-route)"}" stroke-width="${fort ? 4 : 2}"/>`;
  }
  const hubFill = on ? "var(--track-livree-texte)" : "var(--track-livree)";
  const roue = (d, opacite = 1) => `<g transform="rotate(${d} 80 80)" opacity="${opacite}">
      <g stroke-linecap="butt">
        <line x1="80" y1="80" x2="22" y2="80" stroke="var(--dj-encre)" stroke-width="14"/><line x1="80" y1="80" x2="138" y2="80" stroke="var(--dj-encre)" stroke-width="14"/><line x1="80" y1="80" x2="80" y2="138" stroke="var(--dj-encre)" stroke-width="14"/>
        <line x1="80" y1="80" x2="22" y2="80" stroke="var(--track-coque)" stroke-width="8"/><line x1="80" y1="80" x2="138" y2="80" stroke="var(--track-coque)" stroke-width="8"/><line x1="80" y1="80" x2="80" y2="138" stroke="var(--track-coque)" stroke-width="8"/>
      </g>
      <circle cx="80" cy="80" r="58" fill="none" stroke="var(--dj-encre)" stroke-width="22"/>
      <circle cx="80" cy="80" r="58" fill="none" stroke="${on ? "var(--track-texte-doux)" : "var(--track-coque)"}" stroke-width="16"/>
      <rect x="74" y="14" width="12" height="16" fill="var(--track-livree)" stroke="var(--dj-encre)" stroke-width="2"/>
      <circle cx="80" cy="80" r="17" fill="var(--track-asphalte)" stroke="var(--dj-encre)" stroke-width="3"/>
      <circle cx="80" cy="80" r="7" fill="${hubFill}"/>
    </g>`;
  const [ix, iy] = pol(0, 80);
  return `<svg width="${size}" height="${size}" viewBox="0 0 160 160" aria-hidden="true">
    ${reperes}
    <path d="M${ix - 7} ${iy - 6} L${ix + 7} ${iy - 6} L${ix} ${iy + 9} Z" fill="var(--track-livree)" stroke="var(--dj-encre)" stroke-width="2" transform="translate(0 6)"/>
    ${trace.map((d, i) => `<rect x="74" y="14" width="12" height="16" fill="var(--track-livree)" opacity="${0.3 + 0.2 * i}" transform="rotate(${d} 80 80)"/>`).join("")}
    ${roue(deg)}
  </svg>`;
}

function volant(cote, deg, { on = false, max = 90, size = 140, trace = [] } = {}) {
  const x = cote === "gauche" ? 12 : W - 12 - size;
  const y = H - 12 - size;
  return `<div class="volant" style="left:${x}px;top:${y}px">${volantSvg(size, deg, { on, max, trace })}</div>`;
}

/** Position du doigt sur la jante du volant (annotation). */
function doigtVolant(cote, deg, size = 140, rayon = 58) {
  const x0 = cote === "gauche" ? 12 : W - 12 - size, y0 = H - 12 - size, k = size / 160;
  const a = ((deg + 0) * Math.PI) / 180; // la marque de livrée est en haut ; le doigt la tient
  return `<div class="doigt" style="left:${x0 + (80 + rayon * Math.sin(a)) * k}px;top:${y0 + (80 - rayon * Math.cos(a)) * k}px"></div>`;
}

/** Jauge d'inclinaison à côté de la vitesse. `pos` ∈ [-1, 1] ; `etat` : texte à la place du curseur. */
function jauge(pos, etat = "") {
  const x = W / 2 - 50 - 8 - 96 + 0; // à gauche de la plaque de vitesse (≈ 100 px de large)
  const zm = 5; // zone morte, en %
  return `<div class="pl jauge" style="left:${x}px">
    <i class="zm" style="left:${50 - zm / 2}%;width:${zm}%"></i>
    ${Array.from({ length: 9 }, (_, i) => `<i class="gr ${i === 4 ? "c" : ""}" style="left:${6 + (i / 8) * 84}px"></i>`).join("")}
    ${etat ? `<span class="etat">${etat}</span>` : `<i class="cur" style="left:${48 + pos * 38}px"></i>`}
  </div>`;
}

const zone = (x, y, w, h, texte) => `<div class="zone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${texte}</div>`;
const num = (n, x, y) => `<span class="num" style="left:${x}px;top:${y}px">${n}</span>`;
const doigt = (x, y) => `<div class="doigt" style="left:${x}px;top:${y}px"></div>`;

function ecran(contenu, cls = "") {
  return `<div class="ecran ${cls}"><svg class="scene" aria-hidden="true"><use href="#scene"/></svg>${contenu}</div>`;
}
function figure(titre, puce, ecranHtml, notes = []) {
  return `<figure>${ecranHtml}<figcaption><b>${titre}</b>${puce ? ` <span class="puce ${puce[0]}">${puce[1]}</span>` : ""}${notes.length ? `<ol>${notes.map((n) => `<li>${n}</li>`).join("")}</ol>` : ""}</figcaption></figure>`;
}
const P_NOUVEAU = ["puce--nouveau", () => t("n_titre")];
const puce = (p) => (p ? [p[0], typeof p[1] === "function" ? p[1]() : p[1]] : null);

// ---------------------------------------------------------------------------------------------------------------------------------------------------
// Réglages (réutilise les classes du jeu : .etiquette, .segment, .curseur, .reglage)
// ---------------------------------------------------------------------------------------------------------------------------------------------------
const seg = (options, actif) => `<div class="segment" role="radiogroup">${options.map(([k, l]) => `<button class="segment__bouton" type="button" role="radio" aria-checked="${k === actif}">${l}</button>`).join("")}</div>`;
const curseur = (min, max, val, texte) => `<div class="curseur"><input type="range" min="${min}" max="${max}" value="${val}" step="any" tabindex="-1"><span class="curseur__valeur">${texte}</span></div>`;
const ligne = (titre, ctrl, aide = "", nouveau = false) => `<div class="reglage"><div><div class="reglage__titre">${titre}${nouveau ? `<span class="nouveau">${t("n_titre")}</span>` : ""}</div>${aide ? `<div class="reglage__aide">${aide}</div>` : ""}</div><div>${ctrl}</div></div>`;
const oui = (actif) => seg([[true, t("r_oui")], [false, t("r_non")]], actif);

const MODES = () => [["boutons", t("m_boutons")], ["glissiere", t("m_glissiere")], ["volant", t("m_volant")], ["gyro", t("m_gyro")]];
const TAILLES = () => [["s", lang === "fr" ? "Petits" : "Small"], ["m", lang === "fr" ? "Moyens" : "Medium"], ["l", lang === "fr" ? "Grands" : "Large"]];

function essai(pos, texte) {
  return `<div class="essai"><small>${texte}</small><i class="zm" style="left:47.5%;width:5%"></i>${Array.from({ length: 9 }, (_, i) => `<i class="gr ${i === 4 ? "c" : ""}" style="left:${(i / 8) * 100}%"></i>`).join("")}<i class="cur" style="left:${50 + pos * 46}%"></i></div>`;
}
function carteAutorisation(etat) {
  if (etat === "a") return `<div class="carte">${ICONE_TELEPHONE}<div><p>${t("a_1_txt")}</p><p class="petit">${t("a_1_petit")}</p><button class="dj-bouton dj-bouton--track" type="button">${t("a_1_btn")}</button></div></div>`;
  if (etat === "ok") return `<div class="carte carte--ok">${ICONE_TELEPHONE}<div><p>${t("a_3_txt")}</p><p class="petit">${t("a_3_petit")}</p></div></div>`;
  if (etat === "refus") return `<div class="carte carte--refus">${ICONE_TELEPHONE}<div><p>${t("a_4_txt")}</p><p class="petit">${t("a_4_petit")}</p></div></div>`;
  return `<div class="carte carte--refus">${ICONE_TELEPHONE}<div><p>${t("a_5_txt")}</p><p class="petit">${t("a_5_petit")}</p></div></div>`;
}

/** Les lignes de Réglages › Commandes pour un mode. */
function reglagesMode(mode, { autorisation = "ok", modeChoisi = mode } = {}) {
  const rows = [ligne(t("r_nom_dir"), seg(MODES(), modeChoisi), t("r_aide_dir"))];
  if (mode === "boutons") rows.push(ligne(t("r_taille"), seg(TAILLES(), "m"), t("r_taille_aide")));
  if (mode === "glissiere") rows.push(ligne(t("r_taille"), seg(TAILLES(), "m"), t("r_taille_aide")), ligne(t("r_sens"), curseur(0.5, 2, 1, "×1"), t("r_sens_aide")), ligne(t("r_zm"), curseur(0, 30, 8, "8 %")));
  if (mode === "volant") rows.push(ligne(t("r_taille"), seg(TAILLES(), "m"), t("r_taille_aide")), ligne(t("r_angle"), seg([[90, "90°"], [135, "135°"]], 90), t("r_angle_aide"), true), ligne(t("r_zm"), curseur(0, 30, 6, "6 %")));
  if (mode === "gyro") {
    rows.push(`<div class="reglage" style="grid-template-columns:1fr">${carteAutorisation(autorisation === "ok" ? "ok" : autorisation)}</div>`);
    if (autorisation === "ok") {
      rows.push(
        ligne(t("r_essai"), essai(0.35, "+12°"), t("r_essai_aide"), true),
        ligne(t("r_sens"), curseur(0.5, 2, 1, "×1"), t("r_sens_gyro_aide") + "35°"),
        ligne(t("r_zm"), curseur(0, 30, 5, "5 %")),
        ligne(t("r_filtre"), `<span style="font-size:13px;color:var(--track-texte-doux)">≈ 30 ms</span>`, t("r_filtre_aide")),
        ligne(t("r_jauge"), oui(true)),
        ligne(t("r_recentrer"), `<button class="dj-bouton dj-bouton--secondaire" type="button">${t("r_recentrer")}</button>`, t("r_recentrer_aide")),
      );
    }
  }
  rows.push(ligne(t("r_inv"), oui(false), t("r_inv_aide"), true), ligne(t("r_acc"), seg([[false, t("r_acc_bouton")], [true, t("r_acc_auto")]], false)), ligne(t("r_vib"), oui(true)), `<button class="dj-bouton dj-bouton--secondaire" type="button" style="align-self:flex-start">${t("r_reinit")}</button>`);
  return `<div class="reglages__tactile-liste">${rows.join("")}</div>`;
}

function cadreReglages(corps, { hauteur = null, decalage = 0 } = {}) {
  return `<div class="etiquette dj-sombre" style="${hauteur ? `max-height:${hauteur}px` : ""}"><div class="etiquette__corps" style="overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:-${decalage}px">
    <div class="etiquette__tete"><h1 class="etiquette__titre">${t("r_titre")}</h1></div>
    <div class="segment reglages__tabs">${[["g", t("t_graph")], ["s", t("t_son")], ["j", t("t_jeu")], ["c", t("t_cmd")]].map(([k, l]) => `<button class="segment__bouton" type="button" role="tab" aria-selected="${k === "c"}">${l}</button>`).join("")}</div>
    ${corps}</div></div></div>`;
}
function barreJeu() {
  return `<div class="pl" style="background:var(--dj-creme);color:var(--dj-encre);display:flex;align-items:center;min-height:44px;padding:0 12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;width:100%;border-radius:3px">${t("retour")}</div>`;
}
function ecranReglages(corps, { decalage = 0 } = {}) {
  return ecran(`<div class="cadre" style="justify-content:flex-start;gap:6px;padding:8px 10px">${barreJeu()}${cadreReglages(corps, { hauteur: 316, decalage })}</div>`);
}

// ---------------------------------------------------------------------------------------------------------------------------------------------------
// Pause
// ---------------------------------------------------------------------------------------------------------------------------------------------------
function dialoguePause(etat) {
  const recentrer = etat === "normal" ? `<button class="dj-bouton dj-bouton--secondaire" type="button" style="grid-column:1/-1;border-color:var(--track-livree-texte)">${ICONE_TELEPHONE.replace('width="40" height="40"', 'width="22" height="22"')}${t("p_recentrer")}<span class="nouveau">${t("n_titre")}</span></button>` :
    etat === "cours" ? `<div style="grid-column:1/-1" class="etat-btn"><button class="dj-bouton dj-bouton--secondaire" type="button" disabled>${t("p_enc")}</button><div class="barre-progres"><i></i></div></div>` :
    `<button class="dj-bouton dj-bouton--secondaire" type="button" style="grid-column:1/-1">✓ ${t("p_fait")}</button>`;
  return `<div class="voile-scene"></div><section class="dialogue dj-sombre" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:410px;z-index:5;display:block;background:var(--track-asphalte);border:3px solid var(--dj-encre);border-radius:var(--dj-rayon-coque);box-shadow:var(--dj-ombre-cartouche);overflow:hidden">
    <div class="dialogue__corps" style="padding:14px 16px;position:relative">
      <h2 class="dialogue__titre" style="font-family:var(--track-police);font-style:italic;font-weight:800;text-transform:uppercase;font-size:32px;margin-bottom:8px">${t("p_pause")}</h2>
      <div class="pause__menu" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        <button class="dj-bouton dj-bouton--track" type="button" style="grid-column:1/-1;width:100%">${t("p_reprendre")}</button>
        ${recentrer}
        <button class="dj-bouton dj-bouton--secondaire" type="button">${t("p_recommencer")}</button>
        <button class="dj-bouton dj-bouton--secondaire" type="button">${t("p_pdc")}</button>
        <button class="dj-bouton dj-bouton--secondaire" type="button">${t("p_camera")}</button>
        <button class="dj-bouton dj-bouton--secondaire" type="button">${t("p_reglages")}</button>
      </div></div></section>`;
}

// ---------------------------------------------------------------------------------------------------------------------------------------------------
// Planche
// ---------------------------------------------------------------------------------------------------------------------------------------------------
function section1() {
  const bas = H - 12;
  const f1 = ecran(hud({ aide: t("aide_boutons") }) + boutons("gauche") + pedales("droite"));
  const f2 = ecran(
    hud({ aide: t("aide_glissiere") }) + glissiere("gauche", -0.55, { on: true }) + pedales("droite", { gaz: true }) +
      zone(0, 60, 253, 330, lang === "fr" ? "zone de toucher · tiers gauche" : "touch zone · left third") + doigt(98, bas - 32) + num(1, 12, bas - 70) + num(2, 130, 150) + num(3, 118, bas - 4),
  );
  const f3 = ecran(
    hud({ aide: t("aide_volant") }) + volant("gauche", -62, { on: true }) + doigtVolant("gauche", -62) + pedales("droite", { gaz: true }) + num(1, 82, bas - 148) + num(2, 36, bas - 90) + num(3, 150, bas - 124),
  );
  const f4 = ecran(
    hud({ aide: t("aide_gyro") }) + jauge(0.4) + pedales("scindees", { gaz: true }) + num(1, 106, bas - 100) + num(2, W / 2 - 140, bas - 40) + num(3, W - 60, bas - 100),
  );
  const f5 = ecran(hud({ aide: t("aide_inv") }) + volant("droite", 48, { on: true }) + doigtVolant("droite", 48) + pedales("gauche", { frein: true }) + num(1, 20, bas - 100) + num(2, W - 100, bas - 100));
  return `<h2 class="section">${t("s1")}<small>${t("s1d")}</small></h2><div class="grille">
    ${figure(t("f_boutons"), ["puce--inchange", lang === "fr" ? "inchangé" : "unchanged"], f1, t("c_boutons") ? L[lang].c_boutons : [])}
    ${figure(t("f_glis"), puce(P_NOUVEAU), f2, L[lang].c_glis)}
    ${figure(t("f_vol"), puce(P_NOUVEAU), f3, L[lang].c_vol)}
    ${figure(t("f_gyro"), puce(P_NOUVEAU), f4, L[lang].c_gyro)}
    ${figure(t("f_vol_inv"), puce(P_NOUVEAU), f5, L[lang].c_vol_inv)}
  </div>`;
}

function mini(titre, desc, html) {
  return `<figure><div class="ecran" style="width:230px;height:200px;border-radius:12px;background:var(--track-asphalte)"><div class="abs" style="left:0;top:0;width:844px;height:390px;transform-origin:0 0;transform:none">${html}</div></div><figcaption><b>${titre}</b><br>${desc}</figcaption></figure>`;
}
function section2() {
  const roue = (deg, o = {}) => `<div class="ecran" style="width:230px;height:200px;border-radius:12px;position:relative"><div class="volant" style="left:35px;top:20px">${volantSvg(160, deg, o)}</div>${o.doigt ?? ""}</div>`;
  const dg = (deg, size = 160, rayon = 58) => { const k = size / 160, a = (deg * Math.PI) / 180; return `<div class="doigt" style="left:${35 + (80 + rayon * Math.sin(a)) * k}px;top:${20 + (80 - rayon * Math.cos(a)) * k}px"></div>`; };
  const fig = (titre, desc, el) => `<figure>${el}<figcaption><b>${titre}</b><br>${desc}</figcaption></figure>`;
  const volants = [
    fig(t("v_repos"), t("v_repos_d"), roue(0)),
    fig(t("v_45"), t("v_45_d"), roue(45, { on: true, doigt: dg(45) })),
    fig(t("v_butoir"), t("v_butoir_d"), roue(90, { on: true, max: 90, doigt: dg(90) })),
    fig(t("v_butoir135"), t("v_butoir135_d"), roue(135, { on: true, max: 135, doigt: dg(135) })),
    fig(t("v_hors"), t("v_hors_d"), roue(60, { on: true, doigt: dg(60, 160, 108) })),
    fig(t("v_retour"), t("v_retour_d"), roue(0, { trace: [-60, -40, -20] })),
  ].join("");
  const rail = (pos, on, zm) => `<div class="ecran" style="width:300px;height:110px;border-radius:12px;position:relative"><div style="position:absolute;left:0;top:0;width:844px;height:390px;transform:translate(0,${-(H - 12 - 64 - 23)}px)">${glissiere("gauche", pos, { on })}</div>${zm ? `<i style="position:absolute;left:${12 + 118 - 14}px;top:21px;width:28px;height:64px;border:2px dashed var(--track-texte-doux)"></i>` : ""}</div>`;
  const glis = [
    fig(t("g_repos"), t("g_repos_d"), rail(0, false)),
    fig(t("g_mi"), t("g_mi_d"), rail(-0.5, true)),
    fig(t("g_plein"), t("g_plein_d"), rail(1, true)),
    fig(t("g_zm"), t("g_zm_d"), rail(0.05, false, true)),
  ].join("");
  return `<h2 class="section">${t("s2")}<small>${t("s2d")}</small></h2>
    <h3 style="margin:16px 0 0;font-family:var(--dj-police-marque)">${t("v_titre")}</h3><div class="grille grille--petite">${volants}</div>
    <h3 style="margin:24px 0 0;font-family:var(--dj-police-marque)">${t("g_titre")}</h3><div class="grille grille--petite" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${glis}</div>
    <p style="margin-top:12px;font-size:13px;color:var(--dj-encre-douce)">${t("tailles")}</p>`;
}

function section3() {
  const haut = figure(t("sf_a"), null, ecranReglages(reglagesMode("volant"))) + figure(t("sf_a2"), null, ecranReglages(reglagesMode("volant"), { decalage: 150 }));
  const corps = (mode, titre, desc, opts) => `<figure><div class="etiquette dj-sombre large" style="max-width:640px"><div class="etiquette__corps"><div class="etiquette__tete"><h1 class="etiquette__titre" style="font-size:24px">${t("r_titre")}</h1></div>${reglagesMode(mode, opts)}</div></div><figcaption><b>${titre}</b><br>${desc}</figcaption></figure>`;
  return `<h2 class="section">${t("s3")}<small>${t("s3d")}</small></h2>
    <div class="grille">${haut}</div>
    <div class="grille" style="grid-template-columns:repeat(auto-fill,minmax(640px,1fr));margin-top:28px">
      ${corps("boutons", t("sf_b"), t("sd_b"))}${corps("glissiere", t("sf_c"), t("sd_c"))}${corps("volant", t("sf_d"), t("sd_d"))}${corps("gyro", t("sf_e"), t("sd_e"))}
    </div>`;
}

function section4() {
  const mini2 = (contenu) => `<div class="ecran ecran--mini" style="width:420px;height:auto;min-height:210px;border-radius:14px;padding:10px;background:var(--track-asphalte)"><div class="etiquette dj-sombre" style="position:relative;z-index:1"><div class="etiquette__corps" style="--corps-x:12px;--corps-y:10px;gap:8px"><div class="etiquette__tete"><h1 class="etiquette__titre" style="font-size:22px">${t("r_titre")}</h1></div>${contenu}</div></div></div>`;
  const choisir = (actif) => ligne(t("r_nom_dir"), seg(MODES(), actif));
  const a1 = figure(t("a_1"), null, mini2(choisir("gyro") + carteAutorisation("a")));
  const a2 = figure(t("a_2"), null, `<div class="ecran ecran--mini" style="width:420px;height:240px">${`<svg class="scene" aria-hidden="true"><use href="#scene"/></svg>`}<div class="voile-scene"></div><div class="systeme"><b>${t("a_2_t")}</b><p>${t("a_2_p")}</p><div class="deux"><span>${t("a_2_non")}</span><span>${t("a_2_oui")}</span></div></div></div>`);
  const a3 = figure(t("a_3"), null, mini2(choisir("gyro") + carteAutorisation("ok") + ligne(t("r_essai"), essai(0.35, "+12°"), t("r_essai_aide"))));
  const a4 = figure(t("a_4"), null, mini2(choisir("volant") + carteAutorisation("refus")));
  const a5 = figure(t("a_5"), null, mini2(choisir("volant") + carteAutorisation("absent")));
  const bas = H - 12;
  const k1 = figure(t("k_1"), null, ecran(hud({ aide: t("k_1_aide"), annonce: "2" }) + jauge(0, t("k_etat1")) + pedales("scindees")), L[lang].k_notes);
  const k2 = figure(t("k_2"), null, ecran(hud({ aide: t("k_2_aide"), annonce: t("k_depart") }) + jauge(0, t("k_etat2")) + pedales("scindees")));
  const p1 = figure(t("p_titre") + " — 1", null, ecran(dialoguePause("normal")), L[lang].p_notes);
  const p2 = figure(t("p_titre") + " — 2", null, ecran(dialoguePause("cours")));
  const p3 = figure(t("p_titre") + " — 3", null, ecran(dialoguePause("fait")));
  // Un téléphone en paysage qu'on tourne comme un volant : `rot` < 0 = vers la gauche (sens inverse des aiguilles), `cam` = côté de la caméra frontale (le haut du téléphone).
  const tel = (rot, cam, x) => `<g transform="translate(${x} 78) rotate(${rot})"><rect x="-62" y="-30" width="124" height="60" rx="9" fill="var(--track-asphalte)" stroke="var(--dj-encre)" stroke-width="3"/>
      <rect x="-52" y="-22" width="104" height="44" rx="3" fill="var(--track-piste)"/>
      <circle cx="${cam === "g" ? -57 : 57}" cy="0" r="3" fill="var(--track-texte-doux)"/>
      <rect x="-20" y="12" width="40" height="5" fill="var(--track-coque)"/><rect x="${rot < 0 ? -22 : 14}" y="10" width="8" height="9" fill="var(--track-livree)"/>
      <path d="M-8 -4 L0 -14 L8 -4" fill="none" stroke="var(--track-livree)" stroke-width="3"/></g>
    <text x="${x}" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="var(--dj-encre)">${rot < 0 ? "← " + t("pa_gauche") : t("pa_droite") + " →"}</text>`;
  const cadran = (cam) => `<svg class="cadran" width="500" height="165" viewBox="0 0 500 165" aria-hidden="true">${tel(-18, cam, 100)}${tel(0, cam, 250).replace(/<text.*?<\/text>/, "")}${tel(18, cam, 400)}</svg>`;
  const pa = `<div class="grille grille--moyenne" style="grid-template-columns:repeat(auto-fill,minmax(520px,1fr));max-width:1100px"><figure>${cadran("g")}<figcaption>${t("pa_1")}</figcaption></figure><figure>${cadran("d")}<figcaption>${t("pa_2")}</figcaption></figure></div><p style="max-width:850px;margin-top:10px;font-size:13px;color:var(--dj-encre-douce)">${t("pa_note")}</p>`;
  return `<h2 class="section">${t("s4")}<small>${t("s4d")}</small></h2>
    <h3 style="margin:16px 0 0;font-family:var(--dj-police-marque)">${t("a_titre")}</h3>
    <div class="grille grille--moyenne">${a1}${a2}${a3}${a4}${a5}</div>
    <ol style="max-width:900px;font-size:13px;color:var(--dj-encre-douce)">${L[lang].a_note.map((n) => `<li>${n}</li>`).join("")}</ol>
    <h3 style="margin:24px 0 0;font-family:var(--dj-police-marque)">${t("k_titre")}</h3><div class="grille">${k1}${k2}</div>
    <h3 style="margin:24px 0 0;font-family:var(--dj-police-marque)">${t("p_titre")}</h3><div class="grille">${p1}${p2}${p3}</div>
    <h3 style="margin:24px 0 0;font-family:var(--dj-police-marque)">${t("pa_titre")}</h3>${pa}`;
}

function section5() {
  return `<h2 class="section">${t("s5")}</h2><table class="tab"><thead><tr><th>${t("d_titre")}</th><th>${t("d_defaut")}</th><th>${t("d_plage")}</th><th>${t("d_note")}</th></tr></thead><tbody>${L[lang].d_rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p style="max-width:1000px;margin-top:12px;font-size:13px;color:var(--dj-encre-douce)">${t("budget")}</p>`;
}
function section6() {
  return `<h2 class="section">${t("s6")}</h2><ul class="decisions">${L[lang].dec.map((d) => `<li>${d}</li>`).join("")}</ul>`;
}

function render() {
  document.documentElement.lang = lang;
  document.title = t("titre");
  document.getElementById("page").innerHTML = `<header class="planche"><div><h1>${t("titre")}</h1><p>${t("intro")}</p></div>
    <div class="langue" role="group" aria-label="Langue / Language"><button type="button" data-l="fr" aria-pressed="${lang === "fr"}">FR</button><button type="button" data-l="en" aria-pressed="${lang === "en"}">EN</button></div></header>
    ${section1()}${section2()}${section3()}${section4()}${section5()}${section6()}`;
  for (const b of document.querySelectorAll(".langue button")) b.addEventListener("click", () => { lang = b.dataset.l; render(); });
}
render();
</script>
</body>
</html>
