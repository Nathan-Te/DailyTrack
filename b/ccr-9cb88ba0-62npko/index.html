<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e8283a'/%3E%3C/svg%3E" />
    <title>Circuit du Jour</title>
    <style>html,body{background:#0b1020;height:100%;margin:0;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{color:#fff;text-shadow:0 1px 3px #0000008c;pointer-events:none;font-variant-numeric:tabular-nums;font:600 14px system-ui,sans-serif;position:fixed}#info{opacity:.75;max-width:78vw;font-size:12px;bottom:14px;left:16px}#meta{font-size:15px;top:12px;left:16px}#medals{opacity:.9;white-space:pre;font-size:13px;top:34px;left:16px}#finish .medal{font-size:22px;font-weight:700}#ghostinfo{opacity:.85;color:#9bd0ff;font-size:13px;top:54px;left:16px}#board{color:#fff;font-variant-numeric:tabular-nums;background:#0b1020c7;border-radius:10px;width:270px;padding:10px 12px;font:600 13px system-ui,sans-serif;position:fixed;top:82px;left:16px}#board[hidden]{display:none}#board .title{opacity:.8;margin-bottom:6px}#board .row{grid-template-columns:24px 1fr auto 22px;gap:6px;padding:2px 0;display:grid}#board .row.me{color:#ffd22e}#board .rank{text-align:right;opacity:.75}#board .who{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}#board .gap{text-align:center;opacity:.5}#finish .online{margin-top:8px;font-size:15px}#finish .online .rank{color:#9bd0ff;font-weight:700}#finish .online .error{color:#ff8a80}#finish .online .label{margin-bottom:4px}#finish .online input{font:inherit;border:0;border-radius:6px;width:150px;margin-right:6px;padding:5px 8px}#finish .online button{font:inherit;cursor:pointer;color:#111;background:#ffd22e;border:0;border-radius:6px;padding:5px 12px}#finish .online button.link{color:#9bd0ff;background:0 0;padding:2px 0 0;font-size:13px;text-decoration:underline}#speed{font-size:40px;bottom:16px;right:20px}#timer{font-size:34px;top:10px;left:50%;transform:translate(-50%)}#splits{text-align:right;font-size:15px;line-height:1.5;top:12px;right:16px}#splits .up{color:#ff8a80}#splits .down{color:#8dffa8}#banner{letter-spacing:.02em;text-align:center;font-size:72px;font-weight:800;top:18%;left:50%;transform:translate(-50%,-50%)}#banner.small{font-size:34px}#finish{color:#fff;text-align:center;background:#0b1020d1;border-radius:14px;min-width:260px;padding:22px 30px;font:600 16px/1.6 system-ui,sans-serif;position:fixed;top:58%;left:50%;transform:translate(-50%,-50%);box-shadow:0 8px 30px #0006}#finish[hidden]{display:none}#finish .big{font-size:40px;font-weight:800}#finish .record{color:#ffd22e}#finish .hint{opacity:.7;margin-top:8px;font-size:14px}</style>
    <script type="module" crossorigin src="./assets/main-lgobbeMe.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/src-DgeauOmS.js">
  </head>
  <body>
    <div id="meta" class="hud"></div>
    <div id="medals" class="hud"></div>
    <div id="ghostinfo" class="hud"></div>
    <div id="board" hidden></div>
    <div id="info" class="hud"></div>
    <div id="timer" class="hud"></div>
    <div id="splits" class="hud"></div>
    <div id="banner" class="hud"></div>
    <div id="finish" hidden></div>
    <div id="speed" class="hud">0 km/h</div>
  </body>
</html>
