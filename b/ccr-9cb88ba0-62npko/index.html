<!doctype html>
<html lang="fr">

    <title>Circuit du Jour</title>
    <style>html,body{background:#0b1020;height:100%;margin:0;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{color:#fff;text-shadow:0 1px 3px #0000008c;pointer-events:none;font-variant-numeric:tabular-nums;font:600 14px system-ui,sans-serif;position:fixed}#info{opacity:.75;max-width:60vw;font-size:12px;bottom:14px;left:16px}#speed{font-size:40px;bottom:16px;right:20px}#timer{font-size:34px;top:10px;left:50%;transform:translate(-50%)}#splits{text-align:right;font-size:15px;line-height:1.5;top:12px;right:16px}#splits .up{color:#ff8a80}#splits .down{color:#8dffa8}#banner{letter-spacing:.02em;text-align:center;font-size:72px;font-weight:800;top:18%;left:50%;transform:translate(-50%,-50%)}#banner.small{font-size:34px}#finish{color:#fff;text-align:center;background:#0b1020d1;border-radius:14px;min-width:260px;padding:22px 30px;font:600 16px/1.6 system-ui,sans-serif;position:fixed;top:58%;left:50%;transform:translate(-50%,-50%);box-shadow:0 8px 30px #0006}#finish[hidden]{display:none}#finish .big{font-size:40px;font-weight:800}#finish .record{color:#ffd22e}#finish .hint{opacity:.7;margin-top:8px;font-size:14px}</style>
