<!doctype html>
<html lang="fr" data-precharge-polices>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" data-jeton-content="track-asphalte" />
    <meta name="description" data-t-content="page.description" />
    <link rel="icon" data-icone-du-jour />
    <title data-t="page.titre"></title>
  </head>
  <body>
    <!-- Lot I4 : le HTML ne porte aucune chaîne d'interface — les textes viennent des catalogues (pré-remplis en français à la construction par
         packages/ui/outils/vite.ts, puis dans la langue du joueur au démarrage : `appliquerTextes`, i18n.ts). Les feuilles : interface.css (primitives),
         hud.css et effets.css (la course), une feuille par zone (accueil, arrivée, réglages, Salon). -->
    <div id="splash" role="status"><div class="splash__nom" data-t="jeu.track.titre"></div><div class="splash__barre"></div></div>
    <noscript><p class="sans-js" data-t="page.sansJs"></p></noscript>
    <div id="touch"></div>

    <!-- Surimpressions de course, variante A « Plaques en haut » (charte § 9, maquettes track-hud*.html) : pause à gauche, chronomètre au centre,
         point de contrôle et écart juste dessous, objectif de médaille à droite ; le bas est laissé aux commandes tactiles. Chaque information sur sa
         plaque asphalte nette. Un identifiant, un élément : les tests et les outils les visent. -->
    <div id="menu" role="toolbar" data-t-aria-label="course.menu.aria">
      <button id="btn-pause" class="plaque plaque--bouton" type="button" data-t-aria-label="course.pause.aria"><span class="pause-barres" aria-hidden="true"><span></span><span></span></span></button>
    </div>
    <div id="hud-centre">
      <div id="timer" class="hud plaque plaque--chrono"><span id="timer-texte" class="plaque__chiffres"></span><span class="chrono__livree" aria-hidden="true"></span></div>
      <div id="splits" class="hud plaque plaque--pc"></div>
      <div id="ghostinfo" class="hud plaque plaque--petite"></div>
      <div id="meta" class="hud plaque plaque--petite"></div>
    </div>
    <div id="medals" class="hud plaque plaque--objectif"></div>
    <div id="board" hidden></div>
    <div id="info" class="hud plaque plaque--petite"></div>
    <div id="banner" class="hud plaque plaque--annonce"></div>
    <div id="freeze" class="hud plaque plaque--petite" aria-hidden="true" data-t="course.fige"></div>
    <div id="speed" class="hud plaque plaque--vitesse"><span id="speed-texte" class="plaque__chiffres"></span></div>
    <div id="fx" class="hud plaque plaque--petite"></div>
    <div id="lines"></div>
    <div id="flash"></div>
    <div id="fall"></div>
    <div id="watchbar" hidden></div>
    <div id="tbar"></div>
    <div id="rotate"></div>
    <button id="helpchip" class="plaque plaque--petite" type="button" data-t="course.aide.puce" data-t-title="course.aide.titre"></button>
    <div id="finale" hidden aria-live="off"></div>
    <div id="daycard" hidden></div>

    <!-- Les écrans hors partie : le cadre crème de Du Jour et l'étiquette Track (cadre.ts), remplis par leur module. -->
    <div id="home" class="cadre" hidden></div>
    <div id="finish" class="cadre" hidden></div>
    <div id="podium" class="cadre" hidden></div>
    <div id="archive" class="cadre" hidden></div>

    <!-- Pause : un dialogue sur un voile à rayures (maquette track-pause.html). -->
    <div id="pause" class="voile">
      <section class="dialogue dj-sombre" role="dialog" aria-modal="true" data-t-aria-label="pause.titre">
        <div class="dialogue__corps">
          <h2 class="dialogue__titre" data-t="pause.titre"></h2>
          <div class="pause__ligne" id="pause-info"></div>
          <div class="pause__menu" id="pause-menu">
            <button id="pause-resume" class="dj-bouton dj-bouton--track" type="button" data-t="pause.reprendre"></button>
            <button id="pause-restart" class="dj-bouton dj-bouton--secondaire bouton--tete" type="button" data-t="pause.recommencer"></button>
            <button id="pause-respawn" class="dj-bouton dj-bouton--secondaire" type="button" data-t="pause.pointDeControle"></button>
            <button id="pause-ghost" class="dj-bouton dj-bouton--secondaire" type="button"></button>
            <button id="pause-sound" class="dj-bouton dj-bouton--secondaire" type="button"></button>
            <button id="pause-settings" class="dj-bouton dj-bouton--secondaire" type="button" data-t="pause.reglages"></button>
            <button id="pause-howto" class="dj-bouton dj-bouton--secondaire" type="button" data-t="pause.aide"></button>
            <button id="pause-archive" class="dj-bouton dj-bouton--secondaire" type="button" data-t="pause.archives"></button>
            <button id="pause-home" class="dj-bouton dj-bouton--secondaire" type="button" data-t="pause.accueil"></button>
            <!-- Lot I2 (plateforme) : le retour au portail « Du Jour » ; lot R5 : la page « Mentions légales et confidentialité » (racine de playdujour.com). -->
            <a id="pause-portail" class="lien lien--portail" href="../" data-t-aria-label="barre.retour.aria"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /></svg><span data-t="barre.retour"></span></a>
            <a id="pause-mentions" class="lien" href="../mentions-legales/" data-t="pause.mentions"></a>
          </div>
          <div class="pause__confirmation" id="pause-confirm" hidden>
            <p data-t="pause.quitter"></p>
            <div class="actions">
              <button id="pause-stay" class="dj-bouton dj-bouton--track" type="button" data-t="pause.rester"></button>
              <button id="pause-leave" class="dj-bouton dj-bouton--secondaire" type="button" data-t="pause.retourAccueil"></button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="tuned" class="hud"></div>
    <div id="tune" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
