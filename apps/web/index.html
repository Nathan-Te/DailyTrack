<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Un circuit court par jour, le même pour tout le monde : une minute dans le navigateur, un fantôme à battre, un résultat à partager." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e8283a'/%3E%3C/svg%3E" />
    <title>Circuit du Jour</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
      body { user-select: none; -webkit-user-select: none; }
      input { user-select: text; -webkit-user-select: text; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Écran de chargement : s'affiche dès le HTML reçu, avant que le JavaScript n'ait fini de se charger. */
      #splash { position: fixed; inset: 0; z-index: 10; background: #0b1020; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 800 28px system-ui, sans-serif; letter-spacing: .02em; }
      #splash .bar { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 45%; height: 100%; background: #ffd22e; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }

      .hud { position: fixed; color: #fff; font: 600 14px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.55); pointer-events: none; font-variant-numeric: tabular-nums; }
      #meta { left: 16px; top: 12px; font-size: 15px; }
      #medals { left: 16px; top: 34px; font-size: 13px; opacity: .9; white-space: pre; }
      /* Fond sombre translucide : lisible aussi sur le ciel clair du thème « neige ». */
      #ghostinfo { left: 16px; top: 54px; font-size: 13px; color: #bfe1ff; background: rgba(11,16,32,.55); padding: 1px 7px; border-radius: 6px; }
      #ghostinfo:empty { display: none; }
      #info { left: 16px; bottom: 14px; opacity: .75; font-size: 12px; max-width: 78vw; }
      #speed { right: 20px; bottom: 16px; font-size: 40px; }
      #timer { left: 50%; top: 10px; transform: translateX(-50%); font-size: 34px; }
      #splits { right: 16px; top: 44px; text-align: right; line-height: 1.5; font-size: 15px; background: rgba(11,16,32,.5); padding: 2px 9px; border-radius: 8px; }
      #splits:empty { display: none; }
      #splits .up { color: #ff8a80; } #splits .down { color: #8dffa8; }
      #banner { left: 50%; top: 18%; transform: translate(-50%, -50%); font-size: 72px; font-weight: 800; letter-spacing: .02em; text-align: center; }
      #banner.small { font-size: 34px; }

      #menu { position: fixed; right: 12px; top: 10px; display: flex; gap: 6px; }
      #menu button { font: 600 13px system-ui, sans-serif; color: #fff; background: rgba(11,16,32,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 32px; }
      #menu button[hidden] { display: none; }
      #menu .ico { display: none; }

      #board { position: fixed; left: 16px; top: 82px; width: 270px; background: rgba(11,16,32,.78); color: #fff; font: 600 13px system-ui, sans-serif; padding: 10px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; }
      #board[hidden] { display: none; }
      #board .title { opacity: .8; margin-bottom: 6px; }
      #board .row { display: grid; grid-template-columns: 24px 1fr auto 22px; gap: 6px; padding: 2px 0; }
      #board .row.me { color: #ffd22e; }
      #board .rank { text-align: right; opacity: .75; }
      #board .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #board .gap { text-align: center; opacity: .5; }

      #finish { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); background: rgba(11,16,32,.86); color: #fff; font: 600 16px system-ui, sans-serif; padding: 20px 26px; border-radius: 14px; text-align: center; line-height: 1.55; width: min(400px, calc(100vw - 24px)); box-sizing: border-box; max-height: calc(100vh - 24px); overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
      #finish[hidden] { display: none; }
      #finish .big { font-size: 40px; font-weight: 800; }
      #finish .medal { font-size: 22px; font-weight: 700; }
      #finish .record { color: #ffd22e; }
      #finish .hint { opacity: .7; font-size: 13px; margin-top: 10px; }
      #finish .online { margin-top: 8px; font-size: 15px; }
      #finish .online .rank { font-weight: 700; color: #9bd0ff; }
      #finish .online .error { color: #ff8a80; }
      #finish .online .label { margin-bottom: 4px; }
      #finish .online input { font: inherit; padding: 6px 8px; border-radius: 6px; border: 0; width: 150px; margin-right: 6px; }
      #finish button { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 0; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; min-height: 38px; }
      #finish button.primary, #finish .online button { background: #ffd22e; color: #111; }
      #finish .online button.link { background: none; color: #9bd0ff; padding: 2px 0 0; text-decoration: underline; font-size: 13px; min-height: 0; }
      #finish .share { margin: 10px 0 0; font-size: 13px; background: rgba(255,255,255,.08); border-radius: 8px; padding: 6px 8px; word-break: break-word; }
      #finish .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }

      #archive { position: fixed; inset: 0; z-index: 5; background: rgba(5,8,20,.62); display: flex; align-items: center; justify-content: center; }
      #archive[hidden] { display: none; }
      #archive .panel { width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; background: #131a33; color: #fff; font: 600 14px system-ui, sans-serif; border-radius: 14px; padding: 14px 16px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #archive .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      #archive .title { font-size: 20px; font-weight: 800; }
      #archive .close { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 0; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; }
      #archive .day { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 8px; color: #fff; text-decoration: none; font-variant-numeric: tabular-nums; }
      #archive .day:hover, #archive .day:focus-visible { background: rgba(255,255,255,.1); outline: none; }
      #archive .day.current { background: rgba(255,210,46,.16); }
      #archive .num { opacity: .7; text-align: right; }
      #archive .theme { opacity: .6; font-size: 12px; }
      #archive .best { min-width: 92px; text-align: right; }
      #archive .note { opacity: .6; font-size: 12px; margin-top: 10px; }

      /* Petits écrans (téléphone) : bandeau resserré, menu en icônes, panneaux plus étroits. */
      @media (max-width: 900px), (max-height: 520px) {
        #meta { top: 8px; font-size: 12px; }
        #meta .long { display: none; }
        /* Portrait : les boutons du menu occupent le coin droit sur 34 px de haut, le bandeau passe dessous. */
        #medals { top: 44px; font-size: 11px; }
        #timer { top: 60px; font-size: 28px; }
        #splits { top: 64px; right: 12px; font-size: 12px; }
        /* La ligne du fantôme ne doit jamais atteindre les temps intermédiaires, à droite : largeur plafonnée, coupée par « … ». */
        #ghostinfo { top: 98px; font-size: 11px; max-width: calc(100vw - 200px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #ghostinfo .long { display: none; }
        /* Le classement devient une fenêtre qu'on ouvre (bouton 🏆) et qu'on ferme en la touchant : pas de place pour l'afficher à côté. */
        #board { left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; width: min(320px, calc(100vw - 24px)); max-height: 72vh; overflow: auto; box-sizing: border-box; background: rgba(19,26,51,.97); box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: pointer; }
        #info { display: none; }
        #speed { font-size: 28px; right: 14px; bottom: 12px; }
        #banner { font-size: 44px; top: 30%; }
        #banner.small { font-size: 24px; }
        #menu { right: 8px; top: 6px; }
        #menu .txt { display: none; }
        #menu .ico { display: inline; font-size: 16px; }
        #menu button { padding: 4px 8px; min-height: 34px; min-width: 38px; }
        #finish { padding: 14px 16px; top: 56%; }
        #finish .big { font-size: 32px; }
        /* Une fois la course finie, le panneau d'arrivée prend la place : on masque ce qui le recouvrirait. */
        body.finished #splits, body.finished #speed { display: none; }
      }
      /* Très étroit (360 px) : le chrono se cale à gauche, pour laisser sa place aux temps intermédiaires à droite. */
      @media (max-width: 520px) {
        #timer { left: 16px; transform: none; }
      }
      /* Téléphone en paysage : peu de hauteur, le panneau d'arrivée se range à droite, sous le bandeau. */
      @media (max-height: 520px) and (orientation: landscape) {
        #medals { top: 26px; }
        #timer { top: 44px; }
        #splits { top: 48px; }
        #ghostinfo { top: 82px; }
        #finish { left: auto; right: 12px; top: auto; bottom: 8px; transform: none; width: min(380px, 46vw); max-height: calc(100vh - 100px); display: flex; flex-direction: column; font-size: 14px; line-height: 1.35; padding: 10px 14px; }
        #finish .big { font-size: 26px; }
        #finish .medal { font-size: 18px; }
        #finish .hint { display: none; }
        /* Peu de hauteur : les boutons passent juste après le résultat, et ce qui est secondaire (rang, ligne à partager) après eux. */
        #finish .actions { order: 1; margin-top: 8px; }
        #finish .online { order: 2; margin-top: 6px; font-size: 13px; }
        #finish .share { order: 3; margin-top: 6px; font-size: 12px; }
        #finish button { font-size: 14px; padding: 6px 12px; }
        #board { width: min(250px, 40vw); }
      }
    </style>
  </head>
  <body>
    <div id="splash"><div>Circuit du Jour</div><div class="bar"></div></div>
    <noscript><p style="color:#fff;font:16px system-ui;padding:24px">Circuit du Jour a besoin de JavaScript.</p></noscript>
    <div id="meta" class="hud"></div>
    <div id="medals" class="hud"></div>
    <div id="ghostinfo" class="hud"></div>
    <div id="menu">
      <button id="btn-board" type="button" title="Classement (L)" hidden><span class="ico">🏆</span><span class="txt">Classement</span></button>
      <button id="btn-ghost" type="button" title="Fantôme (G)"><span class="ico">👻</span><span class="txt">Fantôme</span></button>
      <button id="btn-archive" type="button" title="Archives (H)"><span class="ico">📅</span><span class="txt">Archives</span></button>
    </div>
    <div id="board" hidden></div>
    <div id="info" class="hud"></div>
    <div id="timer" class="hud"></div>
    <div id="splits" class="hud"></div>
    <div id="banner" class="hud"></div>
    <div id="finish" hidden></div>
    <div id="archive" hidden><div class="panel"></div></div>
    <div id="speed" class="hud">0 km/h</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
