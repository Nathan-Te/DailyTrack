<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Un circuit court par jour, le même pour tout le monde : une minute dans le navigateur, un fantôme à battre, un résultat à partager." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e8283a'/%3E%3C/svg%3E" />
    <title>Circuit du Jour</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
      body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      input { user-select: text; -webkit-user-select: text; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Écran de chargement : s'affiche dès le HTML reçu, avant que le JavaScript n'ait fini de se charger. */
      #splash { position: fixed; inset: 0; z-index: 10; background: #0b1020; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 800 28px system-ui, sans-serif; letter-spacing: .02em; }
      #splash .bar { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 45%; height: 100%; background: #ffd22e; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }

      .hud { position: fixed; color: #fff; font: 600 14px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.55); pointer-events: none; font-variant-numeric: tabular-nums; }
      #meta { left: 16px; top: 12px; font-size: 15px; }
      #medals { left: 16px; top: 34px; font-size: 13px; opacity: .9; white-space: pre; }
      /* Fond sombre translucide : lisible aussi sur le ciel clair du thème « neige ». */
      #ghostinfo { left: 16px; top: 54px; font-size: 13px; color: #bfe1ff; background: rgba(11,16,32,.55); padding: 1px 7px; border-radius: 6px; }
      #ghostinfo:empty { display: none; }
      #info { left: 16px; bottom: 14px; opacity: .75; font-size: 12px; max-width: 78vw; }
      #speed { right: 20px; bottom: 16px; font-size: 40px; transition: color .25s; }
      /* Compteur au-delà de la pointe du plat (lot 15) : jaune, orange, puis rouge à la vitesse d'un super turbo. */
      #speed[data-level="1"] { color: #ffe14d; }
      #speed[data-level="2"] { color: #ff9f1c; text-shadow: 0 0 12px rgba(255,159,28,.55); }
      #speed[data-level="3"] { color: #ff4b3a; text-shadow: 0 0 16px rgba(255,75,58,.7); }
      /* Effets en cours (super turbo, moteur coupé) et revêtement : en bas à gauche. */
      #fx { left: 16px; bottom: 40px; font-size: 18px; font-weight: 800; letter-spacing: .03em; color: #ffd22e; background: rgba(11,16,32,.55); padding: 2px 10px; border-radius: 8px; }
      #fx[data-cut="1"] { color: #ff8a80; }
      #fx:empty { display: none; }
      #timer { left: 50%; top: 10px; transform: translateX(-50%); font-size: 34px; }
      #splits { right: 16px; top: 44px; text-align: right; line-height: 1.5; font-size: 15px; background: rgba(11,16,32,.5); padding: 2px 9px; border-radius: 8px; }
      #splits:empty { display: none; }
      #splits .up { color: #ff8a80; } #splits .down { color: #8dffa8; }
      #banner { left: 50%; top: 18%; transform: translate(-50%, -50%); font-size: 72px; font-weight: 800; letter-spacing: .02em; text-align: center; }
      #banner.small { font-size: 34px; }
      /* Lot 19 : le frein, en l'air, fige la caisse (indicateur discret, présentation seule). */
      #freeze { left: 50%; top: 31%; transform: translateX(-50%); font-size: 15px; font-weight: 800; letter-spacing: .08em; color: #bfe6ff; background: rgba(11,16,32,.55); padding: 2px 12px; border-radius: 999px; opacity: 0; transition: opacity .12s; }
      #freeze.on { opacity: .9; }

      /* Lot 9 : lignes de vitesse sur les bords, éclair de point de contrôle (présentation seule, jamais d'événement) */
      #lines, #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #lines { background: repeating-conic-gradient(from 0deg at 50% 52%, rgba(255,255,255,.55) 0deg .35deg, transparent .35deg 7deg); -webkit-mask-image: radial-gradient(ellipse at 50% 52%, transparent 38%, #000 80%); mask-image: radial-gradient(ellipse at 50% 52%, transparent 38%, #000 80%); }
      #fall { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(8,10,20,.35) 0%, rgba(4,5,12,.96) 78%); }
      #flash { background: radial-gradient(ellipse at center, rgba(120,200,255,0) 40%, rgba(120,200,255,.55) 100%); }
      #finish .medal { position: relative; overflow: hidden; }
      #finish .medal::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); transform: translateX(-100%); animation: glint 1.4s ease-out .5s 2; pointer-events: none; }
      @keyframes glint { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #finish .medal::after { animation: none; } }
      #menu { position: fixed; right: 12px; top: 10px; display: flex; gap: 6px; }
      #menu button { font: 600 13px system-ui, sans-serif; color: #fff; background: rgba(11,16,32,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 32px; }
      #menu button[hidden] { display: none; }
      #menu .ico { display: none; }

      #board { position: fixed; left: 16px; top: 82px; width: 270px; background: rgba(11,16,32,.78); color: #fff; font: 600 13px system-ui, sans-serif; padding: 10px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; }
      #board[hidden] { display: none; }
      #board .title { opacity: .8; margin-bottom: 6px; }
      #board .row { display: grid; grid-template-columns: 24px 1fr auto 22px; gap: 6px; padding: 2px 0; }
      #board .row.me { color: #ffd22e; }
      #board .rank { text-align: right; opacity: .75; }
      #board .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #board .gap { text-align: center; opacity: .5; }

      #finish { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); background: rgba(11,16,32,.86); color: #fff; font: 600 16px system-ui, sans-serif; padding: 20px 26px; border-radius: 14px; text-align: center; line-height: 1.55; width: min(400px, calc(100vw - 24px)); box-sizing: border-box; max-height: calc(100vh - 24px); overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
      #finish[hidden] { display: none; }
      #finish .big { font-size: 40px; font-weight: 800; }
      #finish .medal { font-size: 22px; font-weight: 700; }
      #finish .record { color: #ffd22e; }
      #finish .hint { opacity: .7; font-size: 13px; margin-top: 10px; }
      #finish .online { margin-top: 8px; font-size: 15px; }
      #finish .online .rank { font-weight: 700; color: #9bd0ff; }
      #finish .online .error { color: #ff8a80; }
      #finish .online .label { margin-bottom: 4px; }
      #finish .online input { font: inherit; padding: 6px 8px; border-radius: 6px; border: 0; width: 150px; margin-right: 6px; }
      #finish button { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 0; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; min-height: 38px; }
      #finish button.primary, #finish .online button { background: #ffd22e; color: #111; }
      #finish .online button.link { background: none; color: #9bd0ff; padding: 2px 0 0; text-decoration: underline; font-size: 13px; min-height: 0; }
      #finish .share { margin: 10px 0 0; font-size: 13px; background: rgba(255,255,255,.08); border-radius: 8px; padding: 6px 8px; word-break: break-word; }
      #finish .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }

      #archive { position: fixed; inset: 0; z-index: 5; background: rgba(5,8,20,.62); display: flex; align-items: center; justify-content: center; }
      #archive[hidden] { display: none; }
      #archive .panel { width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; background: #131a33; color: #fff; font: 600 14px system-ui, sans-serif; border-radius: 14px; padding: 14px 16px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #archive .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      #archive .title { font-size: 20px; font-weight: 800; }
      #archive .close { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 0; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; }
      #archive .day { display: grid; grid-template-columns: 120px 1fr auto; grid-template-areas: "thumb what best" "sub sub sub"; gap: 4px 12px; align-items: center; padding: 8px; border-radius: 8px; color: #fff; text-decoration: none; font-variant-numeric: tabular-nums; }
      #archive .day:hover, #archive .day:focus-visible { background: rgba(255,255,255,.1); outline: none; }
      #archive .day.current { background: rgba(255,210,46,.16); }
      #archive .thumb { grid-area: thumb; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.07); position: relative; }
      #archive .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #archive .thumb[data-state=wait]::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.14) 50%, transparent 80%); transform: translateX(-100%); animation: thumbwait 1.2s ease-in-out infinite; }
      @keyframes thumbwait { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #archive .thumb[data-state=wait]::after { animation: none; transform: none; opacity: .5; } }
      #archive .what { grid-area: what; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
      #archive .sub { grid-area: sub; font-size: 11px; font-weight: 500; opacity: .6; white-space: pre-wrap; }
      #archive .num { font-weight: 800; }
      #archive .date { opacity: .9; }
      #archive .theme { flex-basis: 100%; opacity: .6; font-size: 12px; }
      #archive .best { grid-area: best; min-width: 80px; text-align: right; }
      @media (max-width: 520px) {
        #archive .day { grid-template-columns: 104px 1fr; grid-template-areas: "thumb what" "thumb best" "sub sub"; }
        #archive .best { text-align: left; min-width: 0; }
      }
      #archive .tools { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 10px; }
      #archive .dice { font: inherit; color: #131a33; background: #ffd22e; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
      #archive .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      #archive .chips a { color: #fff; text-decoration: none; background: rgba(255,255,255,.12); border-radius: 999px; padding: 8px 12px; font-size: 13px; min-height: 20px; }
      #archive .chips a.on { background: #ffd22e; color: #131a33; }
      #daycard { position: fixed; left: 50%; bottom: calc(18% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1; width: min(240px, 44vw); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,.6); box-shadow: 0 6px 24px rgba(0,0,0,.45); pointer-events: none; background: rgba(11,16,32,.6); }
      #daycard[hidden] { display: none; }
      #daycard img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #archive .note { opacity: .6; font-size: 12px; margin-top: 10px; }

      /* Commandes tactiles (lot 10) : tout est caché hors `body.touch` (appareil tactile, ou `?touch=1`). */
      #touch, #tbar, #tsettings, #rotate, #pause { display: none; }
      body.touch #touch { display: block; position: fixed; inset: 0; z-index: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Barre d'actions compacte et centrée (entre les pouces : de 36 % à 64 % de la largeur sur un écran de 844 px) : un bouton attire les appuis voisins (le navigateur « corrige » le toucher vers lui), donc elle ne touche ni la frontière ← | → (25 %) ni frein | gaz (75 %). */
      body.touch #tbar { pointer-events: none; display: flex; position: fixed; left: 50%; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); gap: 2px; }
      body.touch #tbar button { font: 600 19px system-ui, sans-serif; line-height: 1; color: #fff; background: rgba(11,16,32,.62); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; width: 44px; height: 44px; padding: 0; cursor: pointer; touch-action: manipulation; pointer-events: auto; }
      body.touch #tbar button[hidden] { display: none; }
      body.touch.finished #touch, body.touch.finished #tbar { display: none; }
      body.touch #info { display: none; }
      body.touch #speed { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
      body.touch #fx { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); font-size: 15px; }
      body.touch #menu button { min-height: 44px; min-width: 44px; }
      body.touch #splits { top: 60px; }
      /* Portrait : les boutons de menu font 44 px (et non 34), la pile d'infos à gauche descend d'autant. */
      @media (orientation: portrait) { body.touch #medals { top: 52px; } body.touch #timer { top: 68px; } body.touch #ghostinfo { top: 106px; } body.touch #splits { top: 70px; } }
      body.touch #finish button { min-height: 44px; }
      /* Aides à l'écran : le toucher passe au travers (tout est géré par #touch). */
      #touch > * { pointer-events: none; position: absolute; }
      #touch .ring { width: 96px; height: 96px; left: 0; top: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); background: rgba(255,255,255,.08); }
      #touch .knob { width: 46px; height: 46px; left: 0; top: 0; border-radius: 50%; background: rgba(255,210,46,.9); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
      #touch [hidden] { display: none; }
      /* Les boutons dessinés suivent EXACTEMENT les zones tactiles (voir `zoneAt`, touch.ts), en parts de la largeur :
         ◀ 0–25 %, ▶ 25–50 %, frein 50–100 % (ou 50–75 % avec le bouton gaz), gaz 75–100 %. Chacun reste dans sa zone, avec une
         marge de 2 % : toucher n'importe où sur un bouton déclenche ce bouton, jamais celui d'à côté. */
      /* Les boutons dessinés sont placés et dimensionnés par `buttonRects` (touch.ts) ; la zone active, elle, couvre tout l'écran. */
      #touch .tbtn { display: flex; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 20px; background: rgba(11,16,32,.32); border: 2px solid rgba(255,255,255,.35); color: #fff; font: 800 18px system-ui, sans-serif; letter-spacing: .04em; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
      #touch .tbtn[hidden] { display: none; }
      #touch .tbtn.on { background: rgba(255,210,46,.5); border-color: #ffd22e; }
      /* Diagnostic `?zones=1` : zones actives et un point par doigt. */
      #touch .zones { inset: 0; }
      #touch .zspan { position: absolute; top: 0; bottom: 0; box-sizing: border-box; border: 2px dashed; font: 700 13px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px #000; padding: 6px; }
      .fdot { position: fixed; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; z-index: 9; pointer-events: none; opacity: .9; }
      .safe-probe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      #touch .hint { left: 50%; top: 64%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; font: 600 13px system-ui, sans-serif; color: #fff; background: rgba(11,16,32,.7); padding: 4px 10px; border-radius: 8px; }
      #tsettings { position: fixed; inset: 0; z-index: 5; background: rgba(5,8,20,.62); align-items: center; justify-content: center; }
      body.touch #tsettings:not([hidden]) { display: flex; }
      #tsettings .panel { width: min(460px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; background: #131a33; color: #fff; font: 600 14px system-ui, sans-serif; border-radius: 14px; padding: 12px 16px 16px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #tsettings .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #tsettings .tools { display: flex; gap: 8px; }
      #tsettings .title { font-size: 18px; font-weight: 800; }
      #tsettings .close, #tsettings .reset { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 0; border-radius: 10px; min-width: 44px; min-height: 44px; cursor: pointer; }
      #tsettings .reset { padding: 0 12px; font-size: 13px; }
      #tsettings .row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-top: 6px; }
      #tsettings .seg { display: flex; gap: 6px; }
      #tsettings .seg button { flex: 1; font: inherit; color: #fff; background: rgba(255,255,255,.1); border: 1px solid transparent; border-radius: 10px; min-height: 44px; padding: 0 8px; cursor: pointer; }
      #tsettings .seg button.on { background: #ffd22e; color: #111; }
      #tsettings .slider { display: flex; align-items: center; gap: 10px; min-height: 44px; }
      #tsettings .slider input { flex: 1; min-width: 0; }
      #tsettings .slider .value { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
      #rotate { position: fixed; left: 0; right: 0; top: 42%; z-index: 2; justify-content: center; pointer-events: none; }
      #rotate .card { pointer-events: auto; width: min(300px, calc(100vw - 32px)); box-sizing: border-box; text-align: center; background: rgba(19,26,51,.94); color: #fff; font: 600 15px system-ui, sans-serif; line-height: 1.4; border-radius: 14px; padding: 12px 16px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
      #rotate .icon { font-size: 34px; display: inline-block; transform: rotate(90deg); }
      #rotate button { margin-top: 8px; font: inherit; color: #111; background: #ffd22e; border: 0; border-radius: 10px; min-height: 44px; padding: 0 16px; cursor: pointer; }
      @media (orientation: portrait) { body.touch:not(.rotate-ok):not(.finished) #rotate { display: flex; } }
      #pause { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; background: rgba(11,16,32,.9); color: #fff; font: 600 16px system-ui, sans-serif; padding: 16px 22px; border-radius: 14px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
      body.paused #pause { display: block; }
      #pause .big { font-size: 30px; font-weight: 800; margin-bottom: 10px; }
      #pause .actions { display: flex; gap: 8px; justify-content: center; }
      #pause button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 0; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; min-height: 44px; }
      #pause button.primary { background: #ffd22e; color: #111; }

      /* Panneau de réglage de la conduite (`?debug&tune`) : outil de mise au point, à droite sous les temps. */
      #tune { position: fixed; right: 12px; top: 150px; z-index: 3; width: 290px; max-height: calc(100vh - 220px); overflow: auto; background: rgba(11,16,32,.86); color: #fff; font: 600 12px system-ui, sans-serif; border-radius: 10px; padding: 8px 10px; box-sizing: border-box; font-variant-numeric: tabular-nums; }
      #tune[hidden] { display: none; }
      #tune .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #tune .head button { font: inherit; color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 6px; width: 26px; height: 22px; cursor: pointer; }
      #tune.folded .body { display: none; }
      #tune .row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin-top: 6px; }
      #tune .row input { grid-column: 1 / 3; width: 100%; margin: 2px 0 0; }
      #tune .row.changed { color: #ffd22e; }
      #tune .status { margin-top: 8px; opacity: .8; }
      #tune .actions { display: flex; gap: 6px; margin-top: 6px; }
      #tune .actions button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 0; cursor: pointer; background: #ffd22e; color: #111; }
      #tune .actions button + button { background: rgba(255,255,255,.14); color: #fff; }
      #tuned { left: 50%; top: 48px; transform: translateX(-50%); font-size: 12px; color: #ffd22e; background: rgba(11,16,32,.6); padding: 1px 8px; border-radius: 6px; }
      #tuned:empty { display: none; }

      /* Petits écrans (téléphone) : bandeau resserré, menu en icônes, panneaux plus étroits. */
      @media (max-width: 900px), (max-height: 520px) {
        #meta { top: 8px; font-size: 11px; max-width: calc(100vw - 210px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* deux chiffres au numéro du circuit : ne jamais passer sous le menu */
        #meta .long { display: none; }
        /* Portrait : les boutons du menu occupent le coin droit sur 34 px de haut, le bandeau passe dessous. */
        #medals { top: 44px; font-size: 11px; }
        #timer { top: 60px; font-size: 28px; }
        #splits { top: 64px; right: 12px; font-size: 12px; }
        /* La ligne du fantôme ne doit jamais atteindre les temps intermédiaires, à droite : largeur plafonnée, coupée par « … ». */
        #ghostinfo { top: 98px; font-size: 11px; max-width: calc(100vw - 200px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #ghostinfo .long { display: none; }
        /* Le classement devient une fenêtre qu'on ouvre (bouton 🏆) et qu'on ferme en la touchant : pas de place pour l'afficher à côté. */
        #board { left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; width: min(320px, calc(100vw - 24px)); max-height: 72vh; overflow: auto; box-sizing: border-box; background: rgba(19,26,51,.97); box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: pointer; }
        #info { display: none; }
        #speed { font-size: 28px; right: 14px; bottom: 12px; }
        #banner { font-size: 44px; top: 30%; }
        #banner.small { font-size: 24px; }
        #menu { right: 8px; top: 6px; gap: 4px; }
        #menu .txt { display: none; }
        #menu .ico { display: inline; font-size: 16px; }
        #menu button { padding: 4px 8px; min-height: 34px; min-width: 38px; }
        #finish { padding: 14px 16px; top: 56%; }
        #finish .big { font-size: 32px; }
        /* Une fois la course finie, le panneau d'arrivée prend la place : on masque ce qui le recouvrirait. */
        body.finished #splits, body.finished #speed { display: none; }
      }
      /* Très étroit (360 px) : le chrono se cale à gauche, pour laisser sa place aux temps intermédiaires à droite. */
      @media (max-width: 520px) {
        #timer { left: 16px; transform: none; }
      }
      /* Téléphone en paysage : peu de hauteur, le panneau d'arrivée se range à droite, sous le bandeau. */
      @media (max-height: 520px) and (orientation: landscape) {
        #medals { top: 26px; }
        #timer { top: 44px; }
        #splits { top: 48px; }
        #ghostinfo { top: 82px; }
        #finish { left: auto; right: 12px; top: auto; bottom: 8px; transform: none; width: min(380px, 46vw); max-height: calc(100vh - 100px); display: flex; flex-direction: column; font-size: 14px; line-height: 1.35; padding: 10px 14px; }
        #finish .big { font-size: 26px; }
        #finish .medal { font-size: 18px; }
        #finish .hint { display: none; }
        /* Peu de hauteur : les boutons passent juste après le résultat, et ce qui est secondaire (rang, ligne à partager) après eux. */
        #finish .actions { order: 1; margin-top: 8px; }
        #finish .online { order: 2; margin-top: 6px; font-size: 13px; }
        #finish .share { order: 3; margin-top: 6px; font-size: 12px; }
        #finish button { font-size: 14px; padding: 6px 12px; }
        #board { width: min(250px, 40vw); }
      }
    </style>
  </head>
  <body>
    <div id="splash"><div>Circuit du Jour</div><div class="bar"></div></div>
    <noscript><p style="color:#fff;font:16px system-ui;padding:24px">Circuit du Jour a besoin de JavaScript.</p></noscript>
    <div id="touch"></div>
    <div id="meta" class="hud"></div>
    <div id="medals" class="hud"></div>
    <div id="ghostinfo" class="hud"></div>
    <div id="menu">
      <button id="btn-board" type="button" title="Classement (L)" hidden><span class="ico">🏆</span><span class="txt">Classement</span></button>
      <button id="btn-ghost" type="button" title="Fantôme (G)"><span class="ico">👻</span><span class="txt">Fantôme</span></button>
      <button id="btn-sound" type="button" title="Son (M)"><span class="ico">🔊</span><span class="txt">Son</span></button>
      <button id="btn-archive" type="button" title="Archives (H)"><span class="ico">📅</span><span class="txt">Archives</span></button>
    </div>
    <div id="board" hidden></div>
    <div id="info" class="hud"></div>
    <div id="timer" class="hud"></div>
    <div id="splits" class="hud"></div>
    <div id="banner" class="hud"></div>
    <div id="freeze" class="hud" aria-hidden="true">❄ FIGÉ</div>
    <div id="finish" hidden></div>
    <div id="archive" hidden><div class="panel"></div></div>
    <div id="daycard" hidden></div>
    <div id="speed" class="hud">0 km/h</div>
    <div id="fx" class="hud"></div>
    <div id="lines"></div>
    <div id="flash"></div>
    <div id="fall"></div>
    <div id="tbar"></div>
    <div id="tsettings" hidden></div>
    <div id="rotate"></div>
    <div id="pause">
      <div class="big">Pause</div>
      <div class="actions"><button id="pause-resume" class="primary" type="button">Reprendre</button><button id="pause-restart" type="button">Recommencer</button></div>
    </div>
    <div id="tuned" class="hud"></div>
    <div id="tune" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
