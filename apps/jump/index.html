<!doctype html>
<html lang="fr" data-precharge-polices>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" data-jeton-content="dj-encre" />
    <meta name="description" data-t-content="page.description" />
    <link rel="icon" data-icone-du-jour />
    <title data-t="page.titre"></title>
  </head>
  <body>
    <!-- Lot I5 : le HTML ne porte aucune chaîne d'interface — les textes viennent des catalogues (pré-remplis en français à la construction par
         packages/ui/outils/vite.ts, puis dans la langue du joueur au démarrage : `appliquerTextes`, i18n.ts). Les feuilles (importées par boot.ts) :
         interface.css (primitives, cadre, étiquette jaune, voile), hud.css (surimpressions en partie, tactile, carnage, bandeau), ecrans.css (accueil,
         arrivée, réglages, archives, classement, « Comment jouer »), outils.css (?debug, ?debug&tune, ?zones=1, galerie des morceaux). -->
    <div id="stamp" hidden></div>
    <!-- Surimpressions en partie compactes (charte rév. 7, § 9 ; maquette jump-hud.html) : le jeu se lit d'abord. En haut à gauche la pause (44 px) ;
         au centre en haut **une seule bande de 30 px** (chrono · point de passage · écart signé au record) ; en haut à droite l'objectif de médaille et
         l'autocollant des morts. Le titre du niveau (`#dayline`) ne s'affiche qu'au départ ; les messages courts passent sous la bande. Le centre reste libre. -->
    <div id="hud" data-t-aria-label="hud.aria" role="group">
      <div id="hud-gauche">
        <button type="button" id="pausebtn" class="plaque plaque--bouton" data-t-aria-label="hud.pause.aria" data-t-title="hud.pause.aria"><span class="pause-barres" aria-hidden="true"><span></span><span></span></span></button>
        <div id="modetag" class="plaque plaque--petite" hidden></div>
      </div>
      <div id="chrono" class="bande" aria-live="off">
        <span class="time plaque__chiffres"></span>
        <span class="pc" hidden><svg class="pc__drapeau" aria-hidden="true" width="11" height="13" viewBox="0 0 14 16"><path class="pc__mat" d="M2 16V1" /><path class="pc__fanion" d="M3 2h9l-2 3 2 3H3z" /></svg><span class="pc__texte"></span></span>
        <span class="ecart plaque__chiffres" hidden></span>
      </div>
      <div id="hud-droite">
        <div id="objectif" class="plaque plaque--objectif" role="img" hidden></div>
        <div id="morts" class="autocollant" role="img"><svg class="autocollant__crane" aria-hidden="true" width="16" height="16" viewBox="0 0 34 34"><path class="crane__os" d="M17 3c-7.5 0-12 5-12 11 0 4 2 6 4 7v5h16v-5c2-1 4-3 4-7 0-6-4.5-11-12-11z" /><rect class="crane__oeil" x="10" y="13" width="5" height="6" /><rect class="crane__oeil" x="19" y="13" width="5" height="6" /></svg><span class="count">0</span></div>
      </div>
      <div id="dayline" class="plaque plaque--petite" hidden></div>
      <div id="daynote" class="plaque plaque--petite" role="status"></div>
      <div id="carnage" hidden>
        <div class="carnage__tete">
          <div class="autocollant autocollant--titre"><h2 class="carnage__titre" data-t="carnage.titre"></h2><span class="count"></span></div>
          <div class="carnage__vague plaque" role="img"><span class="legende" data-t="carnage.vague"></span><span class="carnage__vague-valeur"></span></div>
        </div>
        <div class="carnage__barre plaque">
          <button type="button" id="carnage-prev" class="carnage__bouton" data-t-aria-label="carnage.precedente"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" /></svg></button>
          <button type="button" id="carnage-pause" class="carnage__bouton carnage__bouton--encre" data-t-aria-label="carnage.pause" aria-pressed="false"><span class="pause-barres" aria-hidden="true"><span></span><span></span></span><svg class="carnage__lecture" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" /></svg></button>
          <button type="button" id="carnage-next" class="carnage__bouton" data-t-aria-label="carnage.suivante"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M7 3l6 6-6 6" /></svg></button>
          <div class="carnage__avancement" role="img"><span class="carnage__avancement-plein"></span></div>
          <span class="carnage__aide" data-t="carnage.aide"></span>
          <button type="button" id="carnage-close" class="dj-bouton dj-bouton--secondaire" data-t="carnage.fermer"></button>
        </div>
      </div>
      <pre id="debug" hidden></pre>
      <div id="tuned"></div>
    </div>
    <div id="toast" class="plaque plaque--petite" role="status"></div>
    <div id="tune" hidden></div>
    <div id="finish" class="bandeau" role="dialog" data-t-aria-label="bandeau.aria" hidden>
      <div class="title" data-t="bandeau.arrivee"></div>
      <div class="time"></div>
      <div class="stats"><span class="ref"></span><span class="best"></span><span class="deaths"></span></div>
      <div class="buttons"><button type="button" id="finish-restart" class="dj-bouton dj-bouton--jump" data-t="bandeau.recommencer"></button><a id="finish-next" class="dj-bouton dj-bouton--secondaire next" data-t="bandeau.suivant" hidden></a></div>
      <div class="hint" data-t="bandeau.aide"></div>
    </div>
    <div id="modname" class="plaque plaque--petite"></div>
    <div id="nogl" data-t="page.sansWebgl"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
