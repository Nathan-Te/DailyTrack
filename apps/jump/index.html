<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="DailyJump : un niveau de plateformes court et brutal par jour, le même pour tout le monde." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ffd22e'/%3E%3C/svg%3E" />
    <title>DailyJump</title>
    <style>
      :root { --band: 60px; }
      html { margin: 0; height: 100%; height: 100dvh; background: #101820; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
      /* Corps fixe : ni défilement, ni rebond, ni barre d'adresse qui bouge la page. */
      body { position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #101820; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #stamp { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); color: #fff; font: 600 13px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); font-variant-numeric: tabular-nums; pointer-events: none; text-align: right; }
      #hud { display: contents; }
      #debug { position: fixed; left: 10px; top: 10px; margin: 0; padding: 6px 9px; color: #fff; background: rgba(11, 16, 32, 0.72); border-radius: 8px; font: 600 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; pointer-events: none; }
      #debug[hidden] { display: none; }
      /* HUD du lot 2 : chrono de l'essai, meilleur temps, morts. En haut au centre (ordinateur), sous la bande haute (téléphone). */
      #chrono { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 12px; padding: 4px 12px; border-radius: 10px; background: rgba(11, 16, 32, 0.62); color: #fff; font: 600 13px system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; z-index: 4; }
      #chrono .time { font-size: 22px; font-weight: 800; min-width: 5.6em; text-align: right; }
      #chrono.done .time { color: #ffd22e; }
      #chrono .best, #chrono .deaths { opacity: 0.85; }
      /* Bandeau d'arrivée (lot 2) : au-dessus de la couche tactile, un bouton de 48 px. */
      #finish { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; box-sizing: border-box; max-width: calc(100% - 32px); min-width: min(320px, calc(100% - 32px)); padding: 16px 20px; border-radius: 14px; background: rgba(11, 16, 32, 0.9); color: #fff; font: 600 15px system-ui, sans-serif; text-align: center; font-variant-numeric: tabular-nums; touch-action: manipulation; }
      #finish[hidden] { display: none; }
      #finish .title { font-size: 18px; opacity: 0.85; }
      #finish .time { font-size: 34px; font-weight: 800; color: #ffd22e; margin: 2px 0 6px; }
      #finish .stats { display: flex; flex-direction: column; gap: 2px; opacity: 0.9; }
      #finish button { margin-top: 12px; min-height: 48px; min-width: 200px; padding: 0 18px; border: 0; border-radius: 10px; background: #ffd22e; color: #101820; font: 700 16px system-ui, sans-serif; cursor: pointer; }
      #finish .hint { margin-top: 6px; font-size: 12px; opacity: 0.65; }
      /* Point de passage atteint (lot 2b) : message bref, au-dessus du personnage, sans rien capter. */
      #toast { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 4; padding: 6px 14px; border-radius: 999px; background: rgba(11, 16, 32, 0.72); color: #fff; font: 700 15px system-ui, sans-serif; pointer-events: none; opacity: 0; white-space: nowrap; }
      #toast.show { animation: toast 1.2s ease forwards; }
      @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30%); } 12% { opacity: 1; transform: translate(-50%, -50%); } 75% { opacity: 1; } 100% { opacity: 0; } }
      #tuned { position: fixed; left: 50%; top: 54px; transform: translateX(-50%); font: 700 12px system-ui, sans-serif; color: #ffd22e; background: rgba(11, 16, 32, 0.72); padding: 2px 9px; border-radius: 6px; pointer-events: none; }
      #tuned:empty { display: none; }
      #tune { position: fixed; right: 10px; top: 10px; width: 300px; max-height: calc(100vh - 56px); overflow: auto; background: rgba(11, 16, 32, 0.88); color: #fff; font: 600 12px system-ui, sans-serif; border-radius: 10px; padding: 8px 10px; box-sizing: border-box; font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; }
      #tune[hidden] { display: none; }
      #tune .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #tune .head button { font: inherit; color: #fff; background: rgba(255, 255, 255, 0.14); border: 0; border-radius: 6px; width: 26px; height: 22px; cursor: pointer; }
      #tune.folded .body { display: none; }
      #tune .row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin-top: 7px; }
      #tune .row input { grid-column: 1 / 3; width: 100%; margin: 2px 0 0; }
      #tune .row .hint { grid-column: 1 / 3; opacity: 0.7; font-weight: 500; }
      #tune .row .hint:empty { display: none; }
      #tune .row.changed { color: #ffd22e; }
      #tune .sprint { margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.18); display: flex; flex-direction: column; }
      #tune .sprint > .hint { opacity: 0.7; font-weight: 500; margin-top: 2px; }
      #tune .sprint .switch { font: inherit; align-self: flex-start; margin-top: 6px; padding: 5px 10px; border-radius: 6px; border: 0; cursor: pointer; background: rgba(255, 255, 255, 0.14); color: #fff; }
      #tune .sprint.on .switch { background: #39ff88; color: #111; }
      #tune .sprint .row input:disabled { opacity: 0.4; }
      #tune .status { margin-top: 8px; opacity: 0.8; }
      #tune .actions { display: flex; gap: 6px; margin-top: 6px; }
      #tune .actions button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 0; cursor: pointer; background: #ffd22e; color: #111; }
      #tune .actions button + button { background: rgba(255, 255, 255, 0.14); color: #fff; }
      /* Réglages sur téléphone (?debug&tune) : ouverts par ⚙, en feuille qui prend la page et défile ; curseurs et boutons d'au moins 44 px. */
      body.touch #tune { background: rgba(11, 16, 32, 0.97); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); bottom: max(8px, env(safe-area-inset-bottom)); width: auto; max-height: none; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; z-index: 30; font-size: 14px; padding: 8px 12px 16px; }
      body.touch #tune .head { position: sticky; top: -8px; margin: -8px -12px 0; padding: 8px 12px; background: rgba(11, 16, 32, 0.96); z-index: 1; }
      body.touch #tune .head button { width: 44px; height: 44px; font-size: 18px; }
      body.touch #tune .row { margin-top: 12px; }
      body.touch #tune .row input { height: 44px; touch-action: pan-y; }
      body.touch #tune .actions { flex-wrap: wrap; }
      body.touch #tune .actions button, body.touch #tune .sprint .switch { min-height: 44px; min-width: 44px; padding: 0 14px; }
      #tune textarea.json { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #fff; background: rgba(255, 255, 255, 0.1); border: 0; border-radius: 6px; padding: 6px; user-select: text; -webkit-user-select: text; }
      #tune textarea.json[hidden] { display: none; }
      /* Commandes tactiles (lot 1b) : la couche reçoit les doigts, les boutons dessinés ne reçoivent rien. */
      #touch { position: fixed; inset: 0; z-index: 5; touch-action: none; -webkit-user-select: none; user-select: none; }
      body.touch-suspended #touch { pointer-events: none; }
      #tbuttons { position: fixed; inset: 0; z-index: 6; pointer-events: none; visibility: hidden; }
      body.touch-seen #tbuttons { visibility: visible; }
      body.touch-suspended #tbuttons { visibility: hidden; }
      .tbtn { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 22%; border: 2px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.85); font: 700 26px system-ui, sans-serif; transition: background 60ms, transform 60ms; }
      .tbtn.down { background: rgba(255, 210, 46, 0.62); border-color: #ffd22e; color: #101820; transform: scale(0.94); }
      #tbar { position: fixed; z-index: 7; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
      .tbar-right { display: flex; gap: 8px; }
      .tbar-btn { pointer-events: auto; box-sizing: border-box; width: 48px; height: 48px; padding: 0; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.45); background: rgba(11, 16, 32, 0.55); color: #fff; font: 700 24px system-ui, sans-serif; line-height: 1; touch-action: manipulation; }
      .tbar-btn:active { background: rgba(255, 210, 46, 0.6); color: #101820; }
      body.touch-suspended #tbar { display: none; }
      /* Sur téléphone, la surimpression de debug descend sous la bande haute et s'empile avec l'invitation à tourner l'écran. */
      body.touch #hud { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; position: fixed; z-index: 4; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); top: calc(var(--band) + 4px); pointer-events: none; }
      body.touch #chrono { position: static; transform: none; align-self: center; max-width: 100%; box-sizing: border-box; gap: 10px; font-size: 12px; padding: 3px 10px; }
      body.touch #chrono .time { font-size: 19px; }
      @media (max-width: 360px) { body.touch #chrono { gap: 6px; font-size: 11px; } body.touch #chrono .time { font-size: 17px; min-width: 5em; } }
      body.touch #debug, body.touch #tuned { box-sizing: border-box; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; position: static; transform: none; font-size: 11px; line-height: 1.35; background: rgba(11, 16, 32, 0.82); }
      body.touch-suspended #hud { visibility: hidden; }
      @media (max-height: 520px) { body.touch #debug { font-size: 10px; } }
      #rotate { display: none; align-self: center; box-sizing: border-box; max-width: 100%; padding: 6px 12px; border-radius: 999px; background: rgba(11, 16, 32, 0.78); color: #fff; font: 600 13px system-ui, sans-serif; text-align: center; animation: rotate-out 0.6s ease 9s forwards; }
      @media (orientation: portrait) { body.touch #rotate:not(.gone) { display: block; } }
      @keyframes rotate-out { to { opacity: 0; visibility: hidden; } }
      /* ?zones=1 */
      #zones { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
      #zones .zone { position: absolute; box-sizing: border-box; border: 1px dashed rgba(255, 255, 255, 0.7); color: rgba(255, 255, 255, 0.8); font: 600 12px system-ui, sans-serif; padding: 2px 4px; }
      #zones .zone.left { background: rgba(80, 160, 255, 0.12); }
      #zones .zone.right { background: rgba(80, 255, 160, 0.12); }
      #zones .zone.jump { background: rgba(255, 170, 60, 0.12); }
      #zones .zone.band { background: rgba(255, 80, 80, 0.12); }
      #zones .dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #ff3b6b; border: 2px solid #fff; }
      #zones .dot.jump { background: #ffaa3c; }
      /* Lot 3 : compteur du carnage (au-dessus de la couche tactile, il ne capte rien : un doigt n'importe où passe le carnage). */
      #carnage { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 16px; border-radius: 12px; background: rgba(11, 16, 32, 0.78); color: #fff; font: 700 18px system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
      #carnage[hidden] { display: none; }
      #carnage .hint { font-size: 12px; font-weight: 600; opacity: 0.7; }
      /* Sur téléphone : empilé sous le chrono, dans la colonne du HUD (jamais sur les boutons ni sur la surimpression de debug). */
      body.touch #carnage { position: static; transform: none; align-self: center; font-size: 16px; padding: 4px 12px; }
      /* Fantôme : un bouton sur ordinateur (G au clavier) ; sur téléphone, il est dans la bande haute (👻). */
      #ghostbtn { position: fixed; left: calc(max(10px, env(safe-area-inset-left)) + 112px); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4; min-height: 44px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(11, 16, 32, 0.62); color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
      #ghostbtn[aria-pressed="false"] { opacity: 0.65; }
      body.touch #ghostbtn, body.touch #pausebtn { display: none; }
      /* Lot 8 : bouton du menu ⏸ (ordinateur ; au téléphone il est dans la bande haute), et le menu : pause, réglages du joueur, commandes. */
      #pausebtn { position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4; min-height: 46px; min-width: 100px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(11, 16, 32, 0.62); color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
      #menu { position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 14px 18px 18px; border-radius: 14px; background: #0b1020; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); color: #fff; font: 600 15px/1.35 system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
      #menu[hidden] { display: none; }
      #menu h2 { margin: 0; font-size: 22px; }
      #menu h3 { margin: 14px 0 4px; font-size: 15px; color: #ffd22e; text-transform: uppercase; letter-spacing: 0.06em; }
      #menu h4 { margin: 0 0 2px; font-size: 14px; }
      #menu .mhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
      #menu .mactions { display: flex; flex-wrap: wrap; gap: 8px; }
      #menu .mbtn { box-sizing: border-box; min-height: 46px; min-width: 46px; padding: 0 16px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: #fff; font: 700 15px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
      #menu .mbtn.primary { background: #ffd22e; border-color: #ffd22e; color: #101820; }
      #menu .mbtn[aria-pressed="true"] { background: rgba(255, 210, 46, 0.22); border-color: #ffd22e; }
      #menu .mbtn:focus-visible, #menu input:focus-visible { outline: 3px solid #39c6ff; outline-offset: 2px; }
      #menu .mtoggle { display: block; width: 100%; margin-top: 8px; text-align: left; }
      #menu .mrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 8px; margin-top: 6px; }
      #menu .mrow input[type="range"] { grid-column: 1 / 3; width: 100%; height: 46px; margin: 0; accent-color: #ffd22e; touch-action: pan-y; cursor: pointer; }
      #menu .mvalue { font-variant-numeric: tabular-nums; opacity: 0.85; }
      #menu .mhint { grid-column: 1 / 3; margin: 0 0 2px; font-size: 12px; font-weight: 500; opacity: 0.7; }
      #menu .mseg { margin-top: 10px; }
      #menu .msegbtns { display: flex; gap: 6px; margin-top: 4px; }
      #menu .msegbtns .mbtn { flex: 1 1 0; padding: 0 8px; }
      #menu .mhelp { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 14px; }
      #menu .mhelp h3 { grid-column: 1 / -1; }
      #menu .mhelp ul { margin: 0; padding-left: 18px; font-size: 13px; font-weight: 500; opacity: 0.9; }
      body.paused #finish, body.paused #toast { visibility: hidden; }
      .tbar-btn[aria-pressed="false"] { opacity: 0.5; }
      /* Lot 4 : bandeau d'arrivée d'un morceau (temps de la solution, « Morceau suivant ») ; galerie des morceaux (?modules), qui défile. */
      #finish .ref:empty { display: none; }
      #finish .buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
      #finish .buttons button { margin-top: 0; min-width: 160px; }
      #finish .next { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 48px; min-width: 160px; padding: 0 18px; border-radius: 10px; background: rgba(255, 255, 255, 0.16); color: #fff; font: 700 16px system-ui, sans-serif; text-decoration: none; }
      #finish .next[hidden] { display: none; }
      #modname { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4; max-width: calc(100% - 140px); padding: 3px 10px; border-radius: 8px; background: rgba(11, 16, 32, 0.62); color: #fff; font: 600 12px system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
      #modname:empty { display: none; }
      body.touch #modname { bottom: auto; top: calc(var(--band) + 34px); }
      body.gallery > :not(#gallery) { display: none !important; }
      #gallery { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; box-sizing: border-box; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); color: #fff; font: 15px/1.4 system-ui, sans-serif; user-select: text; -webkit-user-select: text; }
      #gallery h1 { margin: 4px 0 6px; font-size: 24px; }
      #gallery .lead { margin: 0 0 10px; opacity: 0.8; }
      #gallery .entry { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
      #gallery .entry button { min-height: 46px; /* 44 px au moins, avec une marge : Firefox mesure 43,99997 px à une position fractionnaire */ min-width: 44px; padding: 0 14px; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 10px; background: transparent; color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
      #gallery .entry button[aria-pressed="true"] { background: #ffd22e; border-color: #ffd22e; color: #101820; }
      #gallery .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
      #gallery .card { min-width: 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); }
      #gallery .card h2 { margin: 0; font-size: 17px; }
      #gallery .intent { margin: 4px 0; opacity: 0.9; }
      #gallery .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
      #gallery .tag { padding: 1px 8px; border-radius: 999px; background: rgba(255, 210, 46, 0.18); color: #ffd22e; font-size: 12px; }
      #gallery .variant { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); }
      #gallery .info { display: flex; flex-direction: column; min-width: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
      #gallery .ex { color: #ffd22e; letter-spacing: 1px; }
      #gallery .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 6px; }
      #gallery .filter { display: flex; align-items: center; gap: 8px; min-width: 0; }
      #gallery .filter select { min-height: 46px; min-width: 44px; max-width: 60vw; padding: 0 10px; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 10px; background: #1b2633; color: #fff; font: 600 15px system-ui, sans-serif; touch-action: manipulation; }
      #gallery .count { margin: 0 0 10px; opacity: 0.8; font-size: 13px; }
      #gallery .card[hidden] { display: none; }
      #gallery .tag.family { background: rgba(120, 200, 255, 0.18); color: #9fd8ff; }
      #gallery .tag.long { background: rgba(140, 255, 160, 0.18); color: #a6ffb4; }
      #gallery .mut { opacity: 0.75; }
      #gallery .actions { display: flex; gap: 8px; }
      #gallery .btn { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 46px; min-width: 44px; padding: 0 14px; border-radius: 10px; background: #ffd22e; color: #101820; font-weight: 700; text-decoration: none; touch-action: manipulation; }
      #gallery .btn.watch { background: rgba(255, 255, 255, 0.14); color: #fff; }
      /* Lot 5 : ligne du niveau du jour (DailyJump #N, archive / aperçu, médaille visée) et message discret (date refusée, nouveau niveau). */
      #dayline { position: fixed; left: 50%; top: 50px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 24px); box-sizing: border-box; padding: 2px 10px; border-radius: 8px; background: rgba(11, 16, 32, 0.62); color: #fff; font: 600 13px system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
      #dayline[hidden] { display: none; }
      #daynote { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 24px); box-sizing: border-box; padding: 3px 12px; border-radius: 8px; background: rgba(11, 16, 32, 0.78); color: #ffd22e; font: 600 13px system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; display: none; }
      #daynote.show { display: block; animation: daynote-out 0.8s ease 8s forwards; }
      #daynote.show.sticky { animation: none; }
      @keyframes daynote-out { to { opacity: 0; visibility: hidden; } }
      body.daily #tuned { top: 110px; }
      body.touch #dayline, body.touch #daynote { position: static; transform: none; align-self: center; max-width: 100%; font-size: 12px; white-space: normal; text-align: center; }
      #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; color: #fff; font: 600 18px system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <div id="stamp"></div>
    <div id="hud">
      <div id="chrono" aria-live="off"><span class="time">0,000 s</span><span class="best">Meilleur —</span><span class="deaths">Morts 0</span></div>
      <div id="dayline" hidden></div>
      <div id="daynote" role="status"></div>
      <div id="carnage" role="status" hidden><span class="count"></span><span class="hint">Une commande pour passer</span></div>
      <pre id="debug" hidden></pre>
      <div id="tuned"></div>
    </div>
    <div id="toast" role="status"></div>
    <div id="tune" hidden></div>
    <div id="finish" role="dialog" aria-label="Arrivée" hidden>
      <div class="title">Arrivée !</div>
      <div class="time"></div>
      <div class="stats"><span class="ref"></span><span class="best"></span><span class="deaths"></span></div>
      <div class="buttons"><button type="button" id="finish-restart">Recommencer</button><a id="finish-next" class="next" hidden>Morceau suivant</a></div>
      <div class="hint">R, ou touche le bandeau</div>
    </div>
    <div id="modname"></div>
    <button type="button" id="pausebtn" title="Menu (Échap ou P)" aria-label="Menu">⏸ Menu</button>
    <button type="button" id="ghostbtn" aria-pressed="true" title="Fantôme (G)">👻 Fantôme : oui</button>
    <div id="nogl">WebGL n'est pas disponible dans ce navigateur : DailyJump ne peut pas s'afficher.</div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
