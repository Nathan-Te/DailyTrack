<!doctype html>
<html lang="fr" data-precharge-polices>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Lot 53 : application ajoutée à l'écran d'accueil (iPhone) ; marges de sécurité obligatoires (CLAUDE.md) -->
    <meta name="mobile-web-app-capable" content="yes" /><!-- i18n-ok -->
    <meta name="apple-mobile-web-app-capable" content="yes" /><!-- i18n-ok -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><!-- i18n-ok -->
    <meta name="apple-mobile-web-app-title" data-t-content="marque.nom" />
    <meta name="theme-color" data-jeton-content="dj-creme" />
    <meta name="robots" content="noindex" /><!-- i18n-ok -->
    <meta name="description" data-t-content="amisPage.description" />
    <!-- Lot I6 : aperçu de partage (scripts/site.mjs pose l'origine) ; l'image est celle du portail. -->
    <meta property="og:type" content="website" /><!-- i18n-ok -->
    <meta property="og:site_name" data-t-content="marque.nom" />
    <meta property="og:locale" content="fr_FR" /><!-- i18n-ok: code de langue -->
    <meta property="og:locale:alternate" content="en_GB" /><!-- i18n-ok: code de langue -->
    <meta property="og:title" data-t-content="apercu.amis.titre" />
    <meta property="og:description" data-t-content="apercu.amis.description" />
    <meta property="og:url" content="__ORIGINE_DU_SITE__/amis/" /><!-- i18n-ok: adresse -->
    <meta property="og:image" content="__ORIGINE_DU_SITE__/partage/portail.png" /><!-- i18n-ok: adresse -->
    <meta property="og:image:type" content="image/png" /><!-- i18n-ok: type de fichier -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" data-t-content="apercu.image" />
    <meta name="twitter:card" content="summary_large_image" /><!-- i18n-ok -->
    <link rel="apple-touch-icon" href="/partage/icone-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" data-icone-du-jour />
    <title data-t="amisPage.titre"></title>
  </head>
  <body>
    <!-- Lot F2 : « Mes amis » et l'accueil d'un lien d'invitation (`?invitation=`) ; lot U3 : « Amis et groupes » dans la salle de jeux (ajouter par pseudo, inviter par lien, tes amis en cartes, ton groupe) ; construit par src/amisPage.ts avec les composants
         de @cdj/ui (à la demande) ; textes des catalogues (pré-remplis en français à la construction). -->
    <main id="amis" class="portail salle amis"></main>
    <noscript>
      <nav class="portail-sans-script">
        <a href="../" data-t="marque.nom"></a>
      </nav>
    </noscript>
    <script type="module" src="../src/amisPage.ts"></script>
  </body>
</html>
