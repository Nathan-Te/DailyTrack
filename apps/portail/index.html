<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Du Jour : un jeu par jour, le même pour tous. DailyTrack et DailyJump." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e8283a'/%3E%3C/svg%3E" />
    <title>Du Jour</title>
    <style>
      :root { color-scheme: dark; --fond: #0b1020; --carte: #151c33; --texte: #eef1f8; --doux: #9aa5c4; --accent: #e8283a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
      h1 { margin: 0; font-size: 44px; letter-spacing: .02em; }
      h1 span { color: var(--accent); }
      .sous-titre { color: var(--doux); margin: 4px 0 32px; }
      #jeux { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; width: 100%; max-width: 640px; }
      .carte { display: block; background: var(--carte); border-radius: 14px; padding: 20px; color: inherit; text-decoration: none; border: 1px solid transparent; transition: border-color .15s, transform .15s; }
      .carte:hover, .carte:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
      .carte h2 { margin: 0 0 4px; font-size: 24px; }
      .numero { margin: 0; font-weight: 600; color: var(--accent); }
      .accroche { color: var(--doux); margin: 8px 0 16px; }
      .jouer { font-weight: 600; }
      footer { margin-top: auto; padding-top: 40px; color: var(--doux); font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <h1>Du <span>Jour</span></h1>
    <p class="sous-titre">Un jeu par jour, le même pour tous · <span id="date"></span></p>
    <main id="jeux">
      <!-- Sans JavaScript, les liens restent là. -->
      <a class="carte" href="track/" data-jeu="track"><h2>DailyTrack</h2><p class="accroche">Un circuit par jour, le même pour tous.</p><span class="jouer">Jouer →</span></a>
      <a class="carte" href="jump/" data-jeu="jump"><h2>DailyJump</h2><p class="accroche">Un niveau de plateforme par jour, le même pour tous.</p><span class="jouer">Jouer →</span></a>
    </main>
    <footer>Nouveau jour à minuit, heure de Paris. Ton profil est le même dans tous les jeux.</footer>
    <script type="module" src="./src/portail.ts"></script>
  </body>
</html>
