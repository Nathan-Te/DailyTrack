<!doctype html>
<html lang="fr" data-precharge-polices>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Lot 53 : application ajoutée à l'écran d'accueil (iPhone) ; marges de sécurité obligatoires (CLAUDE.md) -->
    <meta name="mobile-web-app-capable" content="yes" /><!-- i18n-ok -->
    <meta name="apple-mobile-web-app-capable" content="yes" /><!-- i18n-ok -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><!-- i18n-ok -->
    <meta name="apple-mobile-web-app-title" data-t-content="marque.nom" />
    <meta name="theme-color" data-jeton-content="dj-creme" />
    <meta name="description" data-t-content="portail.description" />
    <!-- Lot I6 : aperçu de partage (scripts/site.mjs pose l'origine, scripts/images-partage.mjs l'image) ; icônes et manifeste. -->
    <meta property="og:type" content="website" /><!-- i18n-ok -->
    <meta property="og:site_name" data-t-content="marque.nom" />
    <meta property="og:locale" content="fr_FR" /><!-- i18n-ok: code de langue -->
    <meta property="og:locale:alternate" content="en_GB" /><!-- i18n-ok: code de langue -->
    <meta property="og:title" data-t-content="apercu.titre" />
    <meta property="og:description" data-t-content="apercu.description" />
    <meta property="og:url" content="__ORIGINE_DU_SITE__/" /><!-- i18n-ok: adresse -->
    <meta property="og:image" content="__ORIGINE_DU_SITE__/partage/portail.png" /><!-- i18n-ok: adresse -->
    <meta property="og:image:type" content="image/png" /><!-- i18n-ok: type de fichier -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" data-t-content="apercu.image" />
    <meta name="twitter:card" content="summary_large_image" /><!-- i18n-ok -->
    <link rel="apple-touch-icon" href="/partage/icone-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" data-icone-du-jour />
    <title data-t="portail.titre"></title>
  </head>
  <body>
    <!-- Lot I1 : le portail est construit par src/portail.ts avec les composants de @cdj/ui ; les textes viennent des catalogues (pré-remplis
         en français à la construction : packages/ui/outils/vite.ts). Sans JavaScript, les liens restent là. -->
    <main id="portail" class="portail"></main>
    <noscript>
      <nav class="portail-sans-script">
        <a href="track/" data-t="jeu.track.nom"></a>
        <a href="jump/" data-t="jeu.jump.nom"></a>
        <!-- Lot R5 : la page des mentions légales et de la confidentialité. -->
        <a href="mentions-legales/" data-t="portail.mentions"></a>
      </nav>
    </noscript>
    <script type="module" src="./src/portail.ts"></script>
  </body>
</html>
