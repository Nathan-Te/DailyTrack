<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Images de partage — Du Jour (outil de construction)</title>
    <!--
      Lot I6 (plateforme) : la source des images de partage (Open Graph, 1200 × 630) et des icônes (« Ajouter à l'écran d'accueil »), dessinées
      selon la charte docs/plateforme/identite.md avec les jetons et les polices hébergées de @cdj/ui. Jamais servie ni construite par Vite :
      `scripts/images-partage.mjs` l'ouvre dans le Chromium de Playwright (fichier local, aucune ressource extérieure, aucun service tiers),
      photographie chaque section (`#portail`, `#track`, `#jump`, `#icone`) et range les PNG dans `partage/` du site assemblé.
      Images sans texte de langue : seulement les noms propres de la marque (DU JOUR, TRACK, JUMP), les mêmes en français et en anglais.
    -->
    <link rel="stylesheet" href="../../../packages/ui/src/jetons.css" />
    <link rel="stylesheet" href="../../../packages/ui/src/polices/archivo-black-400.css" />
    <link rel="stylesheet" href="../../../packages/ui/src/polices/barlow-condensed-800-italique.css" />
    <link rel="stylesheet" href="../../../packages/ui/src/polices/lilita-one-400.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--dj-encre);
      }
      section {
        position: relative;
        overflow: hidden;
        width: 1200px;
        height: 630px;
        background: var(--dj-creme);
        color: var(--dj-encre);
      }
      /* Le logo (charte § 2) : DU JOUR crème sur encre, coins de 3 px, ombre nette terre cuite. */
      .logo {
        position: absolute;
        display: inline-block;
        font-family: var(--dj-police-marque);
        background: var(--dj-encre);
        color: var(--dj-creme);
        border-radius: 3px;
        letter-spacing: 0.04em;
        line-height: 1;
      }
      .logo--petit {
        left: 48px;
        top: 34px;
        font-size: 34px;
        padding: 11px 17px 9px;
        box-shadow: 5px 5px 0 var(--dj-terre);
      }
      /* Une cartouche (charte § 5) : coque à bordure encre, coins 12/3, ombre nette, stries de préhension en haut, étiquette posée dedans. */
      .cartouche {
        position: absolute;
        border: 6px solid var(--dj-encre);
        border-radius: 24px 24px 6px 6px;
        box-shadow: 10px 10px 0 var(--dj-encre);
        padding: 0 22px 22px;
      }
      .stries {
        height: 26px;
        margin: 0 80px 12px;
        background: repeating-linear-gradient(90deg, var(--dj-encre) 0 6px, transparent 6px 16px);
      }
      .etiquette {
        position: relative;
        overflow: hidden;
        border-radius: 6px;
        height: 100%;
      }
      .coque-track {
        background: var(--track-coque);
      }
      .coque-jump {
        background: var(--dj-moutarde);
      }
      .etiquette-track {
        background: var(--track-asphalte);
      }
      /* Bandes de livrée (charte § 5) : rayures obliques à 115°, sur le bord droit de l'étiquette. */
      .livree {
        position: absolute;
        top: 0;
        bottom: 0;
        right: -40px;
        background: repeating-linear-gradient(115deg, var(--track-livree) 0 22px, transparent 22px 40px);
      }
      .etiquette-jump {
        background: var(--jump-jaune);
        border: 4px solid var(--dj-encre);
      }
      .nom-track {
        position: absolute;
        font-family: var(--track-police);
        font-style: italic;
        font-weight: 800;
        color: var(--track-texte);
        line-height: 0.9;
        letter-spacing: 0.02em;
      }
      .nom-jump {
        position: absolute;
        font-family: var(--jump-police);
        font-weight: 400;
        color: var(--dj-encre);
        line-height: 0.9;
      }
      /* La route de Track : une ligne de séparation en tirets. */
      .route {
        position: absolute;
        height: 10px;
        background: repeating-linear-gradient(90deg, var(--track-route) 0 54px, transparent 54px 84px);
      }

      /* --- Le portail : l'étagère et ses deux cartouches, le logo ------------------------------------------------------------------- */
      #portail .logo {
        left: 64px;
        top: 96px;
        font-size: 76px;
        padding: 22px 32px 18px;
        box-shadow: 12px 12px 0 var(--dj-terre);
      }
      #portail .etagere {
        position: absolute;
        left: 0;
        right: 0;
        top: 560px;
        height: 70px;
        background: var(--dj-creme-2);
        border-top: 8px solid var(--dj-encre);
      }
      #portail .cartouche {
        top: 186px;
        width: 260px;
        height: 374px;
        box-shadow: 10px 0 0 var(--dj-encre);
      }
      #portail .c-track {
        left: 610px;
      }
      #portail .c-jump {
        left: 902px;
        transform: rotate(2deg);
        transform-origin: bottom left;
      }
      #portail .c-track .stries,
      #portail .c-jump .stries {
        margin: 0 56px 12px;
      }
      #portail .nom-track {
        left: 18px;
        bottom: 26px;
        font-size: 62px;
      }
      #portail .livree {
        width: 96px;
      }
      #portail .nom-jump {
        left: 20px;
        bottom: 26px;
        font-size: 66px;
        text-shadow: 5px 5px 0 var(--dj-papier);
      }
      #portail .route {
        left: 20px;
        right: 110px;
        top: 52px;
      }
      #portail .phrase {
        position: absolute;
        left: 76px;
        top: 300px;
        display: flex;
        gap: 18px;
      }
      .pastille {
        width: 46px;
        height: 46px;
        border: 6px solid var(--dj-encre);
        border-radius: 50%;
      }
      .pastille--or {
        background: var(--dj-or);
      }
      .pastille--argent {
        background: var(--dj-argent);
      }
      .pastille--bronze {
        background: var(--dj-bronze);
      }
      .pastille--auteur {
        background: var(--dj-auteur);
      }

      /* --- Track : l'étiquette asphalte et sa livrée, TRACK ---------------------------------------------------------------------------- */
      #track .cartouche {
        left: 48px;
        right: 58px;
        top: 112px;
        bottom: 40px;
      }
      #track .livree {
        width: 360px;
      }
      #track .nom-track {
        left: 52px;
        top: 70px;
        font-size: 250px;
      }
      #track .route {
        left: 56px;
        right: 400px;
        bottom: 54px;
      }

      /* --- Jump : l'étiquette jaune, JUMP, le personnage et une scie ----------------------------------------------------------------- */
      #jump .cartouche {
        left: 48px;
        right: 58px;
        top: 112px;
        bottom: 40px;
      }
      #jump .nom-jump {
        left: 44px;
        top: 84px;
        font-size: 220px;
        text-shadow: 12px 12px 0 var(--dj-papier);
      }
      #jump svg {
        position: absolute;
        right: 36px;
        bottom: 0;
      }
      .scie {
        fill: var(--jump-danger);
      }
      .encre {
        fill: var(--dj-encre);
      }
      .jaune {
        fill: var(--jump-jaune);
        stroke: var(--dj-encre);
      }

      /* --- L'icône (écran d'accueil) : la cartouche de l'onglet, plein cadre (le système arrondit lui-même les coins) ------------------ */
      #icone {
        width: 512px;
        height: 512px;
        background: var(--dj-encre);
      }
      #icone .coque {
        position: absolute;
        left: 96px;
        top: 136px;
        width: 320px;
        height: 280px;
        background: var(--dj-terre);
        border-radius: 18px 18px 8px 8px;
      }
      #icone .prise {
        position: absolute;
        left: 160px;
        top: 76px;
        width: 192px;
        height: 40px;
        background: var(--dj-creme);
      }
      #icone .etiquette-icone {
        position: absolute;
        left: 136px;
        top: 188px;
        width: 240px;
        height: 176px;
        background: var(--dj-creme);
        border-radius: 8px;
      }
      #icone .du {
        position: absolute;
        left: 136px;
        top: 222px;
        width: 240px;
        text-align: center;
        font-family: var(--dj-police-marque);
        font-size: 96px;
        line-height: 1;
        color: var(--dj-encre);
      }
    </style>
  </head>
  <body>
    <section id="portail" aria-label="Du Jour">
      <span class="logo">DU JOUR</span>
      <div class="phrase" aria-hidden="true"><span class="pastille pastille--auteur"></span><span class="pastille pastille--or"></span><span class="pastille pastille--argent"></span><span class="pastille pastille--bronze"></span></div>
      <div class="etagere"></div>
      <div class="cartouche coque-track c-track">
        <div class="stries"></div>
        <div class="etiquette etiquette-track" style="height: 310px"><span class="livree"></span><span class="route"></span><span class="nom-track">TRACK</span></div>
      </div>
      <div class="cartouche coque-jump c-jump">
        <div class="stries"></div>
        <div class="etiquette etiquette-jump" style="height: 310px">
          <svg width="190" height="150" viewBox="0 0 190 150" style="position: absolute; left: 6px; top: 22px" aria-hidden="true">
            <rect class="encre" x="0" y="122" width="76" height="28" />
            <rect class="encre" x="120" y="122" width="70" height="28" />
            <rect class="jaune" x="20" y="78" width="40" height="40" rx="4" stroke-width="6" />
            <rect class="encre" x="42" y="89" width="8" height="10" />
            <g transform="translate(150 56)"><circle class="scie" r="22" /><path class="scie" d="M0-36l7 14 15-7-7 15 14 7-14 7 7 15-15-7-7 14-7-14-15 7 7-15-14-7 14-7-7-15 15 7z" /><circle class="encre" r="6" /></g>
          </svg>
          <span class="nom-jump">JUMP</span>
        </div>
      </div>
    </section>

    <section id="track" aria-label="Track — Du Jour">
      <span class="logo logo--petit">DU JOUR</span>
      <div class="cartouche coque-track">
        <div class="stries"></div>
        <div class="etiquette etiquette-track" style="height: 404px"><span class="livree"></span><span class="nom-track">TRACK</span><span class="route"></span></div>
      </div>
    </section>

    <section id="jump" aria-label="Jump — Du Jour">
      <span class="logo logo--petit">DU JOUR</span>
      <div class="cartouche coque-jump">
        <div class="stries"></div>
        <div class="etiquette etiquette-jump" style="height: 404px">
          <span class="nom-jump">JUMP</span>
          <svg width="380" height="400" viewBox="0 0 380 400" aria-hidden="true">
            <!-- Le personnage (un carré jaune à l'œil encre) sur sa plateforme, un trou, puis la scie (rouge : réservé aux dangers, charte § 3.4). -->
            <rect class="encre" x="0" y="340" width="160" height="60" />
            <rect class="encre" x="240" y="340" width="140" height="60" />
            <rect class="jaune" x="30" y="232" width="100" height="100" rx="8" stroke-width="10" />
            <rect class="encre" x="84" y="258" width="18" height="26" />
            <g transform="translate(300 190)"><circle class="scie" r="58" /><path class="scie" d="M0-92l18 36 38-18-18 38 36 18-36 18 18 38-38-18-18 36-18-36-38 18 18-38-36-18 36-18-18-38 38 18z" /><circle class="encre" r="16" /></g>
          </svg>
        </div>
      </div>
    </section>

    <section id="icone" aria-label="Du Jour">
      <span class="prise"></span>
      <span class="coque"></span>
      <span class="etiquette-icone"></span>
      <span class="du">DU</span>
    </section>
  </body>
</html>
